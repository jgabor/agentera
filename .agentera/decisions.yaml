decisions:
- number: 73
  date: 2026-06-26
  question: How should Agentera design the single primary agent to replace 12 per-capability subagents?
  context: D65 moved capability prose to TypeScript modules served via agentera prime --context, making
    per-capability subagents fetch-and-execute wrappers. Agentera's build.md and plan.md agents clobber
    OpenCode's built-in Build and Plan agents (with their own doom_loop/plan_exit/plan_enter permissions).
    A discuss deliberation resolved the design for a single replacement agent.
  alternatives:
  - name: Keep 12 scoped subagents
    status: rejected
    description: Redundant with CLI-served prose (D65) and clobbers OpenCode built-in agents.
  - name: Single Prime agent, inline execution
    status: rejected
    description: Simplest, but long-running capabilities share the primary context window and could evict
      routing history.
  - name: Single Agentera agent, Task dispatch to general subagents
    status: chosen
    description: One primary agent named Agentera with broad permissions. Loads skill for routing, fetches
      prose via prime --context, dispatches to general subagent.
  choice: Ship a single primary agent named Agentera (agentera.md, mode primary, write+bash allow). Loads
    the Agentera skill for routing (SKILL.md per D65), fetches capability prose via "agentera prime --context
    <name> --format json", and dispatches to the runtime built-in general subagent with the prose as the
    task prompt. Cross-runtime scope is OpenCode and Cursor; Claude, Codex, and Copilot use the skill
    directly with no managed agents. Body is minimal (dispatch mechanism only; no routing logic duplication).
  reasoning: D65 made per-capability subagents redundant. A single agent eliminates the Build/Plan collision
    while preserving context isolation via Task dispatch to general subagents. Broad permissions are acceptable
    because capability prose contains its own safety rails (NEVER push, NEVER modify vision.yaml, etc.).
    The name Agentera avoids confusion with the "agentera prime" CLI command that Prime would create.
    Routing stays in SKILL.md because the CLI prime command provides state and next_action suggestions,
    not request routing.
  confidence: provisional
  feeds_into: TODO.md, .opencode/agents/, .cursor/agents/, skills/agentera/SKILL.md, packages/cli/src/upgrade/runtimeMigration.ts
- number: 76
  date: 2026-06-30
  question: How should Agentera route requests to capabilities, and what role should the deterministic
    `prime --route` trigger engine play?
  context: 'Decision 75 (firm, review_needed) built a pure request-derived Layer 3-4 engine: substring/regex
    weighted-average scoring (W_REGEX=1.0, W_SUBSTRING=0.6), per-entry confidence_threshold (default 50),
    borderline-band disambiguation (default 15), and mutual exclusivity between request-derived `prime
    --route` and state-derived `next_action`. A TODO item flagged that common natural-language inputs
    ("help me decide") score below threshold (medium-priority substring-only = 42 < 50) and proposed regex
    patterns or threshold tuning. Resonera deliberation re-derived the routing model from the ground up
    and confronted a class ceiling Decision 75''s alternatives did not: a closed set of hand-authored
    patterns can never cover open-ended natural language, and the LLM host that receives the user''s message
    already routes NL better than any weighted-substring engine ever will. The audit confirmed no non-LLM
    consumer needs request-derived routing today (mobile is Cursor-SDK/LLM-driven, web is static, CLI
    state commands are deterministic).'
  alternatives:
  - name: Tune the existing engine (regex patterns, lower thresholds)
    status: rejected
    description: 'Apply the TODO fix: add patterns_regex entries for common NL phrasings (e.g. \bhelp\s+me\s+(decide|think|figure)\b
      for discuss T2) so regex weighting clears the threshold, or lower confidence_threshold for medium-priority
      substring-only triggers. Apply across all twelve capabilities.'
    reason_rejected: Permanent whack-a-mole. Closed-world pattern matching has a class ceiling on open-ended
      NL — every phrasing the author did not anticipate fails. The LLM host already understands "help
      me decide" natively; tuning a weaker router to approximate what the host already does is maintenance
      for a non-load-bearing surface.
  - name: Keep `prime --route` as a low-stakes request-intent hint input
    status: rejected
    description: 'Reposition (not retire) the engine: `--route` becomes one of several advisory signals
      the LLM consults alongside a state-readiness hint. Preserves a programmatic non-LLM routing surface
      for future consumers.'
    reason_rejected: No non-LLM consumer exists today (mobile, web, and CLI state are all LLM-driven or
      already deterministic). Maintaining a scoring engine whose NL failures are expected, to feed a hint
      the LLM does not need, buys advisory value near zero. YAGNI for a consumer that does not exist;
      defer reintroducing a programmatic router until a real non-LLM consumer appears.
  - name: Retire `--route`; evolve next_action into a ranked state-readiness hint; LLM owns routing
    status: chosen
    description: 'The LLM host owns the final route natively. The load-bearing deterministic surface becomes
      an evolved `next_action`: a ranked state-readiness hint hung on the protocol phases (envision/deliberate/plan/build/audit),
      where position 1 is always a clear recommendation and the rest are visible alternatives — plugging
      into hej''s existing recommended+alternatives dashboard pattern. `prime --route` is retired as a
      router. The trigger schema (description, disambiguates_against, priority, phase context) is repositioned
      as LLM-readable intent documentation the host consults, not a match substrate. Decision 75''s request-vs-state
      mutual exclusivity (choice 4) is dissolved — both feed the LLM as advisory context.'
    reason_chosen: 'Separates the two concerns correctly: the LLM is the only component that can route
      open-ended NL, and the deterministic value lives in state-readiness (evolved next_action), not request-pattern
      matching. Evolving next_action leverages the existing cascade (orientation.ts selectStatusNextAction:
      plan-pending, degrading health, active objective, TODO, stale health, decision follow-up, vision
      refresh) and protocol.yaml phase model rather than greenfield — delivering "much simpler than aila"
      because both halves already exist unstitched. Retire is clean because no non-LLM consumer needs
      request-derived routing today. The TODO''s "trigger tuning" symptom evaporates: "help me decide"
      routes to discuss because the LLM reads the discuss intent description, not because a regex cleared
      50.'
  choice: LLM-primary routing. Retire `prime --route` as a router and reposition the trigger schema as
    LLM-readable intent documentation (descriptions, disambiguation guidance, phase/precedence context).
    Evolve `next_action` into a ranked state-readiness hint hung on protocol phases, where position 1
    is always a clear recommendation and the rest are visible alternatives, plugging into hej's recommended+alternatives
    pattern. Dissolve Decision 75's request-vs-state mutual exclusivity; both become advisory context
    the LLM consults. Supersedes Decision 75 design choices 2 (request-derived scoring as router), 4 (mutual
    exclusivity), and 5 (pure request-derived).
  reasoning: 'Re-derived from the ground up: the trigger engine has a class ceiling on natural language
    that no threshold tuning or regex patch can lift (closed patterns cannot cover open-ended phrasing),
    yet the LLM host already routes NL natively. Therefore the load-bearing deterministic surface is state-readiness
    — the evolved next_action — not request-pattern matching, and the load-bearing authoring investment
    is decision-tree clarity the LLM reads (descriptions and disambiguation, not patterns). Evolving next_action
    rides the existing cascade and the protocol.yaml phase model plus hej''s recommended+alternatives
    render, so the work is stitching and re-exposure, not greenfield; that is what makes it simpler than
    aila''s FSM-plus-policy split. Retire is defensible because the audit found no non-LLM consumer (mobile,
    web, and CLI are all LLM-driven or deterministic) and reintroducing a programmatic router is deferred
    until a real non-LLM consumer appears. The reversal of a firm decision made yesterday is justified
    because D75 carried review_needed and its alternatives never confronted the class ceiling that the
    LLM host already routes NL better than any weighted-substring engine ever will.'
  confidence: provisional
  feeds_into: references/cli/routing-model.md, references/cli/trigger-schema-enrichment.md, skills/agentera/capability_schema_contract.yaml,
    packages/cli/src/cli/orientation.ts, packages/cli/src/routing/routeEngine.ts, .agentera/decisions.yaml,
    TODO.md
- number: 77
  date: 2026-06-30
  question: Should the probeCli flag and the in-process CLI probe in buildDoctorStatus be retired?
  context: 'The TODO ''Doctor and prime health data sources are independent and can disagree'' bundled
    three concerns: (a) prime runs buildDoctorStatus with probeCli:false while agentera doctor uses probeCli:true,
    (b) doctor status and health audit are independent and can disagree, (c) stale health audits aren''t
    surfaced. Resonera separated the concerns: doctor and health audit measure different things (app install
    vs codebase quality) and should remain independent. Health staleness is already surfaced via healthSummary''s
    stale/days_since_audit fields. The probeCli flag is v2-era debt: the in-process probe (cliProbe.ts)
    checks whether the dispatcher command set includes expected commands via a Set lookup — it does not
    spawn a subprocess. It was a safety net for Python-managed installs. In v3, file/version presence
    is sufficient.'
  alternatives:
  - name: Retire the probeCli flag, the cliProbe module, and the probe concept entirely
    status: chosen
    tradeoffs: 'Removes the flag, the probe module, and the dual-path asymmetry. File/version presence
      and install-root classification remain as the doctor''s health check. Acceptable risk: if the CLI
      binary exists but is corrupted in a way file checks don''t catch, doctor won''t detect it until
      the user runs a command.'
    win_condition: buildDoctorStatus no longer takes a probeCli option; cliProbe.ts is deleted; doctorClassifier
      no longer has the probeCli/probeRunner parameters; prime and doctor produce the same status for
      the same install; test suite passes.
  - name: Keep the probe always-on, remove only the flag
    status: rejected
    tradeoffs: 'The in-process probe is cheap, but tautological in v3: if prime is running, the dispatcher
      works.'
    reason_rejected: The probe checks whether the dispatcher exposes expected commands — but if prime
      is running, the dispatcher obviously works.
  - name: Keep the flag, document the asymmetry as intentional
    status: rejected
    tradeoffs: Prime skips the probe for startup speed; the user runs agentera doctor for the full probe.
      Documented as by design.
    reason_rejected: The user identified the probeCli flag as v2 debt, not as an intentional design choice.
      Documenting a footgun doesn't make it not a footgun.
  - name: Cross-link doctor status and health audit
    status: rejected
    tradeoffs: Make prime treat a doctor failure as a health signal and a stale audit as a doctor signal.
    reason_rejected: Doctor (app install health) and health audit (codebase quality) measure different
      things. Conflating them creates coupling where a stale audit pollutes the doctor status or a broken
      app pollutes the health grade. They should remain independent; the user reads both fields.
  choice: Retire the probeCli flag, the cliProbe.ts module, and the probe concept entirely. File/version
    presence and install-root classification are sufficient to determine app install health in v3. Stale
    health audits are already surfaced via healthSummary fields; no elevation to attention items is needed.
  reasoning: 'The probe was a v2 safety net for Python-managed installs where the binary could exist but
    fail to execute. In v3, the in-process probe is tautological: it checks whether the dispatcher exposes
    expected commands, but if prime is running, the dispatcher works. The probeCli flag created an asymmetry
    where prime and doctor could produce different statuses for the same install. Removing the flag, the
    probe module, and the probeRunner concept eliminates the asymmetry and simplifies the doctor path.'
  confidence: firm
  feeds_into: packages/cli/src/upgrade/doctor.ts, packages/cli/src/upgrade/cliProbe.ts, packages/cli/src/upgrade/doctorClassifier.ts,
    packages/cli/src/cli/commands/prime/bundleStatus.ts, packages/cli/src/upgrade/npxPlatformStatus.ts,
    packages/cli/src/cli/commands/doctor.ts, TODO.md
  outcome: Retire the probeCli flag, cliProbe.ts, and the probe concept. File/version presence and install-root
    classification determine app install health. Doctor and health audit remain independent.
- number: 78
  date: 2026-07-06
  question: How should Agentera close the opencode skill-path topology mismatch where prime reports up_to_date
    against a clean symlink opencode never loads while the host runs a diverged real directory?
  context: 'A hej/status session on feat/v3 bootstrapped via the bundled SKILL.md and executed stale v2
    commands (uvx, uv run, Swedish capability names). Checks across all five SKILL.md copies found: the
    repo source and three agentera-managed roots (~/.local/share/agentera, ~/.config/opencode/skills/agentera,
    packages/cli/bundle) are all v3.0.0 and clean; only ~/.agents/skills/agentera is a real v2.7.11 directory.
    runtimeMigration maintains a clean v3 symlink at ~/.config/opencode/skills/agentera, but opencode''s
    skill loader reads from ~/.agents/skills/agentera — a path agentera never writes. prime bundleStatus
    (bundleStatus.ts:63-65) checks installRoot, sourceRoot, and ~/.config/opencode/skills/agentera but
    omits ~/.agents/skills/agentera, while setup/doctor/opencode.ts:315 lists that same path as a default-skill-root.
    So up_to_date reports clean against a path opencode doesn''t load while the host runs stale. The standing
    docs TODO to reconcile bundled SKILL.md is misframed: the source is already v3; the defect is the
    opencode skill-path topology, not documentation. Verified against opencode.ai/docs/skills: opencode
    searches six skill locations including both ~/.config/opencode/skills/<name>/ (opencode-specific)
    and ~/.agents/skills/<name>/ (agent-compatible, industry path), and requires skill names unique across
    all — so a skill present in both is itself the configuration error that let opencode load the stale
    copy.'
  alternatives:
  - name: Detect + repair via topology reconciliation
    status: chosen
    tradeoffs: Add ~/.agents/skills/agentera to bundleStatus candidates (detect; never false up_to_date)
      and have upgrade maintain that path as a symlink to the canonical source (repair; retiring the ~/.config/opencode/skills
      symlink per the opencode doc's cross-location uniqueness rule). Closes the loop end-to-end so the
      host can't silently run v2 again, and adopts ~/.agents/skills as the canonical agent-compatible
      root.
    win_condition: prime reports up_to_date only when ~/.agents/skills/agentera matches the canonical
      source; upgrade converts a divergent real directory at that path to a symlink and retires the ~/.config/opencode/skills/agentera
      symlink; ~/.agents/skills becomes the canonical agent-compatible root, with direction to deprecate
      runtime-specific skill dirs for runtimes natively supporting ~/.agents/skills; the Reconcile bundled
      SKILL.md TODO is re-scoped to the topology fix rather than a source edit.
  - name: Detect-only (surface divergence, host reinstalls)
    status: rejected
    tradeoffs: Add the path to bundleStatus candidates so prime surfaces staleness; host or opencode reinstalls.
      Keeps agentera's write boundary narrow.
    reason_rejected: agentera already recognizes ~/.agents/skills/agentera as a default-skill-root (opencode.ts:315).
      Detect-only leaves the repair loop open — the divergence that broke this session's bootstrap would
      recur silently until a manual reinstall.
  - name: Overwrite-in-place (second real copy)
    status: rejected
    tradeoffs: Copy canonical skills/agentera over ~/.agents/skills/agentera on each upgrade when diverged.
      Pragmatic and fast.
    reason_rejected: Keeps a second real copy alongside the managed home; divergence can recur unless
      paired with a drift gate, and it diverges from agentera's existing single-source symlink topology.
  - name: Treat as a docs task (reconcile the source SKILL.md)
    status: rejected
    tradeoffs: Edit skills/agentera/SKILL.md to remove v2 references.
    reason_rejected: The source is already v3-clean (npx, English names, prime --context). The v2 commands
      executed this session came from the ~/.agents straggler install, not the source. Editing the source
      would do nothing.
  choice: Detect + repair via topology reconciliation. Add ~/.agents/skills/agentera to bundleStatus candidate
    list so prime never reports up_to_date while the host-loaded copy is diverged; have upgrade maintain
    ~/.agents/skills/agentera as a symlink to the canonical source as the canonical agent-compatible root;
    and retire the ~/.config/opencode/skills/agentera symlink (justified by the opencode doc's cross-location
    uniqueness rule — opencode loads from both paths, so a duplicate skill name is itself the config error).
    Broader direction — standardize on ~/.agents/skills as the single skill root for runtimes natively
    supporting it (OpenCode, Claude-compatible, Pi); deprecate their runtime-specific skill dirs; keep
    runtime-specific dirs only for runtimes lacking native ~/.agents/skills support (verify per-runtime
    during build).
  reasoning: The defect is neither broken install propagation nor stale documentation. agentera's managed
    locations are all v3.0.0 and clean and the source is clean; the defect is that agentera symlinks the
    opencode-skill path opencode doesn't load (~/.config/opencode/skills) while leaving diverged the path
    opencode does load (~/.agents/skills). bundleStatus checks the clean symlink, declares up_to_date,
    and the host runs the stale real directory. Reconciling the topology — detecting staleness at the
    host-loaded path and repairing it to a symlink, and retiring the opencode-specific symlink per the
    doc's uniqueness rule — matches agentera's existing runtimeMigration pattern and structurally prevents
    recurrence while standardizing on the agent-compatible root.
  confidence: provisional
  feeds_into: packages/cli/src/cli/commands/prime/bundleStatus.ts, packages/cli/src/upgrade/runtimeMigration.ts,
    packages/cli/src/setup/doctor/opencode.ts, packages/cli/src/upgrade/appContentRefresh.ts, TODO.md
  outcome: 'P1 (CLI): bundleStatus adds ~/.agents/skills/agentera to its candidate list so prime surfaces
    staleness there as attention and never reports up_to_date while diverged; upgrade maintains ~/.agents/skills/agentera
    as a symlink to the canonical source (the canonical agent-compatible root) and RETIRES the ~/.config/opencode/skills/agentera
    symlink — the opencode doc confirms opencode loads from both paths and requires skill names unique
    across locations, so the duplicate is the error. Broader direction: standardize on ~/.agents/skills
    as the single skill root for runtimes natively supporting it (OpenCode, Claude-compatible, Pi); deprecate
    their runtime-specific skill dirs; keep runtime-specific dirs only for runtimes lacking native ~/.agents/skills
    support (verify per-runtime during build — e.g. Cursor, GitHub Copilot, Codex). P2 (docs) folds into
    the existing Audit and review status capability instructions TODO — strip the RESOLVED_AGENTERA_HOME
    and v2 resolver-flow remnant from packages/cli/src/capabilities/status/instructions.ts. The Reconcile
    bundled SKILL.md TODO is re-scoped: source is already v3, so the fix is P1''s topology repair, not
    a source edit. Sequence P1 first (it silently broke bootstrap); P2 second. Symlink target (repo source
    vs managed app home) and dead-code retirement are implementation details for plan/build.'
- number: 79
  date: 2026-07-06
  question: How should the status capability prose be designed to maximize effectiveness and token efficiency
    under the v3 source_contract.capability_startup contract, and which v2-era residue should be cut from
    the most frequently invoked capability surface?
  context: Status is invoked on every /agentera session — first impression and the most frequently called
    capability. Per D57 (firm) the instructions.ts module is canonical; per D65 (firm) the runtime serves
    it via agentera prime --context <name>. Per D71 (firm but unreflected in status prose) RFC 2119 modal
    vocabulary is the convention enforced in capability_schema_contract.yaml#modal_vocabulary. Per D72
    (firm but straggler in status prose) the bundle to app rename landed in prime output but status prose
    still said bundle.status. The source_contract.capability_startup field declares complete_for_capability_startup=true
    and raw_artifact_reads_required=false, providing a machine-readable startup contract; the prose nonetheless
    triple-stated the rule (use prime, do not read raw .yaml), restated forbidden-command lists (drifted
    — prose forbade agentera plan while v3 uses agentera state plan), re-enumerated all protocol token
    IDs (drift risk versus protocol.yaml), and inlined ~3K chars of install-recovery procedure (AGENTERA_HOME
    broken-copy, 1.x managed marker cleanup, npx skills update cross-runtime leak, bundle.status inspection
    gate) that belongs to the upgrade capability and agentera doctor command. SKILL.md and instructions.ts
    both defined the dashboard rendering contract with drifted shapes (SKILL.md said health/todo/plan/objective/profile;
    instructions.ts said health/todo/plan/optim/profile — different field orders; SKILL.md showed all
    four severities on todo summary; instructions.ts drops normal and routes it through attention). Discuss
    ran a five-question deliberation over philosophy, ownership, scope, structure, and synthesis mode.
  alternatives:
  - name: Direct contract — lean on source_contract; status owns dashboard
    status: chosen
    tradeoffs: Prose only states what the contract cannot encode (dashboard template, routing priority
      tree, exit markers, safety rails, conventions). Source_contract.capability_startup mechanizes what
      the prose previously re-encoded (complete_for_capability_startup, raw_artifact_reads_required, cli_fallback
      list). Cuts ~7K chars of redundant rules (-42% total). Status prose owns the dashboard contract;
      SKILL.md delegates. Trust that the runtime serves the prose via prime --context (D65) and that the
      source_contract fields are machine-readable by capable models.
    win_condition: Prose drops to ~10K chars; v2-era field and command names gone (no bundle.status, no
      agentera plan, no --install-root, no AGENTERA_HOME resolver); SKILL.md dashboard block replaced
      with a pointer to status prose; routing priority tree and exit markers preserved verbatim; D71 modal
      vocab applied throughout; D72 terminology applied throughout.
  - name: Self-contained operator manual — defense-in-depth
    status: rejected
    tradeoffs: Preserve every rule in prose. Apply D71 + D72.
    reason_rejected: Duplication persists and drift will recur on the next contract change; proven drift
      in this audit (forbidden-command list said agentera plan while v3 uses agentera state plan; prose
      gated on bundle.status while prime emits app.status). Defense-in-depth is the source_contract's
      job — the contract field is the canonical, machine-readable declaration; re-stating it in prose
      waters down the contract as the source of truth. D71 modal vocab is the weak-model mitigation (RFC
      2119 keywords), not prose duplication.
  - name: Hybrid — contract spine + relocated recovery
    status: rejected
    tradeoffs: Lean on contract for startup; keep AGENTERA_HOME recovery flow with a pointer to references/cli/upgrade-repair-wording.md.
    reason_rejected: Keeps the procedural content somewhere — adds a pointer to maintain. Status's actual
      rendering obligation for upgrade state is one paragraph (render project_integration.message; preview
      dry-run; ask before apply); the procedural recovery content is upgrade/doctor capability territory,
      not status. A pointer is unnecessary; the rendering rule is what stays.
  choice: Direct contract — lean on source_contract.capability_startup; status prose owns the dashboard
    rendering contract (SKILL.md delegates); cut all procedural install-recovery content (status renders
    project_integration fields when present and routes to upgrade/doctor for procedure); three-phase structure
    (Dashboard rendering then Briefing then Routing suggestion); apply D71 RFC 2119 modal vocabulary throughout;
    apply D72 bundle-to-app terminology throughout.
  reasoning: The source_contract.capability_startup field exists to be the machine-readable contract between
    the CLI and the host; re-encoding it in prose creates a second source of truth that drifts, as proven
    by the audit findings (forbidden-command list drift, bundle.status straggler). Status's actual obligations
    are (1) render the dashboard per a canonical template, (2) suggest a concrete next action with a named
    artifact item, (3) emit a mandatory exit marker, (4) stay read-only. Procedural install recovery belongs
    to the upgrade capability and agentera doctor command, not status. Owning the dashboard template in
    status prose (where the only job is briefing and routing) aligns ownership with responsibility and
    eliminates the SKILL.md and instructions.ts drift class. D71 modal vocab addresses the weak-model
    failure mode (instructions read literally as user commands) without duplicating contract-encoded rules.
  confidence: firm
  feeds_into: packages/cli/src/capabilities/status/instructions.ts, skills/agentera/SKILL.md, skills/agentera/capabilities/status/schemas/triggers.yaml,
    skills/agentera/capabilities/status/schemas/validation.yaml, references/cli/routing-model.md, capability_schema_contract.yaml,
    TODO.md
  outcome: 'Status prose rewritten from 18,035 to 10,389 chars (-42%). Three phases (Dashboard rendering
    then Briefing then Routing suggestion). D71 RFC 2119 modal vocab applied (5 MUST, 5 MUST NOT). D72
    terminology applied (bundle fields replaced with app fields). v2-era residue cut: AGENTERA_HOME broken-copy
    recovery (~1.5K), 1.x managed marker paragraph, npx skills update cross-runtime leak, bundle.status
    gate procedure, Step 0.5 CLI-owned checks (~1K), triple-stated do-not-read-raw-yaml rules (~800),
    duplicate forbidden-command list (~400, also v2-era agentera plan names), contract-values token enumeration
    (~400, replaced with one-line reference to protocol.yaml), artifact-path-resolution subsection (~700,
    delegated to SKILL.md), agentera query reference (unported — actual v3 is agentera state query), PROFILE.md
    global path detail (prime profile.path surfaces), PROGRESS.md recency heuristic mention (prime health.stale
    surfaces). Generic greeting wording rephrased to conversational smalltalk — drops greeting terminology
    entirely. SKILL.md dashboard rendering block (22 lines) replaced with 7-line pointer delegating to
    status prose. triggers.yaml T2 entry dropped hello/hi greeting patterns and Greetings description
    (relics from when status was named hej). routing-model.md Layer 1 hej mention and Layer 5 greetings
    mention cleaned up. 1271/1271 vitest green; typecheck 0 errors; capability validation PASS; capability-contract
    self-validation PASS; protocol internally consistent; artifact compaction within budget. Preserved
    verbatim (routing priority tree with 8-bullet decision logic plus anti-regression rule, ASCII dashboard
    template, ≤120-word output constraint, exit marker rule with EX1-EX4, 6 safety rails with D71 modal
    cleanup, cross-capability integration paragraph). TODO.md status-audit task and prose-to-instructions
    rename task marked resolved in this commit. Satisfaction deferred to the user per discuss rules.'
- number: 80
  date: 2026-07-06
  question: How should capability instruction structure be standardized across all 12 capabilities, using
    status (D79) as the reference implementation while retaining each capability's unique workflow shape?
  context: 'D79 (firm) rewrote the status capability prose using direct-contract philosophy, three-phase
    structure, and D71/D72 modal vocabulary and terminology cleanup. The 11 remaining capability audits
    (TODO.md lines 17-27) need a shared design principle to audit against. D71 (firm) RFC 2119 modal vocabulary
    is applicable to all 12. D57/D65 (firm) make instructions.ts the canonical module served via agentera
    prime --context. A survey of all 12 capability instructions.ts files found five universal sections
    already present across all 12 (Purpose/Visual identity, State artifacts, Safety rails, Exit signals,
    Cross-capability integration) plus a sixth (Workflow phases) with four-plus genuinely different shapes:
    linear (status, research, audit), conversational loop (discuss), cycle-based (build, optimize), mode-split
    (vision, document, profile, design, plan), and multi-surface orchestration (orchestrate). Three capabilities
    also have domain-specific content sections that do not fit the spine (design: Colors/Typography; profile:
    PROFILE.md template; research: deliverable template). Discuss ran a deliberation over abstraction
    level, spine sections, mandatory vs per-capability scope, shape-constraint risk, output artifacts,
    and audit cadence.'
  alternatives:
  - name: Six-section spine, five constrained plus Workflow free-form
    status: chosen
    tradeoffs: 'A common skeleton (Purpose, State artifacts, Workflow phases, Safety rails, Exit signals,
      Cross-capability integration) that all 12 share. Five low-risk sections are shape-constrained. Workflow
      phases is mandatory-as-section but free-form in content. Domain content sections (design: Colors/Typography;
      profile: PROFILE.md template; research: deliverable template) are per-capability optional flex sections.
      Getting started use-case examples fold into Cross-capability integration as the inverse of feeds-into/triggers/informed-by.
      Personality sections relocate to vision artifact or SOUL.md (tracked as TODO). Status (D79) is the
      reference implementation. references/cli/capability-instruction-structure.md captures the spine
      spec, five workflow shapes as named taxonomy, and a per-capability deviation table filled incrementally
      as each audit completes.'
  - name: Single template, all 12 conform
