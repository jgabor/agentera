decisions:
  - number: 79
    date: 2026-07-06
    question: How should the status capability prose be designed to maximize
      effectiveness and token efficiency under the v3
      source_contract.capability_startup contract, and which v2-era residue
      should be cut from the most frequently invoked capability surface?
    context: Status is invoked on every /agentera session — first impression and the
      most frequently called capability. Per D57 (firm) the instructions.ts
      module is canonical; per D65 (firm) the runtime serves it via agentera
      prime --context <name>. Per D71 (firm but unreflected in status prose) RFC
      2119 modal vocabulary is the convention enforced in
      capability_schema_contract.yaml#modal_vocabulary. Per D72 (firm but
      straggler in status prose) the bundle to app rename landed in prime output
      but status prose still said bundle.status. The
      source_contract.capability_startup field declares
      complete_for_capability_startup=true and
      raw_artifact_reads_required=false, providing a machine-readable startup
      contract; the prose nonetheless triple-stated the rule (use prime, do not
      read raw .yaml), restated forbidden-command lists (drifted — prose forbade
      agentera plan while v3 uses agentera state plan), re-enumerated all
      protocol token IDs (drift risk versus protocol.yaml), and inlined ~3K
      chars of install-recovery procedure (AGENTERA_HOME broken-copy, 1.x
      managed marker cleanup, npx skills update cross-runtime leak,
      bundle.status inspection gate) that belongs to the upgrade capability and
      agentera doctor command. SKILL.md and instructions.ts both defined the
      dashboard rendering contract with drifted shapes (SKILL.md said
      health/todo/plan/objective/profile; instructions.ts said
      health/todo/plan/optim/profile — different field orders; SKILL.md showed
      all four severities on todo summary; instructions.ts drops normal and
      routes it through attention). Discuss ran a five-question deliberation
      over philosophy, ownership, scope, structure, and synthesis mode.
    alternatives:
      - name: Direct contract — lean on source_contract; status owns dashboard
        status: chosen
        tradeoffs: Prose only states what the contract cannot encode (dashboard
          template, routing priority tree, exit markers, safety rails,
          conventions). Source_contract.capability_startup mechanizes what the
          prose previously re-encoded (complete_for_capability_startup,
          raw_artifact_reads_required, cli_fallback list). Cuts ~7K chars of
          redundant rules (-42% total). Status prose owns the dashboard
          contract; SKILL.md delegates. Trust that the runtime serves the prose
          via prime --context (D65) and that the source_contract fields are
          machine-readable by capable models.
        win_condition: Prose drops to ~10K chars; v2-era field and command names gone
          (no bundle.status, no agentera plan, no --install-root, no
          AGENTERA_HOME resolver); SKILL.md dashboard block replaced with a
          pointer to status prose; routing priority tree and exit markers
          preserved verbatim; D71 modal vocab applied throughout; D72
          terminology applied throughout.
      - name: Self-contained operator manual — defense-in-depth
        status: rejected
        tradeoffs: Preserve every rule in prose. Apply D71 + D72.
        reason_rejected: Duplication persists and drift will recur on the next contract
          change; proven drift in this audit (forbidden-command list said
          agentera plan while v3 uses agentera state plan; prose gated on
          bundle.status while prime emits app.status). Defense-in-depth is the
          source_contract's job — the contract field is the canonical,
          machine-readable declaration; re-stating it in prose waters down the
          contract as the source of truth. D71 modal vocab is the weak-model
          mitigation (RFC 2119 keywords), not prose duplication.
      - name: Hybrid — contract spine + relocated recovery
        status: rejected
        tradeoffs: Lean on contract for startup; keep AGENTERA_HOME recovery flow with a
          pointer to references/cli/upgrade-repair-wording.md.
        reason_rejected: Keeps the procedural content somewhere — adds a pointer to
          maintain. Status's actual rendering obligation for upgrade state is
          one paragraph (render project_integration.message; preview dry-run;
          ask before apply); the procedural recovery content is upgrade/doctor
          capability territory, not status. A pointer is unnecessary; the
          rendering rule is what stays.
    choice: Direct contract — lean on source_contract.capability_startup; status
      prose owns the dashboard rendering contract (SKILL.md delegates); cut all
      procedural install-recovery content (status renders project_integration
      fields when present and routes to upgrade/doctor for procedure);
      three-phase structure (Dashboard rendering then Briefing then Routing
      suggestion); apply D71 RFC 2119 modal vocabulary throughout; apply D72
      bundle-to-app terminology throughout.
    reasoning: The source_contract.capability_startup field exists to be the
      machine-readable contract between the CLI and the host; re-encoding it in
      prose creates a second source of truth that drifts, as proven by the audit
      findings (forbidden-command list drift, bundle.status straggler). Status's
      actual obligations are (1) render the dashboard per a canonical template,
      (2) suggest a concrete next action with a named artifact item, (3) emit a
      mandatory exit marker, (4) stay read-only. Procedural install recovery
      belongs to the upgrade capability and agentera doctor command, not status.
      Owning the dashboard template in status prose (where the only job is
      briefing and routing) aligns ownership with responsibility and eliminates
      the SKILL.md and instructions.ts drift class. D71 modal vocab addresses
      the weak-model failure mode (instructions read literally as user commands)
      without duplicating contract-encoded rules.
    confidence: firm
    feeds_into: packages/cli/src/capabilities/status/instructions.ts,
      skills/agentera/SKILL.md,
      skills/agentera/capabilities/status/schemas/triggers.yaml,
      skills/agentera/capabilities/status/schemas/validation.yaml,
      references/cli/routing-model.md, capability_schema_contract.yaml, TODO.md
    outcome: "Status prose rewritten from 18,035 to 10,389 chars (-42%). Three
      phases (Dashboard rendering then Briefing then Routing suggestion). D71
      RFC 2119 modal vocab applied (5 MUST, 5 MUST NOT). D72 terminology applied
      (bundle fields replaced with app fields). v2-era residue cut:
      AGENTERA_HOME broken-copy recovery (~1.5K), 1.x managed marker paragraph,
      npx skills update cross-runtime leak, bundle.status gate procedure, Step
      0.5 CLI-owned checks (~1K), triple-stated do-not-read-raw-yaml rules
      (~800), duplicate forbidden-command list (~400, also v2-era agentera plan
      names), contract-values token enumeration (~400, replaced with one-line
      reference to protocol.yaml), artifact-path-resolution subsection (~700,
      delegated to SKILL.md), agentera query reference (unported — actual v3 is
      agentera state query), PROFILE.md global path detail (prime profile.path
      surfaces), PROGRESS.md recency heuristic mention (prime health.stale
      surfaces). Generic greeting wording rephrased to conversational smalltalk
      — drops greeting terminology entirely. SKILL.md dashboard rendering block
      (22 lines) replaced with 7-line pointer delegating to status prose.
      triggers.yaml T2 entry dropped hello/hi greeting patterns and Greetings
      description (relics from when status was named hej). routing-model.md
      Layer 1 hej mention and Layer 5 greetings mention cleaned up. 1271/1271
      vitest green; typecheck 0 errors; capability validation PASS;
      capability-contract self-validation PASS; protocol internally consistent;
      artifact compaction within budget. Preserved verbatim (routing priority
      tree with 8-bullet decision logic plus anti-regression rule, ASCII
      dashboard template, ≤120-word output constraint, exit marker rule with
      EX1-EX4, 6 safety rails with D71 modal cleanup, cross-capability
      integration paragraph). TODO.md status-audit task and
      prose-to-instructions rename task marked resolved in this commit.
      Satisfaction deferred to the user per discuss rules."
  - number: 80
    date: 2026-07-06
    question: How should capability instruction structure be standardized across all
      12 capabilities, using status (D79) as the reference implementation while
      retaining each capability's unique workflow shape?
    context: "D79 (firm) rewrote the status capability prose using direct-contract
      philosophy, three-phase structure, and D71/D72 modal vocabulary and
      terminology cleanup. The 11 remaining capability audits (TODO.md lines
      17-27) need a shared design principle to audit against. D71 (firm) RFC
      2119 modal vocabulary is applicable to all 12. D57/D65 (firm) make
      instructions.ts the canonical module served via agentera prime --context.
      A survey of all 12 capability instructions.ts files found five universal
      sections already present across all 12 (Purpose/Visual identity, State
      artifacts, Safety rails, Exit signals, Cross-capability integration) plus
      a sixth (Workflow phases) with four-plus genuinely different shapes:
      linear (status, research, audit), conversational loop (discuss),
      cycle-based (build, optimize), mode-split (vision, document, profile,
      design, plan), and multi-surface orchestration (orchestrate). Three
      capabilities also have domain-specific content sections that do not fit
      the spine (design: Colors/Typography; profile: PROFILE.md template;
      research: deliverable template). Discuss ran a deliberation over
      abstraction level, spine sections, mandatory vs per-capability scope,
      shape-constraint risk, output artifacts, and audit cadence."
    alternatives:
      - name: Six-section spine, five constrained plus Workflow free-form
        status: chosen
        tradeoffs: "A common skeleton (Purpose, State artifacts, Workflow phases, Safety
          rails, Exit signals, Cross-capability integration) that all 12 share.
          Five low-risk sections are shape-constrained. Workflow phases is
          mandatory-as-section but free-form in content. Domain content sections
          (design: Colors/Typography; profile: PROFILE.md template; research:
          deliverable template) are per-capability optional flex sections.
          Getting started use-case examples fold into Cross-capability
          integration as the inverse of feeds-into/triggers/informed-by.
          Personality sections relocate to vision artifact or SOUL.md (tracked
          as TODO). Status (D79) is the reference implementation.
          references/cli/capability-instruction-structure.md captures the spine
          spec, five workflow shapes as named taxonomy, and a per-capability
          deviation table filled incrementally as each audit completes."
      - name: Single template, all 12 conform
        status: rejected
        tradeoffs: One structure all capabilities inherit. Maximally consistent.
        reason_rejected: "Forces capabilities into a shape that does not fit — discuss
          scratchpad loop into a linear phase model, build/optimize cycles into
          step-numbered phases, orchestrate three surface templates into a
          single workflow. Proven risk: the four-plus genuinely different
          workflow shapes resist a single template without flattening the
          distinctions that make each capability effective."
      - name: Minimal shared rules, per-capability self-determination
        status: rejected
        tradeoffs: Only cross-cutting rules (D71 modal vocab, direct contract, mandatory
          exit marker, output budget). Each capability owns its own phase
          structure, section ordering, and procedural depth. No spine.
        reason_rejected: Too loose — no spine to audit against. The 11 remaining audits
          would each discover the same structural principles independently or
          miss them entirely. D79 direct-contract philosophy would not propagate
          without a capturing decision.
    choice: "Six-section spine (Purpose, State artifacts, Workflow phases, Safety
      rails, Exit signals, Cross-capability integration). Five low-risk sections
      shape-constrained (Purpose: glyph plus one-paragraph purpose; State
      artifacts: reads/writes/consumes plus path resolution with per-capability
      artifact-schema subsections allowed; Safety rails: critical block with
      MUST NOT rules; Exit signals: EX1-EX4 with glyph marker; Cross-capability
      integration: feeds-into, triggers, informed-by, plus getting-started
      use-case examples folded in as the inverse of feeds-into/triggers).
      Workflow phases is mandatory-as-section but free-form in content. Domain
      content sections are per-capability optional flex sections. Five workflow
      shapes named as taxonomy: linear (status, research, audit), loop
      (discuss), cycle (build, optimize), mode-split (vision, document, profile,
      design, plan), multi-surface (orchestrate). Status (D79) is the reference
      implementation. D80 plus
      references/cli/capability-instruction-structure.md are the output
      artifacts. Each future capability audit runs as a discuss session against
      D80 plus the reference doc; the reference doc deviation table is filled
      incrementally."
    reasoning: The five low-risk sections are already universal across all 12
      capabilities and are either protocol-bound (Safety rails, Exit signals) or
      structurally consistent (Purpose, State artifacts, Cross-capability
      integration). Shape-constraining them is safe and eliminates drift.
      Workflow phases has four-plus genuinely different shapes that resist a
      single template — constraining them would flatten discuss conversational
      loop into fake linear steps, force cycle-based capabilities into
      step-numbered phases that do not capture the iterative nature, or squeeze
      orchestrate multi-surface model into a single workflow. The five-shape
      taxonomy names the variation without constraining it. The reference doc
      deviation table captures where each capability diverges from the spine,
      filled incrementally during each audit. Getting started folds into
      Cross-capability integration because invocation guidance is the inverse of
      feeds-into/triggers — same relationship, consumer perspective. Personality
      sections relocate to vision artifact or SOUL.md because conversational
      voice rules belong in identity, not per- capability prose. Status serves
      as the concrete reference implementation because it is the only capability
      already rewritten under direct-contract philosophy with D71/D72 applied.
    confidence: firm
    feeds_into: packages/cli/src/capabilities/<name>/instructions.ts,
      references/cli/capability-instruction-structure.md,
      capability_schema_contract.yaml, TODO.md
    outcome: Decision captured. references/cli/capability-instruction-structure.md
      carries the spine spec, five workflow shapes taxonomy, per-capability
      deviation table skeleton (11 rows marked not-yet-audited, status marked
      complete via D79), and domain content flex section guidance. TODO.md
      receives Personality-relocation entry. The 11 remaining capability TODOs
      (lines 17-27) now run against D80 plus the reference doc.
  - number: 81
    date: 2026-07-06
    question: How should the vision capability instructions be audited and rewritten
      to align with D80's six-section spine, retire v2-era residue, and adopt
      the D79 direct-contract philosophy while preserving vision's
      Socratic-conversation character?
    context: "D80 (firm) sets the six-section spine; D79 (firm) set status as the
      reference implementation with direct-contract delegation, D71 modal vocab,
      D72 bundle-to-app terminology, and v2-era residue retired. TODO.md line 16
      lists the vision capability audit as a v3.0.0 docs task. A pre-flight
      survey of vision's existing 17,076-char instructions found 25 drift
      findings: v2-era command references (agentera describe, agentera lint,
      agentera decisions, agentera query), v2-era env var resolver flow
      ($AGENTERA_PROFILE_DIR / $XDG_DATA_HOME), v2-era canonical filenames
      (CLAUDE.md, PROGRESS.md as direct reads when prime already serves them via
      vision_startup_context), hand-enumerated protocol token ID block
      duplicates protocol.yaml, host-bootstrap Artifact path resolution
      subsection duplicates SKILL.md lines 143-156, ghost contract Section 24
      reference (contract.md ends at Section 23 in v3), triple-stated
      exit-marker obligations, duplicated Step 4 pre-write self-audit block
      between Create and Refine modes, six-arc Socratic conversation (effective)
      wrapped in narration-voice riffs (drift), Getting started section placed
      outside D80 §6 Cross-capability integration, validation V6
      principle_brevity rule declared but linter does not enforce and live
      vision.yaml intentionally violates. Ground-up workflow review surfaced six
      substantive decision points: Step 0 handshake with prime --context vision,
      CLI-driven mode detection via source.exists, Replace mode reads archived
      vision as corrective context, profile-stale handling, principle brevity
      rule fate, and whether to add a 7th Socratic arc for anti-vision.
      Personality/SOUL.md TODO entry (line 48) flagged a conflict: Step 3's
      hardcoded 'sharp colleague' personality duplicating the vision artifact's
      identity.voice field."
    alternatives:
      - name: D79-pure direct-contract adoption with personality-neutral Step 3,
          mode-split shape preserved
        status: chosen
        tradeoffs: "Adopts the D79 direct-contract clause as the opening paragraph
          (vision MUST source state from agentera prime --context vision; trust
          source_contract.capability_startup_complete; cli_fallback only as last
          resort). Step 1 sources bundled state from vision_startup_context
          (progress, health, todo, profile path) and runs cli_fallback only for
          fallback_only families (decisions, vision self, design). Filesystem
          reads preserved for items prime does not surface: directory structure,
          dependency manifests, README.md, AGENTS.md, source files, DESIGN.md at
          project root, git log. Step 3 adopts vision artifact identity.voice
          when available; before a vision exists (Create greenfield), runs with
          neutral operational stance (Socratic, push past safe answers) and lets
          personality emerge from arc 5 (identity) captured into the new
          artifact — this prevents the capability from pre-empting the user's
          articulation and preserves the per-project identity principle. Step 0
          handshake made explicit; mode detection CLI-driven via agentera state
          query vision source.exists; Replace mode reads archived
          vision-{date}.yaml as corrective context; Pre-write self-audit hoisted
          (DRY) and referenced from both Create and Refine Step 4; Visual
          identity stub folded into Purpose (no §1 sub-sections per D80);
          Getting started folded into §6 as Invocation guidance per D80 §6. v2
          residue retired: 5 command forms corrected, env-var resolver flow
          removed, contract Section 24 ghost cut, triple-stated exit-marker
          decoration collapsed to Exit-signals section only, narration-voice
          riffs cut to one Step 3 operational-stance line, host-bootstrap
          Artifact path resolution subsection delegated to SKILL.md,
          Contract-values token enumeration block removed (protocol.yaml is the
          authority). Principle brevity rule cut from prose Output constraint
          and validation V6 with ID gap preserved (linter never enforced;
          abstraction and filler checks cover principle quality holistically).
          Validation V7 (exit_marker_required) unchanged. Anti-vision question
          folded into Step 3 arc 4 (The Direction) as a sub-prompt rather than
          expanded into a 7th arc. Profile-stale handling added: carry caveat
          forward; never invoke profile to refresh during a vision cycle (added
          as MUST NOT safety rail). Result: 17,076 → 16,667 chars (-2.4% after
          subagent-driven prose-tightening pass; below original). Modal vocab 3
          MUST + 9 MUST NOT + 4 SHOULD, higher than status because vision writes
          artifacts and has more protocol-force rules). Prose-tightening pass
          (subagent-driven) trimmed redundant restatements, speculative
          commentary, and duplicate mode-header boilerplate while preserving all
          substantive audit decisions: 17,678 → 16,667 (-5.7% from initial
          rewrite; below original 17,076 — vision's Socratic 6-arc narrative and
          vision.yaml shape block justify a longer floor than status's 10,389;
          modal vocab 3 MUST + 9 MUST NOT + 4 SHOULD, higher than status because
          vision writes artifacts and has more protocol-force rules). New
          D80-rule: capability instructions MUST NOT hardcode personality when
          an owning artifact (vision.yaml identity) defines it; reference the
          artifact, do not re-assert its content."
      - name: Aggressive cut to match status length (~10,000 chars)
        status: rejected
        tradeoffs: Match status's 10,389-char floor by cutting the Socratic 6-arc
          conversation or the cross-capability integration surface.
        reason_rejected: "Vision's effectiveness depends on the Socratic conversation:
          the 6 arcs map 1:1 to the vision.yaml sections (north_star, personas,
          principles, direction, identity, tension). Cutting arcs would break
          the artifact-shape contract. Cross-capability integration has 7 named
          relationships (feeds build, profile, research, audit, design,
          document, plan) plus 4 invocation-guidance bullets per D80 §6 — all
          load-bearing. A 10K target would shred vision's substance; 17,678 is
          the honest floor for this capability."
      - name: Keep ≤20-words-per-principle rule, rewrite live artifact to comply
        status: rejected
        tradeoffs: Preserves the stated rule and enforces via linter; rewrites
          .agentera/vision.yaml principles to ≤20 words each.
        reason_rejected: Live vision artifact's principles deliberately carry 30–60-word
          rationales (e.g., 'One agent, not a team' explains the
          multiplicity-under-the-hood model, 'The CLI is the runtime' grounds
          package boundaries). Truncating to ≤20 words would strip the rationale
          that makes principles actionable for autonomous development. The
          MUST-state-tradeoff / SHOULD-name-prevention /
          MUST-NOT-name-implementations rules already cover principle shape; the
          holistic verbosity/abstraction/filler linter checks enforce brevity
          without an artificial word ceiling. Rule was YAGNI from inception
          (declared but unenforced since v2); cut rather than retrofit.
    choice: "D79-pure direct-contract adoption with personality-neutral Step 3,
      mode-split shape preserved. New D80-rule: capability instructions MUST NOT
      hardcode personality when an owning artifact defines it; the instructions
      reference the artifact (vision.yaml identity.voice) without re-asserting
      its content. Applies to all 10 remaining audits."
    reasoning: "The direct-contract delegation mirrors status (D79) and stops vision
      from re-encoding state rules that source_contract.capability_startup
      already mechanizes. The personality-neutral Step 3 follows the per-project
      identity principle (vision.yaml line 3): if vision hardcodes 'sharp
      colleague' before the user articulates their identity, the capability
      pre-empts Step 3 arc 5 (identity) — the very question designed to surface
      the user's voice. The 7th Socratic arc (anti-vision) was rejected because
      The Tension arc already surfaces scope boundaries; folding anti-vision
      into The Direction as a sub-prompt captures the intent without expanding
      surface. The principle brevity cut aligns
      prose↔validation↔linter↔artifact, removing drift rather than papering over
      it. CLI-driven mode detection via source.exists removes one user prompt;
      Replace reads archived vision because the corrective context is valuable
      and otherwise lost. Profile-stale handling prevents state mutation outside
      vision's contract."
    confidence: firm
    feeds_into: packages/cli/src/capabilities/vision/instructions.ts,
      skills/agentera/capabilities/vision/schemas/validation.yaml,
      references/cli/capability-instruction-structure.md, TODO.md,
      .agentera/decisions.yaml
    outcome: "Decision captured. Vision instructions rewritten: 17,076 → 16,667
      chars (-2.4% from original — subagent-driven prose-tightening pass landed
      vision below its starting length despite structural additions); D71 modal
      vocab compliant (3 MUST / 9 MUST NOT / 4 SHOULD); D72 app terminology; D79
      direct-contract delegation in opening paragraph; D80 six-section spine
      (Purpose glyph-inline, State artifacts with vision.yaml shape subsection,
      Workflow phases mode-split with shared pre-write self-audit hoist, Safety
      rails with profile-refresh MUST NOT added, Exit signals, Cross-capability
      integration with Invocation guidance folded). Validation V6
      (principle_brevity) removed with ID gap preserved; V7 unchanged.
      references/cli/capability-instruction-structure.md deviation table vision
      row updated to Complete (D81) with notes on vision.yaml shape subsection
      and shared pre-write self-audit hoist. TODO.md line 16 vision audit marked
      resolved. New D80-rule (capability instructions MUST NOT hardcode
      personality when an owning artifact defines it) propagates to all 10
      remaining audits. The 10 remaining capability audits (discuss, research,
      plan, build, optimize, audit, document, profile, design, orchestrate) now
      run against D80, D81, and the reference doc."
  - number: 82
    date: 2026-07-09
    question: How should the discuss capability instructions be audited and
      rewritten to align with D80 six-section spine, D79 direct-contract
      philosophy, D81 voice delegation, and CLI-first artifact access, while
      adopting deliberation-craft improvements inspired by the Wayfinder skill?
    context: 'Third capability audit (D79 status, D81 vision done). Discuss is the
      only conversational-loop shape and is entry-point-adjacent:
      user-impression impact is high. Pre-flight grounding found v2-era ghosts:
      `agentera describe` and `agentera decisions` commands (v3 uses `agentera
      schema` and `agentera state decisions`); `$AGENTERA_PROFILE_DIR` raw reads
      (v3 serves `deliberation_context.profile.path`); contract Section 24
      reference (contract.md tops at Section 23); hardcoded "sharp colleague"
      personality (D81 violation — vision references `identity.voice` instead);
      re-encoded source_contract truth tables (the real
      `complete_for_normal_deliberation_context` and `raw_artifact_read_policy`
      fields are valid but the prose duplicated them); canonical-filename reads
      (DECISIONS.md and VISION.md and OBJECTIVE.md and TODO.md) when
      `canonical_artifact_label` is the artifact id. Verified-real v3 surface
      retained: `agentera check lint --artifact decisions --text` pre-write
      self-audit, runtime-native question tool names, per-decision
      `context_complete` / `missing_fields` / `compacted` / `caveats` /
      `satisfaction.review_needed` fields.'
    alternatives:
      - name: Full D79 delegation with Wayfinder-inspired deliberation-craft additions
        description: "One lean delegation to `deliberation_context` and
          `raw_artifact_read_policy`; cut re-encoded truth tables and manual
          schema lookups. Keep discuss-specific judgment (satisfaction
          authority, do-not-reconstruct). Adopt four compressed Wayfinder
          adaptations: destination-fixes-scope startup, Ruled-out scratchpad
          field, fog-aware readiness check at Done (name remaining fog; flag
          firm-while-foggy as tension without blocking exit), and reframing the
          skip-to-implementation rail as an edge signal. Add steering rules
          (breadth-before-depth, ask-user-to-sketch not produce)."
        status: chosen
      - name: Status-quo reformat against D80 spine only
        description: Apply the six-section spine and cut v2 residue but leave the
          deliberation process unchanged — no fog or readiness model, no
          steering rules.
        status: rejected
    choice: Full D79 delegation with Wayfinder-inspired additions. Content and
      process challenged, not just reformatted.
    reasoning: "The fog-aware readiness check fills discuss's only real gap:
      termination had no quality signal, so confidence was whatever the user
      declared with no remaining-fog warning. Wayfinder's fog-vs-sharp test
      (\"can you phrase the question now\") gives exactly the missing signal,
      compressed to one Done-step sentence. The other adaptations are
      one-line-each and replace weaker or missing content rather than piling on.
      Reify-as-produce was rejected to avoid design and plan role overlap;
      ask-user-to-sketch keeps discuss verbal-first."
    confidence: firm
    feeds_into: packages/cli/src/capabilities/discuss/instructions.ts,
      skills/agentera/capabilities/discuss/schemas/artifacts.yaml,
      skills/agentera/capabilities/discuss/schemas/validation.yaml,
      skills/agentera/capabilities/discuss/schemas/exit.yaml,
      references/cli/capability-instruction-structure.md, TODO.md,
      .agentera/decisions.yaml
    outcome: 'Decision captured. Discuss instructions rewritten: 13,816 to 12,045
      chars (-13%). D80 six-section spine; conversational-loop shape named "The
      deliberation loop" (section 3). D79 direct-contract:
      source_contract.capability_startup delegation replaces re-encoded truth
      tables and manual schema lookups. D81 voice delegation: personality
      section cut, references identity.voice plus neutral operational stance in
      Create mode. CLI-first artifact access: all canonical-filename reads
      (DECISIONS.md, VISION.md, OBJECTIVE.md, TODO.md) replaced with artifact-id
      references and CLI mediation; the feeds_into example models the [vision]
      artifact-id convention (canonical_artifact_label confirms the id form). v2
      ghosts cut: `agentera describe`, `agentera decisions`,
      `$AGENTERA_PROFILE_DIR`, contract Section 24, contract.md pointer,
      Artifact path resolution and Contract values token enumeration (delegated
      to SKILL.md and protocol.yaml), standalone Getting-started (folded into
      section 6 as When-to-invoke). Verified-real v3 retained (check lint
      --artifact, runtime tool names, satisfaction per-decision fields).
      Wayfinder-inspired additions: destination-fixes-scope startup, Ruled-out
      scratchpad field, fog-aware readiness check at Done, breadth-before-depth
      steering, ask-user-to-sketch, edge-signal reframing of the implementation
      rail. New D82 rule propagating to all 9 remaining audits: schema validator
      files (triggers, artifacts, validation, exit .yaml) should use artifact-id
      labels not canonical filenames — going one step beyond D81, which scrubbed
