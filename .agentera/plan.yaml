  - number: 5
    name: Synchronize state and close the rollout
    depends_on:
      - "1"
      - "2"
      - "3"
      - "4"
    status: pending
    acceptance:
      - GIVEN prior tasks pass WHEN governed closeout runs THEN plan, progress, the superseded custom-name and receipt TODOs, health, docs, changelog, and the writer-assigned predecessor lineage agree without rewriting immutable evidence.
      - GIVEN synchronized state WHEN full CLI tests, typecheck, build, capability-contract and release-metadata validation, affected artifact validation, compact, migration fixtures, `npm pack --dry-run --json --ignore-scripts`, and `npm publish --tag next --dry-run` run after final changes THEN every gate passes, every task is complete, and only then the plan archives.
