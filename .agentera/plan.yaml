      - GIVEN declined, unavailable, shallow, rewritten, ambiguous, changed, interrupted, or retried history WHEN enrichment runs THEN local migration remains complete; results stay within 100, history within 500 commits and 16 MiB, only HEAD, local heads, and tags are inspected, remote/custom refs and operations are excluded, and equality prevents duplicates or conflicts.
      - GIVEN prior Cycle 787 overstates receipt integrity WHEN new evidence is appended THEN the correction is truthful, reconstructable, and leaves immutable prior cycles unchanged.
