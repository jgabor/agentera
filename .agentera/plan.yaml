header:
  level: full
  created: 2026-07-15
  status: open
  reviewed: 2026-07-15
  critic_issues: 10 found, 10 addressed, 0 dismissed
  title: "Plan: Replace monolithic corpus with tiered extraction"
  id: plan:bf34b05a-39ef-43ab-ada1-f9929d342ac1
what: Replace the unbounded corpus dump with bounded, complete local evidence segments and a deterministic, source-linked signal tier. Move bounded consumers and the current profile synthesis path to appropriate tiers.
why: Real corpora safely degrade to unavailable or stale results because readers cannot analyze oversized extractor output. Tiering restores useful analysis at realistic scale while preserving complete local evidence.
constraints: Preserve local-history consent, source traceability, deterministic extraction, all supported source families, and compatible JSON and exit behavior unless explicitly documented. Keep suite metadata at 3.0.0. Do not publish, release, add profile levels, generate a glossary, add remote storage, or redesign unrelated analytics.
overall_acceptance: GIVEN extraction larger than routine consumer limits WHEN refresh and supported consumers run THEN each consumer produces useful bounded results, reports truthful coverage, and retains source-addressable complete local evidence without reading any unbounded artifact.
scope:
  included:
    - Tier contract and extraction refresh behavior.
    - Bounded complete evidence and source-linked signals.
    - Usage, report status, prime coverage, and startup-analysis consumers.
    - Current profile synthesis, parity, tests, help, contracts, and state sync.
  excluded:
    - Profile level selection.
    - Glossary generation.
    - Remote storage and UI work.
  deferred:
    - Glossary synthesis; its declared correction, instruction and configuration, record identity, date, and evidence-anchor needs constrain the signal contract even though implementation remains deferred.
design: Preserve complete evidence in independently bounded units, derive a reproducible bounded signal view with resolvable evidence identities, and let each consumer use the smallest sufficient tier.
unknowns:
  - question: What signal bound and selection preserve representative evidence across all supported sources while staying below consumer limits?
    affects_task: 1
    resolve_by: Measure real corpora, map required fields, and compare bounded results before fixing regression thresholds.
  - question: Does bounded profile synthesis preserve useful evidence distribution compared with the current full-corpus intent?
    affects_task: 4
    resolve_by: Compare representative synthesis evidence and surface insufficiency instead of silently reducing confidence.
tasks:
  - number: 1
    name: Define and verify the tier contract
    depends_on:
      []
    status: complete
    acceptance:
      - GIVEN each supported consumer WHEN required evidence is mapped THEN one bounded input contract supplies every required field with source identity.
      - GIVEN supported Codex, Cursor, OpenCode, Copilot, and historical Claude sources WHEN the contract is checked THEN none is silently omitted.
      - GIVEN correction, decision, question, instruction, configuration, record identity, date, and evidence-anchor signals WHEN the contract is fixed THEN their required meaning remains available to current and declared deferred consumers.
      - GIVEN oversized, legacy, missing, corrupt, or incomplete state WHEN compatibility is evaluated THEN bounds and recovery outcomes are deterministic, actionable, and covered by passing and failing checks.
  - number: 2
    name: Publish bounded complete evidence and signals
    depends_on:
      - "1"
    status: pending
    acceptance:
      - GIVEN accepted extracted evidence WHEN publication completes THEN every full record remains retrievable and no artifact exceeds its declared bound.
      - GIVEN identical inputs WHEN extraction repeats THEN tier membership and ordering remain stable.
      - GIVEN interruption or stale prior state WHEN refresh runs THEN no consumer can observe a partially published generation.
      - GIVEN a bounded signal WHEN its evidence is requested THEN its identity resolves to retained full evidence.
  - number: 3
    name: Restore bounded analytics consumers
    depends_on:
      - "2"
    status: pending
    acceptance:
      - GIVEN real-scale extraction WHEN usage, report status, prime coverage, and startup analysis run THEN each produces bounded analysis instead of degrading solely because total evidence is large.
      - GIVEN available bounded tiers WHEN coverage is reported THEN the result truthfully represents supported sources and selected evidence.
      - GIVEN missing, corrupt, incomplete, or incompatible tiers WHEN a consumer runs THEN it fails or degrades safely with working recovery guidance.
      - GIVEN existing machine consumers WHEN tier support ships THEN JSON and exit behavior remain compatible except for documented tier statuses.
  - number: 4
    name: Move current profile synthesis to bounded signals
    depends_on:
      - "2"
      - "3"
    status: pending
    acceptance:
      - GIVEN refreshed tiers WHEN current profile synthesis runs THEN it uses bounded signals without loading all full evidence.
      - GIVEN a synthesized claim WHEN evidence is checked THEN its source identity resolves to retained full evidence.
      - GIVEN insufficient signals WHEN synthesis begins THEN the limitation is reported without fabricated confidence.
      - GIVEN representative corpora WHEN bounded and prior intended evidence distributions are compared THEN the agreed sufficiency threshold is met.
  - number: 5
    name: Synchronize contracts and verify current state
    depends_on:
      - "1"
      - "2"
      - "3"
      - "4"
    status: pending
    acceptance:
      - GIVEN the behavior is complete WHEN contracts, help, profile instructions, TODO, changelog when warranted, and progress are checked THEN they agree.
      - GIVEN the final tree WHEN focused and full tests, typecheck, build, capability validation, and compaction run THEN every required gate passes.
      - GIVEN oversized regression evidence WHEN closeout is reviewed THEN it records bounded artifact sizes and supported command outcomes.
      - GIVEN the v3 cutover hold WHEN work closes THEN no release occurs and no suite version exceeds 3.0.0.
surprises:
