      - GIVEN verified, projection-only, summary-only, duplicate, corrupt, or conflicting inputs WHEN classified THEN exact counts and actionable recovery are reported without fabricated detail.
      - GIVEN source state changes after preview WHEN apply is requested THEN publication is refused before effects.
    evidence: Audit retry passed 7 focused files/72 tests and full CLI 203 files/2,378 tests, typecheck, build, state validation, capability contract 2/2, and compact. The implementation preview reproduced 1,279 verified, 55 projection-only, 90 summary-only, 17 corrupt, 66 unresolved relationships, 173 blocked, and 1,441 logical entries; keyed revision authority had zero repository records.
