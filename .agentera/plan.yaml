      - GIVEN a public state schema WHEN fields are enumerated THEN id and artifact are the only canonical identity and classification names.
      - GIVEN collection and singleton state WHEN scope is checked THEN every included entity and intentional singleton boundary is explicit.
      - GIVEN valid and degraded sources WHEN policy and budgets are checked THEN migration outcomes, non-fabrication rules, and measurable retrieval targets are unambiguous.
    evidence: Decision 94 target entity and migration authority is machine-checked by entityAuthority.test.ts; full CLI suite passed 201 files/2329 tests, typecheck and build passed, capability-contract validation passed 2/2, and check compact reported zero over-limit artifacts or errors.
