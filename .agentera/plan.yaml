  - number: 4
    name: Make status startup self-contained
    depends_on:
      - "3"
    status: pending
    acceptance:
      - GIVEN a status-capability invocation WHEN status context is requested THEN one response contains both status instructions and the bounded state needed by every dashboard field and routing rule.
      - GIVEN that response WHEN the dashboard is rendered THEN no separate bare-prime call or raw artifact read is required.
      - GIVEN unrelated lifecycle diagnostics WHEN status starts normally THEN they are omitted unless status has declared them necessary for the current brief.
      - GIVEN pretty UTF-8 JSON with a trailing newline WHEN status context is serialized THEN stdout is at most 25000 bytes and stderr is measured separately.
      - GIVEN fresh, returning, flagged, waiting, and incomplete-state fixtures WHEN status runs THEN existing safety rails, exit markers, and recovery behavior hold.
