  title: "Plan: Close bounded retrieval after alias parity repair"
what: Complete the bounded plan and experiment retrieval delivery by preserving predecessor Tasks 1-11 as completed outcomes, repairing the remaining schema-advertised alias/runtime mismatch, and then completing development metadata, end-to-end verification, and state closeout.
why: Retrieval behavior and its public retrieval surfaces are complete, but the predecessor cannot continue because schema introspection advertises a nonexistent gate alias whose runtime failure is unstructured. A narrow authority-led parity repair restores trust in introspection without reopening completed retrieval work.
constraints: Preserve predecessor lineage and detailed evaluator history in its immutable archive; preserve Cycles 814-815; close the degraded bounded-retrieval TODO only after an independent audit passes; keep suite-bearing metadata at 3.0.0; permit only the next available CLI 3.0.0-dev.N metadata; do not publish, tag, push, migrate archives, change retention, add unrelated aliases, or touch unrelated state families. New testable units use at least one passing and one failing case.
overall_acceptance: GIVEN completed bounded-retrieval outcomes and canonical alias authority WHEN remaining work closes THEN every schema-advertised alias agrees with runtime structured behavior, retired aliases provide runnable correction, verification passes, and current state records the delivery without reopening or losing predecessor evidence.
scope:
  included:
    - Completed bounded-retrieval outcomes from predecessor Tasks 1-11
    - Schema-advertised alias and runtime structured-output parity
    - Independent acceptance audit and bounded-retrieval TODO closure
    - Permitted CLI development metadata, end-to-end verification, and final state synchronization
  excluded:
    - New aliases or compatibility behavior without an active canonical contract
    - Changes to unrelated commands, state families, archive models, or retention policy
    - Suite metadata beyond 3.0.0, publication, tags, or remote pushes
  deferred:
    - Search beyond identity, objective filters, and cursor traversal
design: Preserve completed retrieval outcomes while the predecessor archive remains the detailed record of its failed audits. Resolve canonical alias authority before changing behavior, prefer removing stale advertising when compatibility is not required, and prove every advertised alias against runtime structured behavior. Allow metadata and final verification only after independent parity acceptance, then synchronize state and close the plan.
unknowns:
