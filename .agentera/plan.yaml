surprises: |-
  Final audit after retry 2 found an initialization-grace race and legacy lock-file recovery defect; Task 17 now gates Task 3 and downstream migration work.
  Final retry audit found positively live peer preparations were failed as unknown residue rather than retried as bounded contention; Task 18 now gates Task 3.
  The required progress Cycle 872 is itself a newly inventoried verified source, so a post-evidence preview has one additional logical entry while the implementation-evidence snapshot remains the requested 1,441-entry graph.
  Final retry audit found exact-path symlink handling could follow an external active plan and silently omit unsafe decision overlay/revision paths; Task 19 now gates every family cutover.
  Final retry audit found root or marker substitution remained possible after the last assertion and before path-based immutable publication; Task 20 now gates all remaining entity families.
