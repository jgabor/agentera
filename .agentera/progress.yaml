cycles:
  - number: 916
    timestamp: 2026-07-18 06:19
    type: fix
    phase: build
    what: Added archived plan lifecycle semantics for entity migration and canonical
      plan state.
    inspiration: Task14 parity failure after the first successful entity apply and
      guarded rollback.
    discovered: Verified archive source plans retained open lifecycle in entity
      targets, so 21 historical plans competed with the active plan.
    verified: 2681 tests passed; typecheck, build, state validation, 12 capability
      validations, capability contract, compact, and blocker-free 1463-entity
      dry-run passed.
    next: Task14 remains pending; do not apply the live migration until separately
      authorized.
    context:
      intent: Preserve verified archive plans as historical entities without making
        them active or rewriting their tasks.
      constraints: No live apply, Task15, version, changelog, vision, task status, or
        manual YAML edits.
      scope: Plan entity migration, lifecycle validation/writers, plan list
        filtering/help, shared plan authority/schema, and focused tests.
  - number: 915
    timestamp: 2026-07-18 05:51
    type: fix
    phase: build
    what: Closed the in-place write immediately-before-unlink stale-receipt race by
      holding and validating each receipt descriptor across unlink, stably
      rereading it afterward, and durably recovering exact changed bytes before
      refusing canonical publication.
    inspiration: Task25 retry 1/2 reviewer reproduction for mutation of the
      quarantined discard inode inside unlink.
    discovered: A receipt pathname can still name the approved inode immediately
      before unlink while a concurrent writer changes that same inode inside the
      unlink boundary; pathname successor checks cannot preserve the
      now-unlinked changed bytes.
    verified: 64 focused entity migration apply tests and the full 2,679-test suite
      across 218 files passed; typecheck, build, and compact passed. Added exact
      before-unlink, held-writer after-unlink, unstable descriptor, O_EXCL
      collision, and recovery-fsync failure coverage.
    next: Task25 is complete. Task14 remains pending; do not generate a live
      approval or apply migration without explicit authorization.
    context:
      intent: Fix only Task25's exact-receipt descriptor mutation window without
        redesigning migration cleanup or touching live preparation state.
      constraints: No approval, apply, Task15, version, changelog, vision, manual
        YAML, amend, push, publish, or changes under the live
        .agentera/migrations preparation.
      unknowns: Task14 apply authorization remains intentionally unresolved.
      scope: packages/cli/src/state/entityMigrationApply.ts and
        packages/cli/test/state/entityMigrationApply.test.ts
  - number: 914
    timestamp: 2026-07-18 05:28
    type: fix
    phase: build
    what: Made stale migration preparation cleanup successor-safe with complete
      approval-bound receipt inventories, post-quarantine reinspection, exact
      receipt unlinking, pinned empty-directory removal, safe restoration, and
      honest partial-cleanup recovery.
    inspiration: Plan Task 25 and its final audit reproduction requirements.
    verified: 59 focused and 2,674 full tests across 218 files passed; typecheck,
      build, state validation, 12 capability validations, capability contract
      2/2, compact, and blocker-free read-only live preview passed.
    next: Task 14 remains pending; obtain explicit approval before any repository
      cutover apply.
    context:
      intent: Complete replanned Task 25 without applying the repository migration or
        touching the live stale preparation.
      constraints: No approval generation, apply, Task 15, version, changelog, vision,
        push, publish, or manual YAML edits; live stale preparation retained.
      scope: Entity migration preparation inspection, stale cleanup, race/recovery
        tests, plan Task 25.
  - number: 913
    timestamp: 2026-07-18 04:50
    type: fix
    phase: build
    what: Bound approval generation to validated pre-journal migration preparation.
    inspiration: PLAN Task24 retry 2/2 FINAL
    discovered: The readiness generator required exact untracked porcelain
      reconciliation and a durable transient identity envelope, not a
      migrations-directory exception.
    verified: 53 focused migration tests and 2,668 full CLI tests across 218 files
      passed; typecheck and build passed. Final compact and contract gates
      follow after state synchronization.
    next: Task24 is complete. Task14 remains pending; do not generate a live
      approval or apply the live migration without explicit authorization.
    context:
      intent: Complete Task24 retry 2/2 by allowing only one strictly validated stale
        or same-operation preparation during approval generation and binding it
        through apply.
      constraints: No live approval/apply, Task15, version, changelog, vision, manual
        YAML, amend, push, publish, or tag. Preserve the existing 999-receipt
        stale preparation.
      unknowns: Task14 apply authorization remains intentionally unresolved.
      scope: Approval generator, shared preparation inspection, apply validation,
        migration tests, Task24 evidence, and Cycle913.
  - number: 912
    timestamp: 2026-07-18 04:15
    type: test
    phase: build
    what: Added explicit real-FIFO regressions proving pre-journal approval
      inspection rejects special files in receipt and preparation-root
      inventories without effects.
    inspiration: PLAN Task24 retry 1/2
    discovered: The existing regular-file and exact top-level inventory checks
