  - number: 692
    timestamp: 2026-07-08 16:44
    type: fix
    phase: build
    what: Replaced cliDistributionMajor's terminal `return 2` fallback with a
      package.json#version secondary signal and a one-time stderr diagnostic.
      When registry.json version-authority is missing or corrupted, the function
      now reads package.json#version before falling back to 2, and emits a
      one-shot stderr warning when both signals miss.
    discovered: The repo root package.json has no version field (private monorepo
      root); only packages/cli/package.json carries 3.0.0-dev.13. Source
      checkouts and npx bundles are already caught by early returns, so the
      package.json secondary signal helps for npm-installed packages and
      edge-case layouts where the sentinel or checkout markers are absent.
    verified: "typecheck: 0 errors. build: clean. test: 144/144 files, 1278/1278
      tests including 7 new cliDistributionMajor tests. check compact: within
      uniform_10_40_50 limits."
    next: LoadSuiteVersion hardening (surfaces WHY it returned null) tracked as
      separate TODO.
    context:
      intent: Fix the silent v3-to-v2 misclassification when registry.json
        version-authority is corrupted or missing.
      constraints: Function return type stays number; no throwing in user-facing
        paths; loadSuiteVersion diagnostics out of scope (tracked as separate
        TODO).
