  - number: 698
    timestamp: 2026-07-11 09:02
    type: fix
    phase: build
    what: Eliminated the CLI test suite's shared dist race by building package
      output once in Vitest global setup, removing worker-local rebuilds, and
      isolating copy-bundle integration tests in temporary repositories.
    discovered: Seven worker test files mutated shared dist or bundle state;
      repeated commit hooks failed npm pack with different ENOENT paths while
      concurrent builds ran rm -rf dist.
    verified: "affected parallel suite: 7 files, 26 tests passed; two consecutive
      normal full CLI runs: 148 files and 1335 tests passed each; typecheck:
      clean."
    next: Commit the complete typed state writer and deterministic test-isolation
      fix.
    context:
      intent: Make normal parallel test and pre-commit runs deterministic without
        serial-worker overrides or hook bypasses.
      constraints: Keep Vitest worker parallelism and every pre-commit hook enabled;
        shared package outputs are immutable after global setup.
      scope: Vite test global setup, packaging/parity tests, installed-app tests, and
        progress evidence.
