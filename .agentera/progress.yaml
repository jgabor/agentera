cycles:
  - number: 702
    timestamp: 2026-07-11 12:33
    type: feat
    phase: build
    what: Implemented authority-bound lifecycle adapters for OpenCode, Codex,
      Cursor, and Copilot with explicit eight-category surface reports, safe
      repair declarations, and fail-closed support floors.
    inspiration: Active plan Task 4 and Decision 92.
    discovered: Safe automatic repair requires an existing safe destination parent;
      user-owned parents, symlink replacement, and unverified host behavior
      remain explicit action_required or unavailable states.
    verified: "Focused adapter and lifecycle tests: 3 files and 34 tests passed.
      Full CLI suite: 151 files and 1,385 tests passed. Typecheck and build
      passed. Lifecycle-adapters, Build capability, and capability-contract
      validations passed. Compaction and built adapter smoke passed. Lint
      completed with 0 errors and the standing 108-warning baseline. Git diff
      checks passed."
    next: Keep Task 4 open. Task 5 may retire Claude support and analytics; Tasks
      6-7 may integrate lifecycle reports into commands; Task 8 owns release and
      documentation surfaces.
    context:
      intent: Deliver Task 4 runtime observation and repair adapters on the Task 2
        authority and Task 3 operation engine.
      constraints: Did not integrate prime, doctor, or upgrade; retire Claude or
        analytics; update release, docs, TODO, plan status, or versions; execute
        native actions; or change Task 3 publication behavior.
      unknowns: Interrupted existing-ledger rewrites remain the preserved Task 3
        fail-closed audit warning. Runtime-specific behavior remains unknown or
        unsupported wherever first-party evidence is absent.
      scope: Runtime lifecycle adapter contract, four concrete adapters, lifecycle
        validation, fixture matrix tests, and typed progress evidence.
  - number: 701
    timestamp: 2026-07-11 12:02
    type: fix
    phase: build
    what: Hardened the shared lifecycle engine against publication-time target and
      parent substitution.
    inspiration: Task 3 retry 1 and the independent audit finding on path-based
      publication races.
    discovered: Portable Node has no conditional unlink or conditional
      symlink-replacement primitive, so destructive path mutations must fail
      closed; Linux proc descriptor paths provide the supported anchored
      publication boundary.
    verified: "Focused lifecycle suite: 2 files and 32 tests passed. Full CLI suite:
      150 files and 1,368 tests passed. Typecheck and build passed.
      Lifecycle-adapters, build-capability, and capability-contract validations
      passed. Compaction and git diff checks passed. Lint completed with 0
      errors and the standing 108-warning baseline. Built smoke observed preview
      create, apply applied, retry noop, aggregate success."
    next: Run the independent Task 3 retry audit against the new final-publication
      adversarial coverage.
    context:
      intent: Close the independent audit failure without weakening Decision 92
        ownership or preview guarantees.
      constraints: Preserved Decision 92, preview purity, successful retry work,
        existing TODO and decision edits, plan in_progress status, and the
        no-native-operation boundary.
      unknowns: Independent audit acceptance remains external; non-Linux apply
        intentionally fails because the secure proc descriptor boundary is
        unavailable.
      scope: Lifecycle publication helper, operation engine and ledger identity
        contract, adversarial lifecycle tests, and runtime lifecycle operation
        contract.
