    next: Task 3 can consume this authority when implementing shared lifecycle
      operation planning and apply mechanics; orchestrator audit owns Task 2
      status.
    context:
      intent: Make Task 2 runtime identity, support-floor, aggregation, and drift
        rules machine-readable and testable.
      constraints: Authority and validation only; no operation engine, runtime
