      while excluding its token from the map range, so API metadata checks and
      the raw source prefix are both required; anchored aliases remain objects
      and canonical validation blocks them.
    verified: 35 focused and 2,654 full tests across 218 files passed; typecheck,
      build, state validation, 12 capability validations, capability contract
      2/2, compact, exact live13 normalization coverage, and blocker-free
      no-effect live preview passed.
    next: Task23 is complete. Task14 remains pending; do not apply migration or
      generate approval.
