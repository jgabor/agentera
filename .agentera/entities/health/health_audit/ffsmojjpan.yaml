      findings:
        - heading: CHANGELOG Unreleased still quotes the superseded 12,000-byte and 3,000-token budgets
          location: CHANGELOG.md:7, 10, 11, 13 (Unreleased); docs/cli-coverage-contract.md:895 (historical)
          evidence: Line 6 raises bare prime to 16,000 bytes and 5,000 tokens. Lines 7 and 11 say bare prime is within the 12,000-byte and 3,000-token budgets. Line 10 gives routed budgets as 12,000 plus 34,500 or 37,000. Line 13 describes the failure at 12,000 bytes as current-looking.
          impact: A reader of the release notes sees two budgets for the same surface.
          suggested_action: Reword lines 7, 10, 11 and 13 as before values, or merge them into line 6. Leave coverage-contract line 895 as dated history.
          severity: warning
          confidence: 90
        - heading: Vision and audit capsules exceed the declared 55,000-byte capsule budget in this repo
          location: scripts/json_output_surface_manifest.yaml:155-185; references/artifacts/state-storage-authority.yaml:2573
          evidence: prime --context vision measures 56,407 bytes and --context audit 57,651 bytes on a fresh build. Both exit 0. The declared per-capability limit is 55,000.
          impact: The declared budget is not true for this repo, and nothing enforces it at runtime. The plan deferred capsule size reductions, so this is not plan-caused.
          suggested_action: Track a TODO for capsule trimming or an approved budget change with measurements.
          severity: warning
          confidence: 85
        - heading: init stale writer-lock recovery gives no way out
          location: packages/cli/src/cli/migrationRequired.ts:291-304
          evidence: An empty .agentera/.writer.lock makes init --yes return initialization_conflict. Its recovery says to check prime, then preview again. Prime reports a blocked entity-state cutover instead, and no text mentions a stale lock.
          impact: An interrupted initializer leaves a project that init cannot repair by its own advice.
          suggested_action: Add stale-lock guidance, or make the conflict recovery point to the exact prime recovery.
          severity: info
          confidence: 80
        - heading: doctor writer_readiness.error still offers plan create with PLAN.yaml
          location: packages/cli/src/cli/commands/recoveryDetail.ts:40; packages/cli/src/state/entityPublicationContext.ts:286
          evidence: doctor in a fresh repo lists init first, then state plan create --input PLAN.yaml.
          impact: Steers a new user toward a plan file they do not have, while the entry contract says init is the entry.
          suggested_action: Show only the init preview in doctor's next step.
          severity: info
          confidence: 75
        - heading: Cold-agent grader uses a path-substring rule and passes the vision hand-off on an offer
          location: packages/cli/scripts/eval-cold-agent.mjs:31-32, 74-77
          evidence: preview_before_approval passes if turn 1 text contains .agentera/state-mode.yaml. vision_handoff passes on a start or a matching offer sentence. The 3 of 3 pass (progress duyoqaltlz) used a package built from 2221cdb6 plus uncommitted changes.
          impact: The eval can pass a weak preview, and its evidence is not tied to a committed tree.
          suggested_action: Require the full writes content in the preview. Rerun the eval at HEAD before any authorized push.
          severity: info
          confidence: 70
        - heading: Fresh-repo routed /agentera omits fresh_start.writes
          location: packages/cli/src/capabilities/status/instructions.ts
          evidence: In a fresh repo, prime --input - with /agentera returns manual, route and a status capsule with no fresh_start. The capsule's next_action.retrieval.exact is the init preview and the capsule text says to use it.
          impact: One extra call to see the writes; consistent with the docs.
          suggested_action: Accept as documented, or inline the writes list in the capsule.
          severity: info
          confidence: 75
        - heading: route request reads stdin with readFileSync(0) and fails on a not-yet-ready pipe
          location: packages/cli/src/cli/commands/route.ts:187-189
          evidence: route request --input - with stdin written after 800 ms exits 2 with invalid_format. prime --input - succeeds, because it uses the retrying readBounded in the same file.
          impact: Hosts with a non-blocking stdin can fail on route request and probably on route receipt.
          suggested_action: Reuse the retrying reader for route request and route receipt in a later change.
          severity: info
          confidence: 70
        - heading: Line-keyed package-registry classifications are fragile
          location: references/adapters/package-registry.yaml:111-118
          evidence: Entries use region line:N plus a normalized sha256, for example vocabulary.md line:25, 54, 124, 129.
          impact: Any line shift in a doc needs manual re-keying; the hash catches drift but does not repair it.
          suggested_action: Key by heading or content hash when next touched.
          severity: info
          confidence: 80
