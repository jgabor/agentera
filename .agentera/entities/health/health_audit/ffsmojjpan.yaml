          evidence: Step 3 says the agent passes your request to npx -y agentera@next prime. The skill, UPGRADE.md and packages/cli/README.md say prime --input - with a JSON request on stdin.
          impact: Minor imprecision for a human reader.
          suggested_action: Say that the agent sends the request on stdin to prime --input -.
