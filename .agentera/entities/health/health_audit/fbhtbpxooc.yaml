      summary: The CLI, contract, routing model, shared skill, decision, and completed plan agree; receipt validation does not bind the exact semantic capsule snapshot.
      findings:
        - heading: Semantic receipts are not bound to the exact capsule used for classification
          severity: warning
          confidence: 94
          location: references/cli/hybrid-route-contract.yaml:42-55,195-200; packages/cli/src/registries/hybridRouteReceipt.ts:164-185
          evidence: The response carries semantic_capsule, but the host receipt carries only request_sha256. Authorization compares semantic_required plus request_sha256, so changed trigger intent can be accepted without detecting a stale capsule.
          impact: A host decision made from stale trigger intent could authorize startup if authorities change between calls. Normal immutable-package use makes this low risk.
          suggested_action: Bind a canonical semantic_capsule digest in the response and required receipt, compare it during authorization, and add an authority-change regression.
