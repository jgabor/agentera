  changes:
    context: "The Publish Agentera run took about 32 minutes. The source owner alone took 27 minutes because publish.yml pinned it to one Vitest worker: source, package and stress shared one 4-vCPU runner, and four source workers pushed the package owner past its 600 second budget. verification-policy.yaml named generated-overlap as the only execution origin for source, package and build evidence, and the overlap and release checks required one source report covering the exact inventory. After the first split, run 40111173795 still spent 637 s in the core job: package, core source and stress overlapped, then performance, capacity and barrier B ran in series on the same runner."
    alternatives.chosen: Split source into a core partition inside the generated-overlap DAG and source-only shards on separate runners, delegate stress, performance and capacity to one isolated-owner runner, and assemble every partition inside the candidate build job
    choice: "Development CI runs three kinds of parallel verification jobs that need only publication state. The core job runs verify:development with AGENTERA_SOURCE_PARTITION=core and AGENTERA_ISOLATED_OWNERS=delegate: the core source files (runtimeBootstrapMatrix and the declared Darwin-skip file), the package owner with three workers, the activation evidence producer and the read-only compact, capability-contract and activation-conjunction validators; it reports partial. The isolated-owner job runs verify:development:isolated on its own runner with no other owner: stress, then performance alone, then capacity. Three shard jobs run the remaining source files through a source-only generated overlap; shard 3 then builds the checkout CLI and runs the five L1 migration scenarios. The candidate build job downloads every report and, in build mode before version allocation, runs verify:development:assemble, which passes only when the core passed every gate it did not delegate, the isolated part passed every delegated owner in order, the source reports cover the exact inventory once, and every part has the same source identity. Receipts and vp run verify refuse partitions, and receipts, vp run verify and shards refuse delegation."
    reasoning: "The source owner never used the private build, so splitting it loses only the property that all owners ran on one host. On one host the DAG orders performance after batch A and barrier B after capacity; across runners that ordering cannot hold, so assembly replaces it: the core and the isolated part must each reconcile their timings to their own elapsed time, and no candidate is built unless the core, every shard and the isolated part passed for one source identity. Hosted run 40176417267 measured the layout three times with every job passing: the core job took 273, 422 and 320 s against 637 s before, the isolated-owner job 122 to 177 s, and verification from run creation to assembly 353 to 453 s. Package and core source finished within 3 percent of each other, so package workers stay at three, and one isolated-owner runner is enough. Assembling inside the build job saves a job start. A larger runner costs money on every push; trimming tests alone leaves the run too long; standalone jobs would drop the coverage proof."
    confidence: provisional
    feeds_into: verification-policy.yaml#source_partitions, verification-policy.yaml#isolated_owners and .github/workflows/publish.yml development verification and build jobs
