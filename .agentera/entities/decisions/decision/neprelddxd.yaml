id: neprelddxd
artifact: decisions
record:
  date: 2026-10-26
  question: How should the plan capability be redesigned in its second audit so it turns a decided direction into ordered tasks without extra approval gates, missing replan paths, or duplicate work?
  context: "Second audit of plan, revisiting the July audit decision voeysnygnx. The new-plan path worked for a cold agent, but the replan path did not: Step 0 had no amend row, Getting started said \"archive or amend\" without saying when, a rail forbade plan edits during a build cycle, and the writer had no way to drop a task (task statuses were pending, in_progress, blocked and complete; supersede needs complete PASS replacements; plan completion needs every task closed). The capsule carried a plan-only startup contract that contradicted itself, listed a ghost audit step, allowed raw plan reads for writes, and required approval before saving. Served instructions had grown from 14.8 KB to 22.5 KB, mostly machinery. Evidence: an open plan's first pending task becomes the status next_action; 273 deferred scope items in archived plans never reached a queue; 42 light versus 173 full plans were archived; 169 reviewed plans had 1052 critic findings, 1007 addressed, 45 dismissed and only 5 with zero findings. Re-tested decisions: voeysnygnx holds with amendment (adds the replan path and drop verb, and retires light); imlryhrjcn holds with amendment (saving a plan is a routine write, starting execution still waits); gazyqhkyyf holds (one writer call, dry-run only on request); mliblxbveo applies to plan (same prior context, filing follow-ups as TODOs, one-cycle work is a TODO); mukojyaeof and jqnmapqoru hold with amendment (shared TODOs zgjozzimtt and forcnazdcb); jyfgjlaoen, cuwtihanlb, vlgaofobpn and routing hold. Spine deviation kept from the prior audit: the full plan format template inside Workflow phases."
  alternatives:
    - name: Size first (build now, TODO for one build cycle, plan for ordered multi-cycle work; light retired). Save a plan without asking, report it with its undo, file deferred scope as TODOs, then ask one question to start build or orchestrate. A separate worker reviews every plan; self-review is a flagged fallback. Replan edits, adds or drops tasks in place (new state plan drop verb with a required reason, rejected while open tasks depend on the target) and makes a successor plan when what, why, scope or overall acceptance change. Ask before replacing an unrelated open plan. Delete the startup contract, retire the hidden skipped status, and rewrite the two shared execution rules so filing is routine and starting another capability needs a yes.
      status: chosen
    - name: Ask before saving a plan, as an intent-recording write; rejected because execution never starts without a yes and an unseen plan only changes a suggestion.
      status: rejected
    - name: Drop a task by superseding it without a replacement, or by exposing the hidden skipped status; rejected in favor of a plain-word verb.
      status: rejected
    - name: Always create a successor plan on any replan; rejected because task IDs and evaluations would churn for one-line edits.
      status: rejected
    - name: Keep the light level beside TODOs; rejected because a light plan and a TODO carry the same information and discuss already sizes one cycle as a TODO.
      status: rejected
    - name: Let the agent decide when a separate critic is worth it; rejected because the review almost always changes the plan.
      status: rejected
    - name: Absorb the shared prior-context startup and glossary block into this audit; deferred to osakqozckv and ycnfuhmffy.
      status: rejected
  choice: Rewrite plan around sizing, routine saves with one start question, a separate critic, and a first-class replan path backed by a new drop verb.
  reasoning: "The gap between what plan claims and what a user gets was the replan path and the approval friction, not the new-plan path. Sizing first gives plan and discuss one rule (one build cycle is a TODO). Making saves routine follows the in-capability autonomy decision while keeping the start of execution as the user's call. A drop verb closes the one move the cold agent could not make. Deleting the startup contract and the restated writer mechanics leaves one owner per rule. Served instructions fall from 22,535 to 17,356 bytes with the glossary block unchanged. The capsule in this repository falls from 33,270 to 26,777 bytes as full stdout (manifest 32,434 to 25,941), and in a fresh fixture from 29,820 to 23,414 (manifest 29,342 to 22,849), against a 55,000-byte budget; the routed start measures 38,435 bytes here and 32,555 in the fixture. Prior-context growth is budgeted in osakqozckv. The rewrite replaced the base literal and deleted all 16 string patches (13 live, 3 no-ops: --number N, --task N, and a duplicate profile-path replaceAll). Self-review is named in the handoff, not in critic_issues, because the writer requires the 'N found, M addressed, K dismissed' format."
  confidence: firm
  feeds_into: plan instructions and schemas, plan writer (drop), protocol OPERATING_RULES, TODOs osakqozckv, ycnfuhmffy, pzicyatkvi, cjwvscigwu, isxnszhath, nqbnvhenng
