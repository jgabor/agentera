id: wkmtwvaqdg
artifact: decisions
record:
  date: 2026-05-16
  question: How should Agentera rationalize app metadata status vocabulary across doctor, hej, and upgrade surfaces, and how far should adjacent vocabulary renames go now?
  context: Doctor output currently exposes a mix of terms such as `fresh`, `stale`, `update_needed`, `ready`, `refresh`, and `fixed`. The active doctor plan started as a text-output repair for misleading ready-state `Next:` guidance, but user deliberation rejected an easy split between internal JSON and user-facing wording because Agentera already has terminology debt around DECISIONS.md/decisions.yaml and bundle/app vocabulary. Follow-up review identified wider possible rename targets, including capability names, canonical artifact names such as DECISIONS.md and `.agentera/decisions.yaml`, exit signals, task statuses, health grades, and general prose outside app metadata.
  alternatives:
    - name: Text-only translation
      status: rejected
      description: Lowest compatibility risk, but leaves JSON, docs, tests, and agent reasoning with a second hidden vocabulary that can leak into future output.
    - name: Canonical hard rename
      status: chosen
      description: Rename the canonical app status vocabulary now across internal metadata, text, docs, and tests; update consumers in the same change instead of creating a long-lived dual vocabulary.
    - name: Broader suite-wide rename now
      status: rejected
      description: Renaming capability names, artifact names, exits, task statuses, health grades, and general prose in the same change would mix a bounded doctor/app contract fix with protocol identity changes whose blast radius has not been inventoried.
    - name: Block doctor fix on vocabulary authority migration
      status: rejected
      description: Deferring the bounded doctor/app metadata fix until a structured vocabulary authority exists would preserve current confusing statuses longer. Instead, record inventory and a separate Resonera decision as prerequisites for broader renames.
    - name: Canonical plus compatibility aliases
      status: rejected
      description: Safer for unknown consumers, but still risks becoming permanent dual truth unless an unavoidable external compatibility consumer is proven.
    - name: Keep current terms with stricter definitions
      status: rejected
      description: Defines the existing mess more precisely but keeps non-standard app words such as `fresh`, `stale`, `refresh`, and `fixed` as first-class protocol language.
  choice: Hard-rename app metadata toward one canonical vocabulary. Use standard app terms such as `up_to_date`, `outdated`, `repair_needed`, `migration_needed`, `manual_review_needed`, `ready_to_apply`, `applied`, and `no_changes_needed` as the starting contract. Avoid `fresh`, `stale`, `refresh`, and `fixed` as canonical status words. Preserve compatibility aliases only when a concrete existing consumer requires them, and document any such alias as transitional rather than as a second source of truth. Do not rename capability names, artifact names or paths, exit signals, task statuses, health grades, or general prose as part of the doctor app-metadata implementation. Those broader targets require a thorough inventory, consumer review, and a separate Discuss decision on whether a dedicated `vocabulary.yaml` should replace `references/cli/vocabulary.md` as the structured vocabulary authority.
  reasoning: "Agentera's prior vocabulary drift made agents and users carry mapping tables between artifact names, app/bundle terminology, and CLI labels. App status metadata is a protocol surface, not merely UI copy. A hard rename costs more now, but it prevents another internal/public split and makes doctor, hej, upgrade, tests, and documentation use the same mental model. The same argument does not justify opportunistic suite-wide renames: capability names, artifact identifiers, exit signals, task statuses, and health grades are protocol identity surfaces with different compatibility costs. They need inventory-backed deliberation before replacement, especially if the long-term authority moves from prose-only `references/cli/vocabulary.md` to a machine-readable `vocabulary.yaml`."
  confidence: firm
  feeds_into: .agentera/plan.yaml, TODO.md, references/cli/vocabulary.md, vocabulary.yaml, scripts/agentera_upgrade.py, scripts/agentera, references/cli/agent-ready-state-contract.yaml, tests, CHANGELOG.md, README.md, UPGRADE.md
  outcome: Hard-rename app metadata toward one canonical vocabulary. Use standard app terms such as `up_to_date`, `outdated`, `repair_needed`, `migration_needed`, `manual_review_needed`, `ready_to_apply`, `applied`, and `no_changes_needed` as the starting contract. Avoid `fresh`, `stale`, `refresh`, and `fixed` as canonical status words. Preserve compatibility aliases only when a concrete existing consumer requires them, and document any such alias as transitional rather than as a second source of truth. Do not rename capability names, artifact names or paths, exit signals, task statuses, health grades, or general prose as part of the doctor app-metadata implementation. Those broader targets require a thorough inventory, consumer review, and a separate Discuss decision on whether a dedicated `vocabulary.yaml` should replace `references/cli/vocabulary.md` as the structured vocabulary authority.
