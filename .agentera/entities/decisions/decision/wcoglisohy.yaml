id: wcoglisohy
artifact: decisions
record:
  date: 2026-07-06
  question: How should the status capability prose be designed to maximize effectiveness and token efficiency under the v3 source_contract.capability_startup contract, and which v2-era residue should be cut from the most frequently invoked capability surface?
  context: Status is invoked on every /agentera session — first impression and the most frequently called capability. Per D57 (firm) the instructions.ts module is canonical; per D65 (firm) the runtime serves it via agentera prime --context <name>. Per D71 (firm but unreflected in status prose) RFC 2119 modal vocabulary is the convention enforced in capability_schema_contract.yaml#modal_vocabulary. Per D72 (firm but straggler in status prose) the bundle to app rename landed in prime output but status prose still said bundle.status. The source_contract.capability_startup field declares complete_for_capability_startup=true and raw_artifact_reads_required=false, providing a machine-readable startup contract; the prose nonetheless triple-stated the rule (use prime, do not read raw .yaml), restated forbidden-command lists (drifted — prose forbade agentera plan while v3 uses agentera state plan), re-enumerated all protocol token IDs (drift risk versus protocol.yaml), and inlined ~3K chars of install-recovery procedure (AGENTERA_HOME broken-copy, 1.x managed marker cleanup, npx skills update cross-runtime leak, bundle.status inspection gate) that belongs to the upgrade capability and agentera doctor command. SKILL.md and instructions.ts both defined the dashboard rendering contract with drifted shapes (SKILL.md said health/todo/plan/objective/profile; instructions.ts said health/todo/plan/optim/profile — different field orders; SKILL.md showed all four severities on todo summary; instructions.ts drops normal and routes it through attention). Discuss ran a five-question deliberation over philosophy, ownership, scope, structure, and synthesis mode.
  alternatives:
    - name: Direct contract — lean on source_contract; status owns dashboard
      status: chosen
      tradeoffs: Prose only states what the contract cannot encode (dashboard template, routing priority tree, exit markers, safety rails, conventions). Source_contract.capability_startup mechanizes what the prose previously re-encoded (complete_for_capability_startup, raw_artifact_reads_required, cli_fallback list). Cuts ~7K chars of redundant rules (-42% total). Status prose owns the dashboard contract; SKILL.md delegates. Trust that the runtime serves the prose via prime --context (D65) and that the source_contract fields are machine-readable by capable models.
      win_condition: Prose drops to ~10K chars; v2-era field and command names gone (no bundle.status, no agentera plan, no --install-root, no AGENTERA_HOME resolver); SKILL.md dashboard block replaced with a pointer to status prose; routing priority tree and exit markers preserved verbatim; D71 modal vocab applied throughout; D72 terminology applied throughout.
    - name: Self-contained operator manual — defense-in-depth
      status: rejected
      tradeoffs: Preserve every rule in prose. Apply D71 + D72.
      reason_rejected: Duplication persists and drift will recur on the next contract change; proven drift in this audit (forbidden-command list said agentera plan while v3 uses agentera state plan; prose gated on bundle.status while prime emits app.status). Defense-in-depth is the source_contract's job — the contract field is the canonical, machine-readable declaration; re-stating it in prose waters down the contract as the source of truth. D71 modal vocab is the weak-model mitigation (RFC 2119 keywords), not prose duplication.
    - name: Hybrid — contract spine + relocated recovery
      status: rejected
      tradeoffs: Lean on contract for startup; keep AGENTERA_HOME recovery flow with a pointer to references/cli/upgrade-repair-wording.md.
      reason_rejected: Keeps the procedural content somewhere — adds a pointer to maintain. Status's actual rendering obligation for upgrade state is one paragraph (render project_integration.message; preview dry-run; ask before apply); the procedural recovery content is upgrade/doctor capability territory, not status. A pointer is unnecessary; the rendering rule is what stays.
  choice: Direct contract — lean on source_contract.capability_startup; status prose owns the dashboard rendering contract (SKILL.md delegates); cut all procedural install-recovery content (status renders project_integration fields when present and routes to upgrade/doctor for procedure); three-phase structure (Dashboard rendering then Briefing then Routing suggestion); apply D71 RFC 2119 modal vocabulary throughout; apply D72 bundle-to-app terminology throughout.
  reasoning: The source_contract.capability_startup field exists to be the machine-readable contract between the CLI and the host; re-encoding it in prose creates a second source of truth that drifts, as proven by the audit findings (forbidden-command list drift, bundle.status straggler). Status's actual obligations are (1) render the dashboard per a canonical template, (2) suggest a concrete next action with a named artifact item, (3) emit a mandatory exit marker, (4) stay read-only. Procedural install recovery belongs to the upgrade capability and agentera doctor command, not status. Owning the dashboard template in status prose (where the only job is briefing and routing) aligns ownership with responsibility and eliminates the SKILL.md and instructions.ts drift class. D71 modal vocab addresses the weak-model failure mode (instructions read literally as user commands) without duplicating contract-encoded rules.
  confidence: firm
  feeds_into: packages/cli/src/capabilities/status/instructions.ts, skills/agentera/SKILL.md, skills/agentera/capabilities/status/schemas/triggers.yaml, skills/agentera/capabilities/status/schemas/validation.yaml, references/cli/routing-model.md, capability_schema_contract.yaml, TODO.md
  outcome: "Status prose rewritten from 18,035 to 10,389 chars (-42%). Three phases (Dashboard rendering then Briefing then Routing suggestion). D71 RFC 2119 modal vocab applied (5 MUST, 5 MUST NOT). D72 terminology applied (bundle fields replaced with app fields). v2-era residue cut: AGENTERA_HOME broken-copy recovery (~1.5K), 1.x managed marker paragraph, npx skills update cross-runtime leak, bundle.status gate procedure, Step 0.5 CLI-owned checks (~1K), triple-stated do-not-read-raw-yaml rules (~800), duplicate forbidden-command list (~400, also v2-era agentera plan names), contract-values token enumeration (~400, replaced with one-line reference to protocol.yaml), artifact-path-resolution subsection (~700, delegated to SKILL.md), agentera query reference (unported — actual v3 is agentera state query), PROFILE.md global path detail (prime profile.path surfaces), PROGRESS.md recency heuristic mention (prime health.stale surfaces). Generic greeting wording rephrased to conversational smalltalk — drops greeting terminology entirely. SKILL.md dashboard rendering block (22 lines) replaced with 7-line pointer delegating to status prose. triggers.yaml T2 entry dropped hello/hi greeting patterns and Greetings description (relics from when status was named hej). routing-model.md Layer 1 hej mention and Layer 5 greetings mention cleaned up. 1271/1271 vitest green; typecheck 0 errors; capability validation PASS; capability-contract self-validation PASS; protocol internally consistent; artifact compaction within budget. Preserved verbatim (routing priority tree with 8-bullet decision logic plus anti-regression rule, ASCII dashboard template, ≤120-word output constraint, exit marker rule with EX1-EX4, 6 safety rails with D71 modal cleanup, cross-capability integration paragraph). TODO.md status-audit task and prose-to-instructions rename task marked resolved in this commit. Satisfaction deferred to the user per discuss rules."
