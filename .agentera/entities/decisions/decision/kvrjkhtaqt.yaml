id: kvrjkhtaqt
artifact: decisions
record:
  date: 2026-07-06
  question: How should Agentera close the opencode skill-path topology mismatch where prime reports up_to_date against a clean symlink opencode never loads while the host runs a diverged real directory?
  context: "A hej/status session on feat/v3 bootstrapped via the bundled SKILL.md and executed stale v2 commands (uvx, uv run, Swedish capability names). Checks across all five SKILL.md copies found: the repo source and three agentera-managed roots (~/.local/share/agentera, ~/.config/opencode/skills/agentera, packages/cli/bundle) are all v3.0.0 and clean; only ~/.agents/skills/agentera is a real v2.7.11 directory. runtimeMigration maintains a clean v3 symlink at ~/.config/opencode/skills/agentera, but opencode's skill loader reads from ~/.agents/skills/agentera — a path agentera never writes. prime bundleStatus (bundleStatus.ts:63-65) checks installRoot, sourceRoot, and ~/.config/opencode/skills/agentera but omits ~/.agents/skills/agentera, while setup/doctor/opencode.ts:315 lists that same path as a default-skill-root. So up_to_date reports clean against a path opencode doesn't load while the host runs stale. The standing docs TODO to reconcile bundled SKILL.md is misframed: the source is already v3; the defect is the opencode skill-path topology, not documentation. Verified against opencode.ai/docs/skills: opencode searches six skill locations including both ~/.config/opencode/skills/<name>/ (opencode-specific) and ~/.agents/skills/<name>/ (agent-compatible, industry path), and requires skill names unique across all — so a skill present in both is itself the configuration error that let opencode load the stale copy."
  alternatives:
    - name: Detect + repair via topology reconciliation
      status: chosen
      tradeoffs: Add ~/.agents/skills/agentera to bundleStatus candidates (detect; never false up_to_date) and have upgrade maintain that path as a symlink to the canonical source (repair; retiring the ~/.config/opencode/skills symlink per the opencode doc's cross-location uniqueness rule). Closes the loop end-to-end so the host can't silently run v2 again, and adopts ~/.agents/skills as the canonical agent-compatible root.
      win_condition: prime reports up_to_date only when ~/.agents/skills/agentera matches the canonical source; upgrade converts a divergent real directory at that path to a symlink and retires the ~/.config/opencode/skills/agentera symlink; ~/.agents/skills becomes the canonical agent-compatible root, with direction to deprecate runtime-specific skill dirs for runtimes natively supporting ~/.agents/skills; the Reconcile bundled SKILL.md TODO is re-scoped to the topology fix rather than a source edit.
    - name: Detect-only (surface divergence, host reinstalls)
      status: rejected
      tradeoffs: Add the path to bundleStatus candidates so prime surfaces staleness; host or opencode reinstalls. Keeps agentera's write boundary narrow.
      reason_rejected: agentera already recognizes ~/.agents/skills/agentera as a default-skill-root (opencode.ts:315). Detect-only leaves the repair loop open — the divergence that broke this session's bootstrap would recur silently until a manual reinstall.
    - name: Overwrite-in-place (second real copy)
      status: rejected
      tradeoffs: Copy canonical skills/agentera over ~/.agents/skills/agentera on each upgrade when diverged. Pragmatic and fast.
      reason_rejected: Keeps a second real copy alongside the managed home; divergence can recur unless paired with a drift gate, and it diverges from agentera's existing single-source symlink topology.
    - name: Treat as a docs task (reconcile the source SKILL.md)
      status: rejected
      tradeoffs: Edit skills/agentera/SKILL.md to remove v2 references.
      reason_rejected: The source is already v3-clean (npx, English names, prime --context). The v2 commands executed this session came from the ~/.agents straggler install, not the source. Editing the source would do nothing.
  choice: Detect + repair via topology reconciliation. Add ~/.agents/skills/agentera to bundleStatus candidate list so prime never reports up_to_date while the host-loaded copy is diverged; have upgrade maintain ~/.agents/skills/agentera as a symlink to the canonical source as the canonical agent-compatible root; and retire the ~/.config/opencode/skills/agentera symlink (justified by the opencode doc's cross-location uniqueness rule — opencode loads from both paths, so a duplicate skill name is itself the config error). Broader direction — standardize on ~/.agents/skills as the single skill root for runtimes natively supporting it (OpenCode, Claude-compatible, Pi); deprecate their runtime-specific skill dirs; keep runtime-specific dirs only for runtimes lacking native ~/.agents/skills support (verify per-runtime during build).
  reasoning: The defect is neither broken install propagation nor stale documentation. agentera's managed locations are all v3.0.0 and clean and the source is clean; the defect is that agentera symlinks the opencode-skill path opencode doesn't load (~/.config/opencode/skills) while leaving diverged the path opencode does load (~/.agents/skills). bundleStatus checks the clean symlink, declares up_to_date, and the host runs the stale real directory. Reconciling the topology — detecting staleness at the host-loaded path and repairing it to a symlink, and retiring the opencode-specific symlink per the doc's uniqueness rule — matches agentera's existing runtimeMigration pattern and structurally prevents recurrence while standardizing on the agent-compatible root.
  confidence: firm
  feeds_into: packages/cli/src/cli/commands/prime/bundleStatus.ts, packages/cli/src/upgrade/runtimeMigration.ts, packages/cli/src/setup/doctor/opencode.ts, packages/cli/src/upgrade/appContentRefresh.ts, TODO.md
  outcome: "P1 (CLI): bundleStatus adds ~/.agents/skills/agentera to its candidate list so prime surfaces staleness there as attention and never reports up_to_date while diverged; upgrade maintains ~/.agents/skills/agentera as a symlink to the canonical source (the canonical agent-compatible root) and RETIRES the ~/.config/opencode/skills/agentera symlink — the opencode doc confirms opencode loads from both paths and requires skill names unique across locations, so the duplicate is the error. Broader direction: standardize on ~/.agents/skills as the single skill root for runtimes natively supporting it (OpenCode, Claude-compatible, Pi); deprecate their runtime-specific skill dirs; keep runtime-specific dirs only for runtimes lacking native ~/.agents/skills support (verify per-runtime during build — e.g. Cursor, GitHub Copilot, Codex). P2 (docs) folds into the existing Audit and review status capability instructions TODO — strip the RESOLVED_AGENTERA_HOME and v2 resolver-flow remnant from packages/cli/src/capabilities/status/instructions.ts. The Reconcile bundled SKILL.md TODO is re-scoped: source is already v3, so the fix is P1's topology repair, not a source edit. Sequence P1 first (it silently broke bootstrap); P2 second. Symlink target (repo source vs managed app home) and dead-code retirement are implementation details for plan/build."
