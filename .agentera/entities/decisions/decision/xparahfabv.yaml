record:
  date: 2026-10-26
  question: How should the status instructions be rewritten to deliver the second status audit in one self-sufficient call?
  context: Decision buplkzyydk set the redesign; plan tasks one to seven moved routing, budgets, unfinished work, status data, blocking offers, the first-run preview and the autonomy rule into the CLI and manual. Two cold agents given only the routed /agentera output then found five rules naming fields the capsule lacks (profile.validity and freshness, app.status, health.stale, the optimize metric, fresh_start.writes on a routed start), four served fields no rule used (north_star, capability_hint, profile_freshness, progress.latest), invitations to six extra CLI calls, an invented attention line built from TODO counts, an unclear flagged-or-waiting exit, an audit hint in an empty repository, and in an uninitialized repository no init file list without a second call. The served instructions were 11,927 bytes and 2,538 GPT-5 tokens through a patch chain and a startup adapter.
  alternatives:
    - name: One base text on the six-section spine that renders only what status_context carries, with the init preview in status data and the capability hint gated on a north star.
      status: chosen
    - name: Keep the instructions and tell the agent to run the init preview before asking.
      status: rejected
    - name: Add the bare brief to the routed fresh start.
      status: rejected
    - name: Add critical and degraded TODO items to status attention in this rewrite.
      status: rejected
    - name: Drop guidance_details from the status capsule now.
      status: rejected
  choice: "Status instructions are one base text on the six-section spine: Purpose, State artifacts, Workflow phases (Render, Suggest), Safety rails with MUST NOT rules, Exit signals, Cross-capability integration. The dashboard renders from the startup response alone: north star, health, TODO counts, plan bar, a profile line only from profile_freshness, a narrative from progress.latest.what, attention exactly as served with no items made up from counts, one suggestion from next_action, and capability_hint on an also line. Detail commands run only for recovery or when the user asks. Exits follow the startup outcome: blocked is stuck, degraded is flagged, a pending suggestion is waiting, else complete. A first run skips the status, attention and next sections, shows status_context.fresh_start (about, writes, apply_command) and asks; capability_hint appears only once the vision has a north star. Voice refers to vision identity.voice. Cut: the routing priority list, rules for absent fields, plan-replacement and offer guidance, the protocol-token pointer, NEVER rules, the patch chain and the startup adapter. The logo top row is fixed. Exit and validation schemas follow, with a new render_from_response rule. The cold-agent eval gains a status scenario that sends bare /agentera in a fresh repository and a clone of this one and grades one CLI call, no follow-up reads, at most one question and an exit marker."
  reasoning: Rules for fields the capsule never carries cost bytes on every start and send agents to extra reads, so the instructions describe only what the CLI serves. The init preview belongs in status data because one call is the entry promise and init's own source keeps the list exact. Inventing attention from counts misleads, so status renders what it gets and TODO rduzoccwod owns why criticals are missing. A hint in a repository without direction points away from init and vision. Verdicts on decisions re-tested - jyfgjlaoen holds and is restored; wcoglisohy holds as amended by buplkzyydk; mukojyaeof holds and is applied; cuwtihanlb holds and is applied; jqnmapqoru holds, with attention strings left to rduzoccwod; vlgaofobpn holds and the restated Offers tail is removed; buplkzyydk holds, amended so status_context carries the init preview; imlryhrjcn holds, status stays read-only except init's apply after approval. Served instructions went from 11,927 to 5,812 bytes and 2,538 to 1,341 tokens; this repository's status capsule from 20,988 to 15,325 bytes and routed /agentera from 24,853 to 19,210; an uninitialized repository's routed /agentera from 21,962 to 16,578 bytes with the init preview. The folded patches were five instructions.ts replacements, the profile rewrites, the Plan selection tail and the eleven-step startup adapter with its Offers tail. Spine deviations - none.
  confidence: firm
  feeds_into: status capability instructions, status_context, status schemas, budget authority
