  what: Plan-completion sweep for the contributor toolchain move. The managed Node.js pin moved from 24.19.0 to 24.22.0, the pinned Vite+ release moved from 1.0.0 to 1.3.0 with Vitest 5.0.5, and contributors may now run any stable standalone Vite+ launcher from the pin up to the next major, which the toolchain check and the pre-commit hook report as accepted but unqualified. The CI bootstrap still downloads and requires exactly the digest-verified 1.3.0 release. Version numbers in guidance, tests, and scripts derive from .node-version and from one Vite+ version constant.
