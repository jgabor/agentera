record:
  name: Keep the v1 reset preview short and explicit
  depends_on:
    - rayhcanifm
  status: pending
  acceptance:
    - GIVEN a home with v1 state WHEN the reset preview runs with default options THEN its stdout stays within 8 KiB, names every user-data entry by path, lists each scope's other top-level entries with counts, and replaces names beyond 12 per scope with an omitted count.
    - GIVEN identical installation and profile roots WHEN the preview runs THEN the shared directory appears once.
    - GIVEN the full-detail option WHEN the preview runs THEN every deleted entry is listed, and help and `upgrade --explain` advertise that option.
    - GIVEN a default preview's authorization WHEN apply runs THEN the authorization still covers every deleted entry, and a change to any file under a deleted scope rejects the apply.
    - GIVEN user data in a deleted scope WHEN the preview is shown THEN the question names that data in plain words, and the recovery guidance says that upgrading through the previous major version first keeps it.
  plan: mayqocppfa
