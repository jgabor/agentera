  acceptance:
    - GIVEN lifecycle, check, state, and prime dispatch parsers WHEN flags are parsed THEN a shared parser module owns repeated argv loops and each dispatch file delegates to it.
    - GIVEN prime detects v1 artifact pairs WHEN orientation runs THEN it uses the same detector export as migrateArtifactsV2ToV3 with no duplicate pair constant.
