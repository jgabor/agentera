    - GIVEN upgrade is invoked with --runtime, --opencode-config-dir, or --update-packages WHEN the flag is present THEN the CLI either wires it through or rejects with explicit guidance — never silent no-op.
    - GIVEN buildDoctorStatus is called with probeCli true and no custom probe WHEN the default probe runs THEN it does not always report failure for the shipped doctor command path.
    - GIVEN JSON output is emitted from doctor and related commands WHEN sorted stable JSON is required THEN one shared helper is used instead of parallel pyJsonIndent implementations.
    - GIVEN npx bundle detection runs across CLI entry points WHEN source root is classified THEN isNpxBundleRoot is the single authority.
