  design: "Three phases. Phase one makes starts survive state growth: more open TODO items than the bound, then token budgets whose answer to growth is trimming. Budgets precede new capsule data because status has little headroom under a hard cap. Phase two changes what the CLI decides and serves, then adds the one-question and autonomy rules to the manual. Phase three audits status and rewrites its instructions to render only what phase two serves; the cold-agent eval pins the result. Related TODOs are narrowed when the absorbing task closes."
  unknowns:
    - question: Does the current status instruction text fit the instruction budget derived from its job?
      affects_task: 2
      resolve_by: Measure in task 2. If it does not fit, task 2 records the approved value and task 8 adds the failing instruction-budget check.
    - question: Can the CLI observe that a host has no native Agentera integration, and what makes the skill offer repeat once per session?
      affects_task: 6
      resolve_by: Probe at the start of task 6. If neither is observable, stop and re-plan the offer rule with the user.
  rejected:
    - issue: Fields constraints and design exceed the 100-word entry bound.
      rationale: The writer's strict lint and schema validation passed a dry run of these fields; the bound does not apply per field.
  overall_acceptance: GIVEN this repository and a fresh one WHEN a cold agent runs bare /agentera THEN status starts in one call, shows attention, one next step and the north star when a vision exists, asks at most one question, and never refuses because state grew. GIVEN an invoked capability that has adopted the rule WHEN it writes routine project state THEN it reports the change and its undo without asking, and it still asks before irreversible effects, intent-recording writes and starting another capability.
  surprises: "Task 1 probe: in a fresh project the TODO writer refused the 257th create with the TODO.md 256-row bound, which also counts resolved rows still listed. More than 256 open items cannot arise through typed writers, only through hand edits or items absent from TODO.md. The live risk is the create bound: its recovery names resolved-row compaction even when every row is open, and this repository sits at about 225 rows."
