    title: "Plan: Status redesign and autonomy inside capabilities"
  what: Implement decisions buplkzyydk and imlryhrjcn. The CLI decides and status renders. Prime serves status_context as plain data, next_action can suggest resuming unfinished work, offers declare whether they block, a first run leads with the init preview, and budgets come from each capability's job in tokens and degrade instead of refusing. The operating manual gains the one-question rule and the in-capability autonomy rule. The status instructions are then rewritten through the capability audit prompt.
  why: Two cold agents rendering from the status capsule hit five rules whose fields the capsule lacks, made extra CLI calls, asked two questions in one reply, and on a first run were told to upgrade before init. The status capsule sits about 1 KB under a byte cap that fails hard. The vision's act-first stance conflicts with approval gates on routine writes. A project with more than 256 open TODO items still cannot start at all.
  constraints: "Firm decisions buplkzyydk, imlryhrjcn, vlgaofobpn (prime is the single entry; capsules do not repeat the manual) and kicksvpwep (JSON operational output) are hard constraints. The manual owns offers, consent, handoffs and the autonomy rule. Raising a declared budget, and any new budget value, needs user approval with measurements. Decisions, vision and objective change only with explicit user approval. Versions stay at 3.0.0. No commit, push or merge without explicit authorization. Task 1 may reach feat/v3 alone; tasks 2 to 8 reach it together after task 8. Paid live-model evals need consent first. Tests: one passing and one failing case per testable unit."
