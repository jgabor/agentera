  unknowns:
    - question: Do a manual of at most 2,500 bytes and the orientation fit the 12,000-byte and 3,000-token bare prime budget after trimming, in this repository, a fresh repository and the large-attention fixture?
      affects_task: 2
      resolve_by: Measure after task 1's trimming with the drafted manual. If it does not fit, stop and ask the user to approve a budget change with the measurements.
    - question: Does a project holding only the state marker pass entity validation and every state reader, and does a later vision write keep it readable?
      affects_task: 5
      resolve_by: Probe a marker-only project with the existing readers before building init. If it fails, init writes the smallest state that passes, and the preview lists exactly that.
    - question: Is a semantic_required response enough for a cold agent to build a valid receipt, including clarify and compound requests, with no receipt rules in the skill?
      affects_task: 7
      resolve_by: Before removing the receipt rules, feed one clarify and one compound request to a cold agent with only the response. If it fails, the manual keeps a short receipt rule.
    - question: Can a supported runtime run the cold-agent scenario headless against the locally built package, without changing the shipped skill text?
      affects_task: 8
      resolve_by: Try one supported runtime with a local package override first. If none works, record the gap; the full eval then cannot qualify before an authorized push.
  rejected:
    - issue: Require a new decision before any budget increase.
      rationale: Decision vlgaofobpn already allows a budget revision backed by evidence. The plan instead requires trimming first and the user's explicit approval with measurements, which keeps the hard limit without a second deliberation.
    - issue: The scripted calls-per-path session is circular because the script encodes the expected calls.
      rationale: It is a contract check on the documented paths and the CLI responses, by design. Agent behavior is tested by the cold-agent eval, which asserts on the real tool-call transcript.
