    revised: Split into eight tasks, made stdin input explicit, set numeric budgets, and added the skill rule disposition, init atomicity, per-task doc criteria and a local-build eval.
    title: "Plan: Prime as the single Agentera entry"
  what: Make prime the one entry for agents and their users. Bare `npx agentera@next` runs prime. Prime serves a short operating manual, accepts the user's request through an explicit stdin input, and starts deterministic routes in the same call. A fresh repository gets an init preview, and after approval init prepares state and hands off to vision. The shared skill shrinks to a three-row pointer table and one stop rule. Budgets and a cold-agent eval guard the result.
  why: Decision vlgaofobpn fixes this entry contract. The skill has drifted to 181 lines. Bare `npx agentera@next` prints help with no next step. Bare prime spends its budget on field lists and fails in large projects. A fresh repository cannot start vision. New users and sessions need one obvious first step.
  constraints: "Firm decisions are hard constraints: vlgaofobpn (entry contract), kicksvpwep (JSON for operational output; text only for help, version and guidance), mpulyomlyl (the hybrid route contract and receipt stay as they are), nksvqmnevm and imumkmffwh (the shared skill plus the CLI are the only integration surface), czkquqhuwm (thin skill, CLI serves instructions). Natural-language routing after semantic_required keeps today's receipt until TODO pzicyatkvi decides it; the route contract and its corpus do not change. Request text never travels in argv, and neither the bare command nor bare prime ever reads stdin. Nothing writes project files without a preview and explicit approval; approval is a rule the manual states, not something the CLI can enforce against an agent that passes `--yes`. Raising a declared budget needs the user's approval with measurements. Versions stay at 3.0.0. No push, tag or publish without explicit user authorization. Each task updates the docs, changelog and command inventories its behavior touches. Tests: one passing and one failing case per testable unit unless a task states otherwise."
  design: "Work runs in three phases. Phase one reshapes prime: it stops failing on large projects and sheds low-value fields, gains the manual, then routes a request in the same call, each step measured against the last. Prime reuses the existing route resolver and returns its results unchanged; prime is a carrier of that result, not a second contract. Phase two changes the front doors: the bare command and help, then the init command and the gate that lets an initialized project start vision, then the fresh-project next step and doctor. Phase three removes the old host-side text: every rule in the skill gets a recorded destination before the skill shrinks, and the docs move with it. The eval runs last against the locally built package. Known risk: the manual reaches only sessions that start with prime; the skill tells a host to rerun prime after context loss."
  overall_acceptance: GIVEN a fresh git repository and an agent whose only Agentera context is the installed skill WHEN the user asks it to set up Agentera THEN the agent reaches an init preview, applies init only after the user approves, and hands off to vision without other help. GIVEN an existing project WHEN a new session starts with bare, direct or curated-phrase requests THEN each takes one CLI call, and a natural-language request takes three. GIVEN the shipped skill, bare prime, prime with a routed capsule, and help WHEN measured THEN each stays within its declared budget.
