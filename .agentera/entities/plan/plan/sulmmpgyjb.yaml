      - Explicit stdin request input for prime, with in-call routing and capsule startup for deterministic routes
      - Bare `npx agentera@next` running prime, and help limited to agent and user commands
      - "`agentera init`: preview by default, `--yes` to apply, a second allowed initializer next to plan creation"
      - The fresh-project gate, the next step after init, and doctor's fresh status (TODO kkfomcugga)
      - Shared skill reduced to frontmatter, a three-row pointer table and the stop rule, with a rule-by-rule disposition
      - The entry docs README Get started, UPGRADE.md, docs/cli-coverage-contract.md, references/cli/routing-model.md, references/cli/vocabulary.md and packages/cli/README.md
      - A calls-per-entry-path contract check and a cold-agent eval against the local build
    excluded:
