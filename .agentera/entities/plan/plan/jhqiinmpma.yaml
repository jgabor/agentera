  design: Make bounded state self-describing first. Repair startup assumptions about missing records using bounded authoritative content, preserving facts and explicit availability. Then apply one shared human-reference convention to the consumers of that data. Verify the same outcomes through the built executable and isolated bundle before checking current project state.
  overall_acceptance: GIVEN entities with readable source content WHEN existing human-facing references are produced THEN their meaning is understandable without lookup. GIVEN structured references WHEN rendered THEN explicit types use the agreed glyphs, status/confidence are words, and every entity list row and action target retains exact identity. GIVEN human-facing protocol codes WHEN presented THEN their meaning appears inline or unnecessary codes are omitted. GIVEN structured consumers WHEN reading improved responses THEN existing machine fields and selection, pagination, and byte-bound guarantees remain intact. GIVEN absent source descriptions WHEN referenced THEN unavailability is explicit without invented content or promised detail. GIVEN omitted detail WHEN retrieval is offered THEN that detail actually exists. GIVEN startup metadata WHEN compared with authoritative records THEN no missing field falsely reports normal, open, or satisfied. GIVEN glyphs are absent WHEN references are read THEN their meaning remains complete.
