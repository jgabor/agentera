    title: "Plan: JSON-only operational CLI output"
  what: Make JSON the sole operational CLI output protocol. Preserve plain text only for bare/help output, --version, and prime --guidance. Keep --format json as a permanent operational compatibility spelling, but remove it from active canonical commands.
  why: Agents should not repeat a redundant format flag. One operational protocol also removes format drift while preserving current JSON schemas, exit codes, bounds, and projections. This implements firm decision kicksvpwep and release-blocking TODO yfpppnyyzm before the v3 latest cutover.
  constraints: Text exceptions are text-only and reject format selectors. Structured inputs, JSON payload shapes, exit codes, output streams, and output budgets remain stable. Active external text or YAML parsers may break before v3 reaches latest. Historical artifacts remain unchanged. Do not publish, push, or increase versions beyond 3.0.0.
  overall_acceptance: GIVEN any live operational success or error path WHEN invoked without a format selector THEN it emits its existing bounded JSON contract with unchanged exit behavior; explicit JSON remains equivalent; text and YAML selectors are rejected; only the approved text exceptions remain; active canonical commands omit the redundant flag; source, bundle, extracted package, gates, and typed state agree.
  scope:
