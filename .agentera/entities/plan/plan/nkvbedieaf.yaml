      - All live operational success and error paths
      - Format parsing and text-exception precedence
      - Active skills, schemas, help, examples, corrections, and generated commands
      - JSON output measurements and budgets
      - Source, bundled, and extracted-package behavior
      - Tests and typed closeout state
