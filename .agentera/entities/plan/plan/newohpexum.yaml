    title: "Plan: Harden CI bootstrap and reduce CLI lint debt"
  what: Deliver fail-closed bootstrap integrity for rtfizoqaxt and remove the dominant unused-declaration debt for ehudiaaepe, preserving the delivered Vite+ development workflow.
  why: Replace the accepted mutable-installer risk with verified execution and restore a meaningful lint ceiling without reopening historical certification or redesigning publication.
  constraints: Preserve Vite+ 0.3.0, pnpm 10.30.3, the current Node 24 pin, lockfile authority, CLI and state behavior, package integrity, frozen installs, lifecycle restrictions, and disabled authoritative caching. Keep the OIDC publisher checkout-free, action-free, and setup-free. No rule disabling, new suppressions, directory exclusions, warning-ceiling increases, mass formatting, or unrelated refactors. Do not alter historical certification evidence or bump release metadata. Integration and every publishing push require separate explicit authorization. Implementation branches target feat/v3 after closeout state is integrated. Prefer one passing and one rejecting case per changed testable boundary; reuse existing behavioral tests for declaration cleanup and justify extra cases.
  overall_acceptance: GIVEN clean setup WHEN bootstrap runs THEN downloaded bootstrap code is verified before execution and unavailable or altered inputs fail without mutable fallback. GIVEN the four setup jobs WHEN exercised THEN pinned tools and existing installation restrictions are preserved while the credential-bearing publisher is unchanged. GIVEN lint validation WHEN cleanup is complete THEN warnings are at most 48, errors are zero, and the ceiling equals the accepted measured count. GIVEN closeout WHEN evidence is reviewed THEN both selected TODOs are satisfied without claiming historical full qualification or unperformed hosted validation.
