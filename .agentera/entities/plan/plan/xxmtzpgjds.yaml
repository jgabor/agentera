    revised: "Adversarial review moved 2.3.11 archival into Planera activation bookkeeping, split required Realisera state into blockers versus caveats, made source scope conservative instead of inferred, added changelog fallback coverage, widened raw-read reduction criteria, named Decision 45 contract updates explicitly, made completed-plan sweep context read-only, and confined unsupported-command probes to tests only. [post-audit-flagged: PLAN.md full-plan artifact exceeds the advisory prose budget; preserving reviewed executable acceptance criteria is more valuable than compressing below the single-entry lint threshold.]"
    title: 2.3.12 Realisera Execution Context Source Contract
  what: Add a Realisera execution-context source contract through the existing `agentera hej --format json --capability-context realisera` startup seam so implementation cycles can receive the selected work item, acceptance criteria, constraints, verification expectations, artifact update requirements, progress logging requirements, and explicit scope/caveat boundaries from CLI state before raw plan, progress, TODO, docs, health, decisions, or changelog reads.
  why: The source-contract train made plan, orchestration, closeout, evidence, and benchmark startup paths CLI-first. Realisera remains the most important raw-heavy consumer because each cycle gathers plan, progress, TODO, health, docs, decisions, profile, vision, design, changelog, and git context before implementation. A complete execution_context should make plan-driven cycles start from CLI state and reserve raw artifact reads for source/code edits or last-resort diagnostics.
  constraints: Preserve Decision 45 state CLI boundaries and Decision 43 slash-route separation. Do not add `agentera realisera`, `agentera build`, a new top-level command, a new subcommand, or any route-alias command. The primary seam is `agentera hej --format json --capability-context realisera`; allowed fallback commands are existing state/query commands such as `agentera plan --format json`, `agentera progress --format json`, `agentera todo --format json`, `agentera health --format json`, `agentera docs --format json`, `agentera decisions --format json`, and `agentera query changelog --format json`. Do not refresh profile or installed app state, edit `.agentera/vision.yaml`, edit objective state, change Realisera's one-cycle rule, change commit/push safety rails, auto-dispatch work, run publication, push, tag, or implement 2.3.13+ source-contract work.
  scope:
    included:
      - "`execution_context` through `agentera hej --format json --capability-context realisera`."
      - Source-contract metadata declaring completeness, caveats, fallback commands, raw-read policy, provenance, and read-only context-generation boundaries.
      - Plan-driven selected work, task acceptance criteria, implementation constraints, verification expectations, artifact update requirements, progress logging requirements, changelog boundary, and conservative scope boundary metadata.
      - Completed-plan sweep metadata as read-only context; actual sweep writes, archive, and active-plan removal remain Realisera execution behavior.
      - Realisera prose and schemas that require complete execution_context before direct startup reads of plan, progress, TODO, docs, health, decisions, or changelog artifacts.
      - Focused regression tests, validation gates, independent review, and 2.3.12 local metadata sync.
    excluded:
      - Unsupported `agentera realisera`, `agentera build`, or other route-alias CLI commands.
      - Automatic worktree dispatch, implementation sub-agent launch, or product work execution.
      - Changes to Realisera's one-cycle rule, commit safety rails, no-push rule, or git config.
      - Vision, profile, installed app, objective-state, or Optimera objective-state mutation.
      - Invented file allowlists, path-derived scope facts, or raw artifact bodies in source contracts.
      - Publication, remote push, tag creation, and 2.3.13+ source-contract work.
    deferred:
      - A generic execution-context contract shared across non-Realisera implementation agents.
      - Rich source-file allowlist inference beyond explicitly recorded plan/source-contract data.
      - Any change to Realisera worktree dispatch or commit orchestration mechanics.
  design: "Expose an optional `execution_context` only when capability context is `realisera`. The stable shape is `work_selection`, `plan_task`, `acceptance_criteria`, `constraints`, `scope_boundary`, `verification_expectations`, `artifact_update_requirements`, `progress_logging_requirements`, `changelog_boundary`, `git_boundary`, `plan_completion_sweep`, `state_family_caveats`, `fallback_commands`, and `source_contract`. Complete plan-driven mode requires a dependency-ready pending task with non-empty acceptance criteria plus enough CLI state to describe verification, artifact update, and logging expectations. Completed-plan mode may be complete for read-only sweep guidance when all tasks are complete and required sweep inputs are visible. Missing plan state, no eligible task, blocked or skipped tasks, empty acceptance criteria, unavailable progress/TODO/docs/health/changelog state, compacted decision gaps, stale profile, missing vision/design/profile context, or unspecified source-file scope must be explicit incomplete or caveated output. Source scope is conservative: include artifact families and only explicit source paths from plan/source-contract state; otherwise report `source_scope.status: unspecified` instead of guessing."
  overall_acceptance:
    - GIVEN Realisera plan-driven startup needs current task context WHEN a dependency-ready task exists THEN the agent receives acceptance criteria, constraints, verification expectations, artifact update requirements, progress logging requirements, changelog boundary, and conservative scope metadata through CLI state without normal direct raw startup reads.
    - GIVEN execution state is missing, blocked, caveated, no-plan, or completed-plan sweep shaped WHEN implementation work proceeds THEN the source contract names missing state, caveats, fallback commands, and read-only context-generation boundaries honestly.
    - GIVEN 2.3.12 closes WHEN validation and local metadata sync finish THEN no unsupported CLI command, prohibited mutation, automatic dispatch, publication, push, tag, profile refresh, installed app refresh, vision edit, objective edit, or 2.3.13+ implementation occurred.
  surprises:
    []
