      []
  design: First restore a trustworthy baseline and record comparable measurements. Separate expensive fixture ownership from ordinary source startup. Exercise semantic behavior exhaustively on one canonical axis and use bounded smokes for representation axes. Keep machine-sensitive and production-scale evidence with their existing specialized owners. Batch repeated cold checks only where one process remains inside the same trust boundary. Finish with the policy-owned verification sequence and measured comparison.
