    title: "Plan: Faster focused test verification"
  what: Reduce avoidable setup, repeated format traversal, oversized correctness fixtures, and redundant process startup in the CLI test suite while preserving every governed regression boundary and verification owner.
  why: Focused source feedback currently pays for unrelated package construction and repeated evidence. The suite can return results sooner and remain easier to maintain without weakening package, runtime, boundary, performance, or capacity proof.
  constraints: Preserve the deterministic two-construction package proof, source/package runtime parity, exact glossary byte and entry limits, cursor ordering and termination, package and specialized-owner budgets, and the governed verification DAG. Do not weaken assertions or budgets, add dependencies, change product behavior without a reproduced defect, publish, or push.
  overall_acceptance: GIVEN the current verification contracts WHEN the complete plan is delivered THEN the source baseline and governed release DAG pass, unrelated focused source tests perform no package construction, all retained boundaries and parity checks remain covered, and controlled measurements show lower source median wall time and fewer cold child processes without a budget increase.
  scope:
    included:
      - Restore the current source verification baseline before measuring improvements.
      - Make package-backed setup local to the source integration that needs it.
      - Remove confirmed duplicate and multiplicative source-test work.
      - Align timing and scale evidence with existing performance and capacity owners.
      - Batch repeated missing-surface process checks within their existing trust boundaries.
      - Verify through the governed owner DAG and synchronize typed project state.
    excluded:
      - Product feature changes unrelated to a reproduced testability defect.
      - New verification owners, dependencies, compatibility layers, or relaxed budgets.
      - Publication, pushing, or release-channel changes.
