      resolve_by: Inventory current contracts and run bounded fixtures before Task 2. If extraction semantics must change, stop and revise downstream acceptance.
    - question: Which existing protected or typed writer, approval record, and atomic mutation contract can persist a confirmed project glossary while audit and discuss remain mutation-free?
      affects_task: 4
