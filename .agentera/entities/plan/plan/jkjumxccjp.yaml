    title: "Plan: Proportionate execution and evidence reuse"
  what: Make evidence reuse, early testing of consequential assumptions, and minimal mechanisms shared Agentera execution rules. Align capability behavior, Plan validation, and this repository's maintainer guidance so completed work does not restart unnecessary verification or expand its approved scope.
  why: This session exposed redundant commit review and an invented credential scanner, late discovery that related tests took several minutes, and contradictory workflow mandates. Shared guidance alone cannot work while consumers require repeated suites, optional progress records, invented plan findings, or unauthorized continuation.
  constraints: Reuse passing evidence only when its scope, relevant inputs, environment, and coverage still apply. Missing, stale, unrelated, or insufficient evidence never establishes PASS. Required hooks, CI, release trust-boundary checks, typed writers, read-only guarantees, and explicit authorization remain binding; evidence reuse is not permission to bypass them. A small representative probe precedes substantial work only when an unanswered assumption can change the approach. Research, delegation, worktree isolation, periodic audits, and extra validators require a concrete need or existing project obligation. Commit-only requests do not restart Build, state orientation, broad review, or ad-hoc scanning when the intended work is already reviewed and verified. Stop at the approved scope; blockers do not authorize unrelated work. Preserve existing IDs, artifact identities, readable labels, bounded startup output, and historical records. Keep existing terminal health/lifecycle safeguards; change post-closure continuation, not terminal writer safety predicates. No new commands, persistent evidence fields/stores, caches, receipts, policy copies per capability/project, host-native enforcement layer, version changes, registry publication, or automatic downstream-project rewrites. Repository and bundled rules acknowledge that host/project requirements govern their own boundaries and that a session must load Agentera to receive its guidance. For each changed contract in tasks 1-3, use a positive case plus a relevant negative/boundary case in existing owners; reuse existing coverage. Task 4 consumes those results and runs only uncovered or invalidated checks plus mandatory final gates on the final relevant inputs. Distinguish contract/validator tests from actual host-agent compliance. Fold related state into substantive delivery; create no standalone bookkeeping commit. Commits and pushes require separate explicit authorization.
  scope:
    included:
      - Shared operating authority in skills/agentera/protocol.yaml, a concise pointer in skills/agentera/SKILL.md, and the existing shared served-instruction path in packages/cli/src/capabilities/index.ts. Keep operating principles separate from HUMAN_REFERENCES and remove conflicting prose rather than stacking boilerplate.
      - "Build, Orchestrate, and relevant Audit instruction consumers: clear verification responsibility and reuse; optional-progress evidence; conditional research/delegation/isolation/periodic audit; conditional commits and success without an unauthorized commit; stopping after approved work and not selecting unrelated work after a blocker. Align directly affected capability validation/exit declarations, including skills/agentera/capabilities/build/schemas/validation.yaml, with conditional commits and scoped completion; preserve one-cycle stopping and authorization boundaries."
      - Existing Build/Orchestrate execution and evaluator context under packages/cli/src/cli/capabilityContext/ and references/cli/capability-instruction-contract.yaml only where current output contradicts optional progress or the scoped authorization boundary. Use existing task/worker evidence rather than introducing an evidence protocol.
      - Plan instructions, skills/agentera/capabilities/plan/schemas/validation.yaml, skills/agentera/schemas/artifacts/plan.yaml, and packages/cli/src/hooks/validateArtifact/schema.ts with its existing consumers. Permit zero review findings, no remaining unknowns, and no extra synchronization task when closeout is already covered; keep valid review/approval and actual planning-quality requirements.
      - "Repository AGENTS.md and maintainer state/verification skills: three concise operating rules, a narrow commit-only path, fresh-build reuse, relevant-only state reads and skill loading. Qualify the release trigger as release verification/approval. Update directly affected contributor guidance."
      - Existing capability/prose, artifact validation, context/evaluator, startup-budget, and source/generated/extracted-package test owners. Current project state and user-facing Unreleased documentation closeout through their existing authorities.
    excluded:
      - Changing hook configuration or CI/publication ownership, weakening required gates, inventing a test-result cache, or adding an agent-tool policing system.
      - Changing plan level taxonomy, adding progress tracking to more capabilities, redesigning bootstrap scalar inventories, or resolving unrelated TODOs.
      - Removing mandatory terminal health/writer safeguards, rewriting historical entities, automatically editing downstream AGENTS files, or claiming policy applies to hosts that never load it.
      - Package version bumps, pushes, registry publication, and adoption automation outside the existing distribution path.
    deferred:
      []
  design: Establish concise shared execution rules and reconcile the consumers that currently disagree with them. Resolve evidence availability before changing evaluation behavior, then align planning validation and maintainer workflows with the same semantics. Check ordinary and exceptional behavior through existing contract and runtime boundaries, and close the scoped work using the resulting evidence.
  overall_acceptance: GIVEN unchanged reviewed work WHEN a commit-only request arrives THEN the workflow uses intended staging, configured hooks, and result checks without restarting implementation verification. GIVEN applicable worker evidence WHEN another role receives the task THEN covered checks are reused; a specific gap or invalidating change triggers only justified additional verification. GIVEN consequential uncertainty WHEN dependent implementation is proposed THEN a small relevant probe comes first. GIVEN adequate task evidence WHEN an optional progress record is absent THEN evaluation does not fail solely for that absence. GIVEN a reviewed full plan with zero findings and no remaining unknowns WHEN validated THEN it is accepted if other requirements hold, without an artificial extra closeout task. GIVEN successful work without commit authorization WHEN completion is reported THEN a commit is not required. GIVEN completed or blocked scoped work WHEN the next action is chosen THEN no unrelated task, new plan, or unauthorized commit starts. GIVEN an updated bundle in a compatible runtime WHEN Agentera is loaded THEN the same rules are served without project-state migration and within existing bounds. GIVEN a genuine risk or mandatory project/trust gate WHEN verification is needed THEN the simplification does not suppress it.
