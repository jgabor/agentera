    title: "Plan: Simplify slow source tests"
  what: Reduce the cost of four slow source-test scenarios while preserving their behavioral, security, package-boundary, and regression evidence.
  why: The four scenarios consume 94.806 seconds of cumulative worker time and mix oversized fixtures, duplicate recovery work, unrelated integration work, and package construction into source verification.
  constraints: Do not change production behavior, weaken cursor security, remove 120-row capacity coverage, or replace executable package evidence with source-only calls. Keep release metadata and user-facing documentation unchanged. Use one passing and one failing case per testable contract unless an existing table provides stronger evidence.
  overall_acceptance: GIVEN the four recommendations are implemented WHEN targeted, source, package, typecheck, and timing verification run THEN all retained contracts pass and the affected tests total no more than 60 seconds of same-machine worker time without creating a new release gate.
  scope:
    included:
      - Precommit Git-environment regression coverage
      - TODO cursor traversal and malformed-cursor source tests
      - Profile Full source workflow and extracted-package checks
      - Regression verification and source timing comparison
    excluded:
      - Production CLI behavior changes
      - Capacity-lane scale reductions
      - Release, version, changelog, and unrelated test cleanup
    deferred:
      - Simplification of slower tests outside recommendations 1 through 4
  design: Keep each contract in its cheapest authoritative verification owner. Replace broad integration evidence with narrow behavioral proof, use minimum fixtures for semantic tests while retaining scale evidence in capacity verification, and reserve extracted-executable assertions for package verification. Finish with complete source and package checks plus a diagnostic timing comparison.
