  design: First establish one observable consumer and caveat lifecycle contract that resolves the planning unknowns before capability work begins. Then prove bounded acquisition of independently owned inputs and resolve them into one advice matrix. Discuss, Plan, and Build consume that advice at explicitly governed meaning-sensitive events without redefining precedence or publication. Interactive paths clarify before relying on disputed meaning; autonomous paths avoid the disputed meaning and hand privacy-safe caveats to the contract-owned evidence channel. Prime projects only current caveats and preserves unrelated attention. Source behavior is verified before constructed-package parity. After substantive source is selected, development metadata and canonical state close together under final non-publishing gates.
