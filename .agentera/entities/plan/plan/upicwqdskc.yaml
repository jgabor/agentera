    title: "Plan: Real-time glossary disambiguation"
  what: Add one shared, read-only glossary consumer boundary for Discuss, Plan, and Build. In project-scoped work, project definitions govern exact collisions, valid project gaps fall back to personal definitions, divergent definitions retain project authority while surfacing tension, and inferred semantic equivalence requires review. Interactive capabilities pause for meaning-sensitive clarification; autonomous work proceeds without assuming disputed meaning and emits privacy-safe caveat evidence for prime attention.
  why: Personal and project glossary producers now ship independently, but consumers cannot use them together. Shared consumer semantics make terminology actionable without weakening producer ownership, leaking personal information, duplicating precedence rules, or writing conflict state into either glossary, decisions, or plans.
  constraints: Preserve personal and project ownership, evidence, and lifecycle boundaries. Personal synthesis remains invariant to project glossary presence. Resolve project glossaries only through canonical discovery. Consumer advice, clarification, and tension resolution cannot publish, authorize, merge, suppress, repair, or mutate either glossary; explicit digest-bound project publication remains separate and Build-owned. Exact divergent collisions use project meaning and surface tension; inferred equivalence never silently selects a meaning. Canonically absent or valid-empty project state may establish a personal fallback, but malformed, unreadable, ambiguous, or over-bound project state cannot. Transient advice exposes only the minimum applicable meaning and ownership; durable evidence, attention, diagnostics, and errors expose no personal definitions, anchors, profile paths, raw sections, unrelated entries, or private provenance. Autonomous caveats use one contract-owned evidence lifecycle outside glossary, decision, and plan conflict state. Only glossary-caveat projection and required closeout evidence may change prime or progress behavior; generic status, progress, profile, and replacement-evaluation redesign remain excluded. Suite metadata stays 3.0.0. Never publish, tag, push, promote, or change channels.
  overall_acceptance: GIVEN valid and partially available personal and project glossary inputs WHEN Discuss, Plan, Build, and prime execute through source and constructed-package paths THEN exact project authority, personal fallback, divergent-definition tension, review-required equivalence, interactive clarification, autonomous privacy-safe caveats, and caveat lifecycle behave consistently without producer or conflict-state mutation; ruzauoaotd resolves only after all evidence passes, qnxhsaxrjd and unrelated work remain open, Decisions prmnztjytv and mcsmqqitnm retain their existing satisfaction state, package metadata is exactly 3.0.0-dev.38 with suite 3.0.0, and no publication, tag, push, promotion, or channel mutation occurs.
