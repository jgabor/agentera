      affects_task: 2
      resolve_by: Task 1 produces normalized aggregate metrics from an explicitly consented bounded source, or uses paired synthetic fixtures and records that no recent-host usage claim is available.
    - question: Which compound approval flows can reuse unchanged validated fields without introducing hidden state or weakening caller control, effect binding, stale-input rejection, or replay safety?
      affects_task: 5
      resolve_by: Tasks 2 and 4 establish the finalized eligibility and writer contracts; Task 5 simplifies only rows that satisfy every condition and retains or marks the rest unresolved.
