    title: "Plan: Migrate valid v2 compacted state into v3 entities"
  what: Make the one-way v2-to-v3 development upgrade accept valid progress, decision, and health summaries produced by supported v2 compaction, while preserving inherited decision confidence labels and reporting causal migration blockers truthfully.
  why: The sole supported forward upgrade currently rejects state Agentera v2 produced itself. Projects must be able to cross the v3 boundary without fabricated detail, silent evidence loss, hand-edited aggregates, or an additional recovery subsystem.
  constraints: Preserve one canonical entity authority, unchanged source aggregate bytes, strict current write vocabulary, fail-before-publication graph validation, bounded structured reads, and idempotent retry. Do not reconstruct from Git, add dual authority or a recovery/import command, mutate KTX, edit vision, release, publish, tag, push, or bump version metadata.
  overall_acceptance: GIVEN a clean tracked v2 project containing any valid default-compaction summary shape or inherited confidence label WHEN the development upgrade is previewed and applied THEN every retained fact is available through v3 entity reads with truthful degraded provenance, no omitted detail is invented, genuinely invalid sources still block before publication, and validation plus prime startup pass.
  scope:
    included:
      - Immutable degraded progress, decision, and health summary entities
      - Inherited decision confidence compatibility during migration and entity reads
      - Inline read-only satisfaction retained by decision summaries
      - Mixed full and summary retrieval, cursor, filter, budget, and prime behavior
      - Root-versus-dependent migration diagnostics and honest recovery guidance
      - Provenance-bound fixtures generated by the supported v2 compactor
      - Hermetic full-upgrade proof and read-only KTX preview corroboration
    excluded:
      - Git-history reconstruction, projection repair, restore, or evidence import
      - Dual aggregate and entity authority after cutover
      - Mutation or full upgrade of the dirty KTX checkout
      - Objective experiment summaries protected by the supported v2 compaction path
      - Runtime-local session bookmarks and already-complete compacted TODO rows
      - Version bump, release, publication, tag, push, or vision changes
    deferred:
      - A separate experiment-summary contract if pinned v2 evidence proves a supported protected-path exception
  design: Define the compatibility boundary first, bind it to reproducible v2 evidence, then update migration interpretation before exposing degraded entities through ordinary reads. Keep full and summary records as distinct canonical boundaries, preserve summary satisfaction within its incomplete record, and separate source-root blockers from dependent graph failures. Prove the whole one-way lifecycle in hermetic Git state before using KTX as supplemental read-only evidence.
