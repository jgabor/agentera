      - TODO artifact readiness and ordering contract
      - typed TODO create, update, explain, list, and get behavior
      - status readiness selection from complete entity state
      - TODO next_action identity and exact retrieval projection
      - status instructions and routing vocabulary alignment
      - reviewed annotations for persisted open TODOs
      - source, integration, adversarial, and state closeout coverage
    excluded:
      - hybrid request and receipt protocol changes
      - capability trigger semantic changes
      - identity changes for plan, health, objective, decision, or vision recommendations
      - glossary feature implementation
      - unrelated TODO execution
      - broad prime diagnostics redesign
      - package publication
    deferred:
