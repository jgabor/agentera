    title: "Plan: Intent-aware status readiness"
  what: Replace prose-derived TODO next-action guessing with explicit validated readiness, ensure complete state drives recommendation before output bounding, exclude non-actionable work, establish truthful deterministic ordering, and verify every supported outcome.
  why: Audit tmfxkjtoph found four routing warnings. The glossary TODO was sent to build because bounded prose controlled a binary plan/build heuristic, while authoritative TODO state could not express the required discuss-first handoff.
  constraints: Keep request-to-capability routing separate from state-derived next_action. Preserve entity identity, atomic typed writes, bounded output, exact retrieval, and concurrent user edits. Do not introduce semantic keyword, regex, score, or automatic prose-classification authority. Do not fabricate chronology, modify vision, execute unrelated TODOs, publish packages, or bypass the v3 cutover hold.
  design: State producers declare a TODO's intended next capability and readiness constraints through one contract. Status derives phase and eligibility from canonical authorities, recommends only actionable records, and treats absent annotations as triage rather than implementation consent. Complete records drive selection; bounded projections follow. One reviewed policy orders equally severe actionable records. Existing records receive annotations only through explicit review, after writers and consumers are ready.
  overall_acceptance: GIVEN open TODO state WHEN status recommends work THEN complete authoritative readiness determines eligibility and capability, stable identity and exact retrieval remain available, bounded prose cannot change the result, blocked or unreviewed work never becomes implementation by default, and hybrid user-request routing remains unchanged.
  scope:
