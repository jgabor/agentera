    title: Deepen Agentera Install Root Module
  what: |
    Replace duplicated Agentera install-root identity, discovery, classification, and diagnostic behavior with one deeper Module. Setup helpers, doctor, upgrade, and runtime adapter checks should cross the same Interface instead of carrying separate canonical-entry lists, environment fallback rules, and stale-root interpretations.
  why: |
    Architecture review found the install-root Module is shallow: deleting any caller-local root check mostly moves the same complexity into another caller. Decision 33 makes AGENTERA_HOME the installable suite bundle root, and the self-healing bundle refresh lane depends on that identity being consistent. A deeper Module concentrates bundle identity, safety semantics, and tests so future setup and refresh work has locality and leverage.
  constraints: |
    Preserve confirmed writes: discovery and classification never mutate durable bundle state. Do not broaden this lane into the full RuntimeAdapter registry, package metadata registry, external CLI distribution, or live host testing. Preserve existing primary CLI behavior unless a documented inconsistency is intentionally standardized. JavaScript runtime code is only aligned through a contract fixture in this plan unless a safe shared source already exists.
  scope:
    included:
      - archive the completed self-healing bundle refresh plan
      - inventory current install-root behavior in setup helpers, doctor, upgrade, and runtime adapter checks
      - characterize valid managed roots, missing paths, file-valued roots, unmanaged directories, stale managed roots, invalid bundles, explicit roots, env roots, and default roots
      - define one read-only install-root Interface with source, kind, action, diagnostic, and mutation-safety semantics
      - "migrate Python callers in risk order: doctor first, setup helpers second, upgrade last"
      - align JavaScript runtime behavior through contract fixture checks, not broad cross-language migration
      - update docs and artifacts after behavior is proven
    excluded:
      - full RuntimeAdapter registry
      - suite package metadata registry
      - external CLI distribution
      - package-manager hooks
      - broad artifact migration
      - live model calls
      - runtime setup behavior outside install-root resolution and diagnostics
    deferred:
      - generated cross-language install-root contract if fixture validation is not enough
      - RuntimeAdapter registry work tracked by [arch-runtime-adapter-registry]
      - package metadata registry work tracked by future package-contract findings
  design: |
    Put the seam at install-root discovery and classification. Callers provide an explicit root, environment, default-root policy, and current working context; the Module returns a typed, read-only result that says where the root came from, what kind of root it is, what action is safe, and what diagnostic should be shown or exposed as structured data. Setup helpers, doctor, and upgrade keep their runtime-specific responsibilities, but stop owning bundle identity. Upgrade remains the last migration because it can write bundle state.
  overall_acceptance:
    - GIVEN any Agentera caller needs an install root WHEN it resolves or validates that root THEN it crosses one shared Interface for bundle identity and diagnostics
    - GIVEN root discovery or classification runs WHEN approval is absent THEN no durable bundle writes occur
    - GIVEN the same root shape reaches doctor, setup, upgrade, or runtime contract checks WHEN behavior is compared THEN classification and safe action agree
    - GIVEN install-root behavior changes in the future WHEN maintainers update tests THEN the change is localized to the shared Module and its caller contract tests
