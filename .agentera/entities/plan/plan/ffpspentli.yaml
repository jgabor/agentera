    title: Decision 57 Capability Instruction Contract
  what: "Document Decision 57's capability instruction contract: capability instruction files move from `prose.md` to `instructions.md`, `first_invocation_read` declares startup-read obligations, and first capability invocation reads `instructions.md` in full unless a compact-startup exception is explicitly declared."
  why: Decision 57 is the last P0 foundation document before the rename, metadata, feature, and validation TODOs. Agents need one documented contract that separates the future instruction-file name, startup-read metadata, compact-startup exception semantics, and compatibility boundaries before implementation starts.
