  overall_acceptance:
    - A Decision 57 capability instruction contract authority documents the future `instructions.md` convention, `first_invocation_read` semantics, full-read obligation, compact-startup exception boundary, and current compatibility state for `prose.md`.
    - Docs and focused checks make the contract discoverable without claiming that file renames, validator behavior, runtime descriptors, or CLI metadata have already changed.
    - The top TODO is closed without renaming capability files, adding `first_invocation_read` behavior, changing validators, rewriting descriptors, version bumps, runtime config refreshes, package-manager changes, publication, protected artifact edits, or decision satisfaction changes.
