  kind: fix
  target_version: 3.0.0
  requirements:
    - For every Profile Full generation, compute each non-glossary decision entry's `first` date from the earliest timestamp among its supporting records in the selected current bounded signal generation.
    - Compute each non-glossary decision entry's numeric confidence only from supporting signals in that same generation, applying the declared evidence-strength bands and any bounded-signal sufficiency cap; a matching prior PROFILE.md entry must not supply or raise the date or confidence.
    - Treat the prior non-glossary profile only as history and change-summary input, never as evidence for a newly generated claim.
    - Exclude a signal whose `evidence_anchor` does not resolve within the current generation's retained full-evidence shards; omit the claim when no resolvable support remains, otherwise recompute its date and confidence from the remaining resolvable support.
    - Preserve the independently owned personal Glossary section byte-for-byte. Glossary-entry confidence, permanence, `confidence_basis`, decay, admission, review, and publication lifecycle are explicitly excluded.
  acceptance:
    - GIVEN a prior non-glossary entry with an earlier `first` date or higher confidence than the current bounded signal generation supports WHEN Profile Full regenerates the profile THEN the output uses the earliest resolvable supporting timestamp and confidence derived only from that generation, without carrying forward either prior value.
    - GIVEN identical current bounded signals and prior profiles with different non-glossary dates or confidence WHEN Profile Full generates each base profile THEN the generated non-glossary metadata is identical.
    - GIVEN an unresolved evidence anchor WHEN non-glossary provenance is computed THEN that signal contributes neither a date nor confidence, and a claim with no remaining resolvable support is absent.
    - GIVEN an insufficient bounded-signal family WHEN its non-glossary category is synthesized THEN confidence is capped at CS4 (30-49) or below and the profile reports the declared flagged limitation.
    - GIVEN an existing canonical personal Glossary section WHEN the non-glossary provenance behavior and its tests run THEN the owned section remains byte-identical and no glossary admission, review, confidence, permanence, decay, or publication behavior changes.
  release_blocker: false
