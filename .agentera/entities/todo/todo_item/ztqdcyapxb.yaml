  title: Scope each product-v1 reset effect to v1 evidence at its own location
  requirements:
    - "`upgrade --reset-product-v1` must delete the data home, including a v3-generated PROFILE.md, the installation, and home-level host resources only when the installation itself holds v1 evidence."
    - Project-only v1 evidence must select only that project's state and project-level host resources, and a v1 installation must not delete a v3 project.
