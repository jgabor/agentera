  title: Add refresh-before-patch discipline to shipped agent guidance.
  requirements:
    - After delegation, audit feedback, generated-output construction, or a failed patch, require agents to re-read the exact target and current diff before retrying.
    - Treat guessed paths, stale offsets, and stale source context as invalid instead of blindly retrying a patch.
    - Keep this concern attributed to host and agent execution rather than classifying tool-error counts as Agentera product defects.
  acceptance:
    - Served and bundled agent guidance names each context-invalidating trigger and the required refresh-before-patch response.
    - Contract coverage proves the source and packaged guidance preserve the same refresh rule.
    - The guidance distinguishes operational host friction from Agentera product failures.
