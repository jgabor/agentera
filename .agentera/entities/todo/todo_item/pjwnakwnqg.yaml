  title: Stop naming a PLAN.yaml file that does not exist in fresh-project guidance.
  severity: annoying
  release_blocker: false
  requirements:
    - On a fresh project, `doctor` `current_health.writer_readiness.error` lists `state plan create --input PLAN.yaml` as the second initializer, and its recovery text repeats it. No PLAN.yaml exists, so an agent can follow a command that cannot run.
    - The same command comes from `freshPlanCreateCommand` in `migrationRequired.ts` and also reaches state-writer gate errors.
    - Lead with init. Describe plan creation as the alternative and point at `state plan explain --verb create` (or `prime --context plan`) to build the input, instead of a literal file name.
    - Keep both initializers listed and keep existing JSON fields.
  acceptance:
    - GIVEN a fresh git project WHEN doctor runs THEN no recovery or initializer text names PLAN.yaml as if it exists, and init is the first step.
    - GIVEN a fresh git project WHEN a state writer other than plan create runs THEN its gate error gives the same guidance.
