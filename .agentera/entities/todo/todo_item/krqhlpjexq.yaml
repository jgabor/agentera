artifact: todo
record:
  kind: fix
  target_version: 3.0.0
  title: Keep bare prime within its brief byte budget in projects with large attention lists
  requirements:
    - Bare `prime` fails when a project's state makes the minimum routing envelope larger than the 12,000-byte brief budget; one observed project needed 12,194 bytes, and the published development build fails the same way.
    - Prime must fit by bounding or omitting lower-priority sections with exact continuation commands, not by failing.
    - Until it fits, the failure must not report `unsupported_target` with "Correct the input and retry", because bare `prime` takes no input.
  acceptance:
    - GIVEN a test fixture project whose state produces a minimum routing envelope above the brief budget WHEN bare `prime` runs THEN it exits 0 within budget and reports each omission with a continuation command.
    - GIVEN the same fixture WHEN `prime --context status` runs THEN its output is unchanged by the fix.
  release_blocker: false
  severity: degraded
  status: open
  reconciliation:
