  title: Make optional profile grounding degrade without blocking self-contained capability requests.
  requirements:
    - Return one privacy-safe unavailable or repair-needed grounding result with no profile content when a profile is absent, malformed, ambiguous, unreadable, unsafe, oversized, or invalid UTF-8.
