      - GIVEN pack and next-channel publish dry-runs WHEN executed THEN the corrected authority and dev.21 metadata are included without publishing, tagging, pushing, or changing tracked files.
      - GIVEN command or environment failures WHEN evidence is reviewed THEN product defects are distinguished from registry, credential-substitution, fixture, or tool diagnostics before closeout.
