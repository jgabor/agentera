  date: 2026-07-10
  question: How should the document capability instructions be audited, improved, and rewritten for the D80 six-section spine, D79 direct-contract delegation, D71 modal vocabulary, D81 voice delegation, and v3 reality?
  context: "Eighth capability audit. Document is a mode-split shape — the DTC docs-first workflow with four modes: first-run survey, intent-first, explore-and-generate, update-and-verify. Pre-flight grounding found v2-era ghost commands: `agentera describe` (v3: `agentera schema`); `agentera query --list-artifacts` (v3: `agentera state query --list-artifacts`); `agentera query changelog` (v3: `agentera state query changelog`); `agentera lint --artifact` (v3: `agentera check lint --artifact`, 4 occurrences); `agentera decisions` (v3: `agentera state decisions`); `agentera docs` (v3: `agentera state docs`); `agentera progress` (v3: `agentera state progress`); `agentera todo` (v3: `agentera state todo`). Ghost contract Section 24 cited 3x (contract tops at 23). `CLAUDE.md` references 3x (v3: `AGENTS.md`). Canonical filenames as direct reads (VISION.md, PROGRESS.md, DECISIONS.md, HEALTH.md; v3 uses `agentera state <name>` or `.agentera/*.yaml`). Standalone Visual identity section (fold into Purpose). Contract values token enumeration (protocol.yaml is authority). contract.md pointer (removed from all audited capabilities). Full artifact-path-resolution subsection (SKILL.md owns). Standalone Closeout context startup 40-line section re-encoding source_contract rules (D79 violation). Decision satisfaction authority 10-line subsection (D87 compressed to Safety rail one-liner). Step 0 Detect context step-numbering bloat. Doc-prose enforcement step re-encoding self-audit rules that `agentera check lint` already checks. Triple-stated self-audit text (4 identical standalone steps plus narration voice personality, D81 violation). NEVER in safety rails (D71: MUST NOT). Comment header D65 tracking marker. Getting started as standalone section (fold into section 6). Substance design decisions: (S1) self-audit folded into write steps, 4 standalone steps removed, D85/D86/D87 propagation; (S2) closeout context compressed to 3-line pointer (D79 pattern from build/audit); (S3) decision satisfaction moved to Safety rails one-liner (D87 pattern); (S4) Step 0 mode detection folded into opening paragraph; (S5) doc-prose enforcement compressed to lint plus report in Verify step. New length 14886 chars (was 21779, 32% reduction). references/cli/capability-instruction-structure.md document row Complete (D88). D77 compacted to archive for D88 entry."
  alternatives:
    - name: Rewrite with substance improvements and drift cleanup
      status: chosen
      reason_chosen: All five substance findings (self-audit fold, closeout context compression, decision satisfaction to Safety rails, Step 0 removal, doc-prose enforcement compression) address real capability design gaps. Drift cleanup aligns with prior audit precedent (D79-D87). Closeout context compression closes the last D79 direct-contract violation among mode-split capabilities. Self-audit fold completes the D85/D86/D87 propagation. Doc-prose enforcement compression eliminates triple-stated self-audit rules.
    - name: Drift-only cleanup without substance changes
      status: rejected
      reason_rejected: Would leave the self-audit as 4 standalone steps (inconsistent with D85/D86/D87), the closeout context section re-encoding contract rules (D79 violation), the decision satisfaction as a 10-line subsection (D87 compressed it), Step 0 numbering bloat, and the doc-prose enforcement step re-stating rules the lint command already checks; a capability that follows the spine but retains v2-era waste still fails the audit.
  choice: Rewrite with substance improvements and drift cleanup
  reasoning: "Prior audits (D82 discuss, D83 research, D84 plan, D85 build, D86 optimize, D87 audit) established substance findings as the highest-leverage changes. Document substance findings follow the same pattern: the self-audit fold, closeout context compression, decision satisfaction to Safety rails, Step 0 removal, and doc-prose enforcement compression are the same class of finding. Closeout context compression closes the last D79 direct-contract violation among mode-split capabilities. Self-audit fold completes D85/D86/D87 propagation. Doc-prose enforcement compression eliminates triple-stated self-audit rules."
  confidence: firm
  feeds_into: references/cli/capability-instruction-structure.md, packages/cli/src/capabilities/document/, TODO.md
  satisfaction:
    state: user_confirmed_satisfied
    evidence: "Document capability rewritten per six-section spine, direct-contract, voice delegation. User approved each cadence step: substance decisions S1-S5 individually confirmed; structural findings batch approved; outline confirmed before drafting; draft approved before applying to instructions.ts. Sibling files updated: triggers.yaml CLAUDE.md to AGENTS.md; deviation table document row Complete (D88); D77 compacted to archive. typecheck 0 errors; build clean; capability validation PASS; contract validation PASS (0 violations); check compact within limits; vitest 144/144 files, 1278/1278 tests green."
    user_confirmation:
      confirmed_by: user
      confirmed_at: 2026-07-10
  outcome: Rewrite with substance improvements and drift cleanup
