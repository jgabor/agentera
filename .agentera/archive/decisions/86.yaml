record:
  number: 86
  date: 2026-07-10
  question: How should the optimize capability instructions be audited and rewritten to align with the six-section spine, direct-contract philosophy, and voice delegation, while adopting substance design improvements (self-audit fold, subagent spawning compression, benchmark context lean seam, experiments context block, brainstorm ceremony cut) from prior audits?
  context: "Seventh capability audit. Optimize is a cycle-based shape — metric-driven optimization, one experiment per invocation. Shares the cycle shape with build; D85 explicitly noted subagent spawning compression \"propagates to optimize audit.\" Pre-flight grounding found v2-era ghosts: `agentera lint --artifact` (v3: `agentera check lint --artifact`); `npx -y agentera experiments` (v3: `agentera state experiments`); `agentera decisions` (v3: `agentera state decisions`); `CLAUDE.md` in project discovery (v3: `AGENTS.md`); `PROGRESS.md` as direct filename read (v3: `.agentera/progress.yaml` via `agentera state progress`); `$AGENTERA_PROFILE_DIR/PROFILE.md` resolver flow (v3: `status.profile` from prime); `OBJECTIVE.md` and `EXPERIMENTS.md` in schema file references (v3: `objective.yaml` and `experiments.yaml`); `optimera_harness` artifact_id in schemas (v3: `optimize_harness`, D72); standalone \"Visual identity\" section (fold into Purpose); \"Skill introduction\" line (cut); full \"Contract values\" token enumeration (protocol.yaml is authority); full artifact-path-resolution subsection (SKILL.md owns); contract.md pointer (removed from status and build); \"Experiment history analyzer contract\" ghost section (references non-existent `npx -y agentera experiments` command); \"The sharp colleague\" personality in brainstorm (D81 violation); \"Narration voice (riff, don't script)\" personality leak; NEVER in safety rails (D71: MUST NOT); `/loop` host concept referenced as if a CLI command; full runtime subagent spawning table (~40 lines, shared verbatim with pre-D85 build); two separate self-audit steps (brainstorm Step 5 + cycle Step 7, should be pre-write gates inside write steps); comment header D65 tracking marker in shipped code; \"Getting started\" as standalone section (fold into §6). Substance design decisions: (S1) self-audit folded into Log — 8 steps becomes 7 (orient, analyze, hypothesize, implement, measure, decide, log); (S2) subagent spawning table compressed to one-line pointer — D85 propagation; (S3) benchmark context 30-line section replaced with lean 8-line seam matching build's execution_context pattern (D79); (S4) experiments.yaml gets context block (intent, constraints, unknowns, scope) — matches build's progress.yaml pattern; (S5) brainstorm stripped to 4 questions + write + approve, personality removed. New length 20,622 chars (was 25,990 — 21% reduction). references/cli/capability-instruction-structure.md optimize row Complete (D86)."
  alternatives:
    - name: Rewrite with substance improvements, drift cleanup, spawning compression
      status: chosen
      reason_chosen: All five substance findings (self-audit fold, subagent spawning compression, benchmark context lean seam, experiments context block, brainstorm ceremony cut) address real capability design gaps. Drift cleanup aligns with prior audit precedent (D79-D85). Subagent spawning compression completes the D85 propagation noted explicitly. Benchmark context lean seam closes the last D79 direct-contract violation among cycle-based capabilities. Experiments context block brings optimize's experiment log to parity with build's progress.yaml.
    - name: Drift-only cleanup without substance changes
      status: rejected
      reason_rejected: Would leave the self-audit as a standalone step (inconsistent with D85 build), the subagent spawning table at 40 lines (D85 explicitly said to propagate), the benchmark context section re-encoding rules the contract already mechanizes, the experiment log without context, and the brainstorm with personality — a capability that follows the spine but asks the wrong questions still fails the audit.
  choice: Rewrite with substance improvements, drift cleanup, spawning compression
  reasoning: "Prior audits (D82 discuss, D83 research, D84 plan, D85 build) established substance findings as the highest-leverage changes. Optimize substance findings follow the same pattern: the self-audit fold, subagent spawning compression, benchmark context lean seam, experiments context block, and brainstorm ceremony cut are the same class of finding as D85's minimal vision fallback, subagent spawning compression, and plan unknowns consumption. Subagent spawning compression completes the D85 propagation. Benchmark context lean seam closes the last D79 direct-contract violation among cycle-based capabilities. Experiments context block connects optimize's experiment log to the same shape as build's progress.yaml."
  confidence: firm
  feeds_into: references/cli/capability-instruction-structure.md, packages/cli/src/capabilities/optimize/, TODO.md
  satisfaction:
    state: user_confirmed_satisfied
    evidence: "Optimize capability rewritten per six-section spine, direct-contract, voice delegation. User approved each cadence step — substance decisions S1-S5 individually confirmed. structural findings batch approved. outline confirmed before drafting. draft approved before applying to instructions.ts. Validation: typecheck 0 errors; build clean; capability validation PASS; contract validation PASS (0 violations); check compact within limits; vitest green. Sibling files updated: deviation table optimize row Complete (D86); artifacts/validation/exit schema files updated; TODO resolved; D73 compacted to archive."
    user_confirmation:
      confirmed_by: user
      confirmed_at: 2026-07-10
  outcome: Rewrite with substance improvements, drift cleanup, spawning compression
