record:
  number: 85
  date: 2026-07-10
  question: How should the build capability instructions be audited and rewritten to align with the six-section spine, direct-contract philosophy, and voice delegation, while adopting substance design improvements (minimal vision fallback, plan unknowns consumption, subagent spawning compression, self-audit step fold) from prior audits?
  context: 'Sixth capability audit. Build is a cycle-based shape — the autonomous development loop that evolves software one cycle at a time. Most frequently called capability; primary user impression of agentera. Pre-flight grounding found v2-era ghosts: `agentera lint --artifact` (v3: `agentera check lint --artifact`); `agentera decisions` (v3: `agentera state decisions`); `agentera describe` claimed as migration alias but rejected in v3; `agentera verify eval skills` missing `check` namespace; `contract Section 24` cited twice but contract ends at Section 23; `CLAUDE.md` in project discovery (v3: `AGENTS.md`); canonical filenames (`PLAN.md`, `PROGRESS.md`, `DECISIONS.md`, `HEALTH.md`, `DOCS.md`) cited as direct reads when v3 serves via `.agentera/*.yaml` and `agentera state` commands; standalone "Visual identity" section (fold into Purpose); "Skill introduction" line (cut); full "Contract values" token enumeration (one-line reference to protocol.yaml); full artifact-path-resolution subsection (SKILL.md owns); contract.md pointer (removed from status); "The sharp colleague" personality in brainstorm (D81 violation); NEVER in safety rails (D71: MUST NOT); triple-stated cycle boundary rule; `/loop` host concept referenced as if a CLI command; Step 1 inner numbering confusion (items 1-9, then 10-11 mixed with discovery actions); 9 steps when self-audit is really a sub-step of Log; ~40-line runtime subagent spawning table shared verbatim with optimize; full 5-step brainstorm with personality and YAML shape for a fallback path (vision capability delegates). Substance design decisions: (S1) minimal vision fallback — cut 5-step brainstorm to 5-line inline question when vision capability is absent; (S2) no pre-dispatch fog-check — plan step "keep small enough" and subagent prompt "implement only what the plan describes" are sufficient gates; (S3) plan unknowns consumption — if selected task comes from plan and carries `unknowns:`, note in cycle context and log resolution in progress context.unknowns; (S4) subagent spawning table cut to brief pointer — stale-base rule and subagent prompt template stay; (S5) self-audit folded into Log step — 9 steps becomes 8. New length 15,081 chars (was 20,662 — 27% reduction). references/cli/capability-instruction-structure.md build row Complete (D85).'
  alternatives:
    - name: Rewrite with substance improvements, drift cleanup, spawning compression
      status: chosen
      reason_chosen: All five substance findings (minimal vision fallback, no fog-check, plan unknowns consumption, subagent spawning cut, self-audit fold) address real capability design gaps. Drift cleanup aligns with prior audit precedent. Subagent spawning compression propagates to optimize audit. Plan unknowns consumption bridges D84 unknowns field into build cycle context.
    - name: Drift-only cleanup without substance changes
      status: rejected
      reason_rejected: Would leave the brainstorm with full ceremony and personality for a fallback path, the subagent spawning table duplicated with optimize, 9 steps when 8 are cleaner, and the failure to consume D84 unknowns field — a capability that follows the spine but asks the wrong questions still fails the audit.
  choice: Rewrite with substance improvements, drift cleanup, spawning compression
  reasoning: "Prior audits (D82 discuss, D83 research, D84 plan) established substance findings as the highest-leverage changes. Build substance findings follow the same pattern: the minimal vision fallback, subagent spawning compression, and plan unknowns consumption are the same class of finding as D82 fog-aware readiness, D83 transferable concepts checkpoint, and D84 unknowns/rejected persistence. Subagent spawning compression propagates to optimize audit (identical table). Plan unknowns consumption connects D84 unknowns to build execution."
  confidence: firm
  feeds_into: references/cli/capability-instruction-structure.md, packages/cli/src/capabilities/build/, TODO.md
  satisfaction:
    state: user_confirmed_satisfied
    evidence: "Build capability rewritten per six-section spine, direct-contract, voice delegation. User approved each cadence step — substance decisions S1-S5 individually confirmed (S2 rejected). structural findings batch approved. outline confirmed before drafting. draft approved before applying to instructions.ts. Validation: typecheck 0 errors; build clean; capability validation PASS; contract validation PASS (0 violations); check compact within limits; vitest 1278/1278 green. Sibling files updated: deviation table build row Complete (D85); validation/exit/artifacts schema files updated; TODO resolved; D84 compacted to archive."
    user_confirmation:
      confirmed_by: user
      confirmed_at: 2026-07-10
  outcome: Rewrite with substance improvements, drift cleanup, spawning compression
