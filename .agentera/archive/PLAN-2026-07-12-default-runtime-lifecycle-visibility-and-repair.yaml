header:
  level: full
  created: 2026-07-12
  status: complete
  reviewed: 2026-07-12
  critic_issues: 14 found, 14 addressed, 0 dismissed
  revised: Added applicability and action classification, preserved explicit apply scope, separated active and retired cleanup, defined phase and routing semantics, bounded status output, and split verification.
  title: Default Runtime Lifecycle Visibility and Repair
what: Make the shared runtime lifecycle projection a first-class input to upgrade, project integration, prime, and status for OpenCode, Codex, Cursor, and Copilot. Default v3 previews reveal all runtime work, explicit selectors narrow approved writes, and every blocker routes to an appropriate repair, manual-review, or diagnostic action.
why: The lifecycle engine currently detects real runtime drift, but default upgrade returns no lifecycle plan and status ignores release-blocking runtime state. Users therefore see up-to-date guidance while repairable, ambiguous, and manually actionable work remains hidden.
constraints: Preserve Decision 92. Preview performs no writes, locks, native commands, or telemetry. Runtime writes require --yes plus an explicit runtime selector and touch only declared, ledger-owned or safely claimable destinations. Native install, authentication, enablement, and trust remain user-owned. Cursor CLI is required; Cursor IDE is conditional. Claude remains retired and explicit. Stable v2 behavior and the canonical shared skill location remain unchanged. Task 1 must resolve which enabled/trusted fields are safely probed versus manual or unobservable; Task 3 must resolve whether any pre-journal resource has authoritative ownership provenance, otherwise it stays blocked_unowned.
overall_acceptance: GIVEN a v3 runtime lifecycle preview WHEN no runtime selector is supplied THEN actionable and blocked work for all four active runtimes is visible alongside app and channel state. GIVEN status orientation WHEN runtime work exists THEN the highest-value safe repair, manual review, or diagnostic action is surfaced with an exact command or procedure. GIVEN approved lifecycle work WHEN apply runs THEN only explicitly selected, demonstrably owned operations execute and retries converge. GIVEN unowned or native resources WHEN projected THEN they remain unchanged and receive truthful guidance.
scope:
  included:
    - Canonical lifecycle applicability, action classification, counts, and command projection.
    - Default all-runtime v3 preview and explicitly scoped lifecycle apply.
    - Project-integration, prime, and status attention and routing integration.
    - Ownership-safe active-runtime repair and separate retired Claude cleanup guidance.
    - Cross-runtime, channel, packaging, documentation, and state verification.
    - Existing projection seams in packages/cli/src/upgrade/upgradeOrchestrator.ts and packages/cli/src/cli/orientation/attention.ts.
  excluded:
    - Runtime-native package installation, authentication, enablement, or trust approval.
    - Automatic adoption, overwrite, or deletion of unowned resources.
    - New active runtimes or a new canonical skill location.
    - Stable v2 lifecycle behavior changes.
  deferred:
    - Richer host probes where no bounded machine-readable evidence currently exists.
design: One canonical lifecycle projection classifies surface applicability, ownership, repairability, manual action, and diagnostic gaps. Doctor, upgrade, project integration, prime, and status consume that projection without reinterpretation. App migration and lifecycle phases remain separately visible; approved app refresh precedes a fresh lifecycle plan. Preview defaults broadly for visibility, while apply remains explicitly scoped for informed approval.
tasks:
  - number: 1
    name: Establish canonical applicability and action projection
    depends_on:
      []
    status: complete
    acceptance:
      - GIVEN any lifecycle consumer WHEN state is requested THEN one projection supplies snapshot identity, applicability, ownership, action class, counts, and command eligibility.
      - GIVEN Cursor CLI-only, IDE-present, or Agentera-integrated installations WHEN observed THEN CLI stays required while IDE is respectively not_applicable or conditionally expected.
      - GIVEN mandatory evidence without a safe probe WHEN classified THEN it becomes exact manual verification or an unobservable diagnostic gap, never repairable work.
      - GIVEN a shared resource WHEN selected THEN its applicability is invariant and required by at least one selected runtime.
  - number: 2
    name: Define default preview and explicit apply semantics
    depends_on:
      - "1"
    status: complete
    acceptance:
      - GIVEN a v3 dry-run without --runtime WHEN it executes THEN lifecycle findings for all active runtimes appear even when the app or channel phase is blocked.
      - GIVEN v2 stable behavior or apply without --runtime WHEN invoked THEN existing app-only write semantics remain unchanged.
      - GIVEN all-runtime apply WHEN generated THEN the command includes --runtime all and --yes; a named selector narrows runtime-specific writes.
      - GIVEN app refresh before lifecycle apply WHEN desired content may change THEN lifecycle state is re-observed and replanned before runtime writes.
  - number: 3
    name: Enforce ownership-safe repair and cleanup
    depends_on:
      - "2"
    status: complete
    acceptance:
      - GIVEN a declared absent destination or authoritative matching ledger record WHEN selected THEN the operation is claimable or managed; missing, corrupt, disconnected, or mismatched ownership fails closed.
      - GIVEN an unowned overlapping or outdated resource WHEN previewed or applied THEN it remains unchanged and receives exact manual review guidance.
      - GIVEN a narrowed selector WHEN applied THEN no runtime-specific resource belonging only to an unselected runtime changes.
      - GIVEN default active-runtime selection WHEN planned THEN Claude cleanup remains absent unless --legacy-cleanup claude is explicit and separately counted.
  - number: 4
    name: Drive project integration from lifecycle state
    depends_on:
      - "2"
      - "3"
    status: complete
    acceptance:
      - GIVEN owned pending lifecycle work WHEN project integration is summarized THEN it recommends the applicable upgrade preview and names affected runtimes.
      - GIVEN unowned collisions, user-owned native actions, or unobservable gaps WHEN summarized THEN guidance routes respectively to manual review, host action, or doctor diagnostics.
      - GIVEN no lifecycle or app work WHEN summarized THEN recommendation remains stay.
      - GIVEN simultaneous app and lifecycle work WHEN reported THEN phase counts, blockers, aggregate status, exit meaning, and retry guidance remain distinct.
    evidence: "Focused Task 4 project-integration suite: 20/20 passed; prime/doctor/lifecycle/orchestrator parity suite: 57/57 passed; full CLI suite: 1494 passed and exactly 8 documented release-metadata baseline failures from top-level 3.0.0-dev.16 versus core 3.0.0; typecheck, build, lint with 0 errors, compaction, Build capability validation, capability-contract validation, built CLI smoke, and git diff --check passed."
  - number: 5
    name: Surface lifecycle attention and next actions
    depends_on:
      - "4"
    status: complete
    acceptance:
      - GIVEN runtime work during prime/status WHEN rendered THEN at most two lifecycle rows summarize affected runtimes, action class, and truncation without exceeding the existing dashboard budget.
      - GIVEN repairable owned work WHEN ranked THEN an exact authority-derived preview may outrank unrelated TODO work; warning-only blockers do not displace executable work.
      - GIVEN manual or diagnostic-only blockers WHEN ranked THEN status presents the exact host procedure or doctor route and does not suggest an ineffective apply.
      - GIVEN clean lifecycle state WHEN rendered THEN runtime attention is omitted while the bounded lifecycle summary remains truthful.
  - number: 6
    name: Verify selectors, ownership, safety, and convergence
    depends_on:
      - "2"
      - "3"
    status: complete
    acceptance:
      - GIVEN OpenCode, Codex, Cursor, and Copilot scenarios WHEN tested THEN default preview, selector narrowing, shared-resource inclusion, and Cursor applicability have pass and fail coverage.
      - GIVEN missing, corrupt, disconnected, or mismatched ownership WHEN previewed and applied THEN mutation fails closed with stable causes.
      - GIVEN preview WHEN managed roots are compared THEN no creation, mutation, deletion, lock, journal, temporary publication, native execution, telemetry, or state write occurs.
      - GIVEN independent failure or partial success WHEN apply retries THEN dependency skips are explained and remaining owned operations converge.
  - number: 7
    name: Verify consumer and distribution parity
    depends_on:
      - "4"
      - "5"
      - "6"
    status: complete
    acceptance:
      - GIVEN one lifecycle scenario WHEN doctor, upgrade, project integration, prime, and status consume it THEN identities, applicability, classifications, counts, and commands agree.
      - GIVEN source checkout, npm development, npm stable, and explicit channel contexts WHEN commands are generated THEN invocation authority and shell-safe arguments are correct while stable v2 semantics remain unchanged.
      - GIVEN stale runtime claims or missing consumer wiring WHEN contract validation runs THEN validation fails for each active runtime.
      - GIVEN the completed behavior WHEN repository gates run THEN CLI tests, typecheck, build, compaction, docs checks, package inspection, and whitespace checks pass.
  - number: 8
    name: Synchronize release surfaces and project state
    depends_on:
      - "7"
    status: complete
    acceptance:
      - GIVEN accepted behavior WHEN release metadata is prepared THEN npm development advances from 3.0.0-dev.16 to 3.0.0-dev.17 while core suite surfaces remain 3.0.0.
      - GIVEN changed command and projection contracts WHEN inspected THEN schema, help, upgrade guidance, runtime documentation, and changelog describe the same defaults and safety boundaries.
      - GIVEN verified completion WHEN state closes THEN typed progress and plan state, relevant TODO entries, health evidence, and package-content assertions agree.
      - GIVEN release preparation WHEN complete THEN no publication, tag, or push occurs without a separate explicit request.
