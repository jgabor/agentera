    - name: Coupling health
      grade: A
      summary: The new helpers are stdlib-only and import nothing from `hooks/`, `skills/`, or each other. `scripts/smoke_setup_helpers.py` invokes both as black-box subprocesses, so the harness survives helper internals refactors. Test files use the standard `conftest.py` importlib pattern.
