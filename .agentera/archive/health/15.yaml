      summary: "`scripts/setup_codex.py` and `scripts/setup_copilot.py` slot into the existing repo-level utilities surface alongside `compact_artifact.py`, `usage_stats.py`, and `smoke_opencode_bootstrap.mjs`. They close the user-side install-friction gap on runtimes that have no plugin-level env-injection API, advancing VISION.md's portable-runtime thesis without forking skill behavior."
