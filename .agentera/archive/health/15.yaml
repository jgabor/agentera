    - name: Version health
      grade: A
      summary: "Two minor bumps today (1.19.0 → 1.20.0 → 1.21.0), both justified per `feat = minor`: 1.20.0 carried the AGENTERA_HOME contract plus OpenCode bootstrap, 1.21.0 carries the two setup helpers plus smoke harness. Splitting was correct because Audit 14 had already snapshotted 1.20.0 as a coherent unit. No unbumped commits since 9773f35."
