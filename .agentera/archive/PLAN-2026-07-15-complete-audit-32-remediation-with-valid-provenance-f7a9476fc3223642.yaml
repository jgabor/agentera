what: Complete the accepted Audit 32 authority correction and immutable provenance as one commit-capable outcome, prove release readiness without publication, and independently audit and synchronize final state.
why: The prior plan separated authority correction from provenance even though release validation requires valid provenance before the authority correction can commit. Replacing that impossible boundary preserves completed evidence while making the remaining work executable and independently verifiable.
constraints: Preserve the already staged authority correction, tests, bundle parity, changelog, Cycle 822, and progress bytes except for typed plan-state publication. Preserve the unstaged Task 1 pending correction in predecessor history. Keep the CLI package at 3.0.0-dev.21 and all suite-bearing surfaces at 3.0.0. Do not alter publication or retrieval behavior, storage policy, archive history, unrelated state, lockfiles, or version surfaces. Do not publish, tag, push, reset, unstage, or commit during planning. New execution evidence must be appended rather than rewriting Cycle 822.
