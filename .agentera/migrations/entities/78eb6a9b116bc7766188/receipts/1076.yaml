id: buvbxpleps
artifact: plan
record:
  header:
    level: light
    created: 2026-06-02
    status: archived
    reviewed: 2026-06-02
    critic_issues: 0 found, 0 addressed, 0 dismissed
    title: Freeze remaining CLI JSON contract parity fixtures
  what: |
    Three slices of the original `[test:3.0.0] Freeze CLI JSON contract parity fixtures` TODO remain unfrozen now that the npm CLI is at `3.0.0-dev.4` and the Python-oracle and npm-parity-matrix oracles exist: (1) the invalid-input guidance envelope that surfaces like `check validate`, `check verify`, and `state *` emit on bad arguments, (2) the `check validate` and `check verify` family JSON envelopes that have no parity oracle, and (3) the `source_contract` field set that `prime` and the per-capability `capability_context` capsule emit. Each slice gets a frozen JSON oracle and a parity/regression test that fails on contract drift. Task 1 is split into 1a (envelope contract: oracle + helper + one surface exemplar) and 1b (wire across the remaining CLI surfaces) so the per-cycle implementation surface stays small enough for one realisera cycle.
  why: |
    The Python-oracle fixture covers `python-main-contract.json` lifecycle and `npm-cli-surface.json` covers six command surfaces, but `check validate`, `check verify`, and the `source_contract` internals are not pinned. Decision 56 (parity orchestrator) remains open with the explicit "artifact validation, verify, full suite green" gap, and the new narrow TODO assumes a stable invalid-input envelope to express drift. Without frozen contracts, every new field or exit-code change in the validate/verify families lands without an oracle-level safety net, and the hej/planera/resonera/inspektera code paths that consume `source_contract` can drift silently.
  constraints: |
    - The npm CLI stays TS-only and on the `3.0.0-dev` series on
      `feat/v3`; do not add uv-installable v3 or cross-entry-point
      parity with the Python stable path.
    - Contract-first: extend
      `packages/cli/test/cli/fixtures/oracle/` and
      `packages/cli/test/upgrade/fixtures/oracle/` rather than
      introduce parallel documentation.
    - The Python-oracle and npm-cli-surface fixtures already in the repo
      stay authoritative; new oracles cite and reference them, do not
      duplicate.
    - Pin value types and structural shapes, not exact string content,
      for `source_contract` fields whose values legitimately vary by
      caller (e.g. `cli_fallback`, `confidence_caveats`).
    - No remote push; do not edit vision.yaml or objective state. - Decision 65 capability-instruction relocation is out of scope;
      this plan freezes contracts for the artifacts D65's TypeScript
      modules will export, not the relocation itself.
  scope:
    included:
      - Invalid-input guidance envelope (error shape, exit codes, valid-values/syntax/example template) for all CLI surfaces that reject arguments
      - Parity oracles for `check validate` (cross-capability, lifecycle-adapters, app-home-contract, capability, capability-contract, descriptors, artifact) and `check verify` (eval family) JSON envelopes
      - Frozen `source_contract` field set and value-type contract for the `prime` output and the per-capability `capability_context` capsule
    excluded:
      - Python CLI parity (the Python stable path is the oracle, not the implementation surface for 3.0)
      - Decision 65 capability-instruction relocation work
      - Full Decision 56 closeout (compaction and usage/stats are already frozen; this plan covers validate, verify, and source_contract)
    deferred:
      - Parity oracles for the remaining `state *` and doctor/setup surfaces that the npm-cli-surface fixture does not yet cover
  overall_acceptance: |
    After realisera completes the four tasks, the new oracles (invalid-input-envelope, validate-family, verify-eval-family, source-contract) exist under packages/cli/test/cli/fixtures/oracle/, the parity/regression tests in packages/cli/test/cli/ fail on contract drift across all CLI surfaces, the TODO.md field-name reconciliation lands in the same commit, and the Decision 56 "artifact validation, verify" slice is closed by this plan evidence. No remote push. vision.yaml and objective state untouched.
  surprises: |
    The new TODO enumerates source_contract fields (complete_for_capability_startup, missing) that do not match the live prime output keys (capability_startup_complete, missing_state); task 4 reconciles the field names and the TODO description in TODO.md is amended in the same commit. Task 1 was originally scoped as a single cycle but split into 1a (envelope contract: oracle + helper + one surface exemplar) and 1b (wire across the remaining CLI surfaces) so the per-cycle implementation surface stays small enough for one realisera cycle.
