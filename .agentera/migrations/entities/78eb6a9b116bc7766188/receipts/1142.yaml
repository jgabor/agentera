    title: Decouple vitest from live repo artifact state
  what: Remove vitest dependence on this checkout's mutable agent artifacts (TODO.md Resolved ledger, progress.yaml cycle counts, plan slot presence) while preserving compaction and schema hygiene through explicit repo gates (`agentera check compact`, CI, lefthook). Introduce a small fixture project tree and shared helpers so compaction, artifact validation, and oracle tests prove behavior from pinned inputs, not from whatever orkestrera left in the working tree.
  why: Plan closeout on feat/v3 broke vitest (933/934) because compaction tests assert the live repo is within uniform_10_40_50 budgets — duplicate of `check compact` but embedded in unit tests. Contributors on any machine run the same suite; local artifact churn feels like a code regression. Compaction logic is already covered by tmp-based cases in the same file; live-repo describes are hygiene gates wearing unit-test names.
  constraints: feat/v3 only. Do not remove `agentera check compact` from CI or lefthook. Behavior-preserving for compaction, validation, and oracle contracts. No change to uniform_10_40_50 policy. Fold TODO/plan/progress updates into implementation commits. Do not edit vision or objective.
  scope:
    included:
      - Coupling inventory and test-layer policy (unit vs repo gate)
      - Remove compaction real-repo vitest; expand fixture coverage if gaps exist
      - Shared fixture project helper (valid, over-limit, invalid YAML, empty plan)
      - Decouple validateArtifact, validate, validateVerifyOracles artifact paths
      - Stop mutating live TODO.md in evaluatorHandoffContract test
      - Point registry tests at fixture docs.yaml instead of live .agentera/docs.yaml
      - AGENTS.md / CI comment clarity on where hygiene gates live
    excluded:
      - release-metadata live-repo test (static version alignment, not session ledger)
      - lifecycleAdapters real-repo tests (stable source/hook contracts)
      - install_root model yaml reads (checked-in contract fixtures, low churn)
      - Changing compaction caps or pre-commit hook policy
    deferred:
      - Optional `pnpm -C packages/cli test:repo-gates` script for explicit local hygiene
      - Prime/orientation tests that use process.cwd() (packages/cli, not monorepo root)
  design: "Three layers: (1) vitest proves logic with fixtures and temp dirs; (2) `agentera check compact` proves this repo's committed artifacts in CI and lefthook; (3) docs state the split so agents do not \"fix\" vitest when compact fails. Add `packages/cli/test/fixtures/repo-state/` with minimal valid `.agentera/*` and TODO.md variants (ok, todo-resolved-over-limit, progress-over-limit, invalid-yaml). A `useFixtureProject(name)` helper copies into tmp and returns root. Migrate highest-pain couplings first (compaction, validate artifact), then registry/oracle consumers."
  overall_acceptance: GIVEN a contributor clones feat/v3 and runs pnpm -C packages/cli test without local plan closeout or compaction THEN the suite passes. GIVEN they commit artifact growth past uniform_10_40_50 THEN CI fails at check compact, not at a misleading compaction unit test. GIVEN compaction fixture tests WHEN run THEN they cover the behaviors previously asserted only by real-repo describes.
