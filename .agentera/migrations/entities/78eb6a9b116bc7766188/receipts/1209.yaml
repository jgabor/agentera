    Close the opencode skill-path topology mismatch (Decision 78) so prime never reports up_to_date while the host loads a divergent skill copy, and so upgrade maintains ~/.agents/skills/agentera as the canonical agent-compatible symlink root while retiring the opencode-specific symlink.
