    title: Consolidate progress-commit/git-ancestry logic into a shared module (2.7.6)
  what: Eliminate the near-duplicate progress-commit + git-ancestry implementations in hooks/validate_artifact.py (~688–769) and scripts/agentera (~6177–6232) by extracting one shared scripts/progress_commit.py module (commit-hash regex, git subprocess wrapper, commit-token parser, HEAD-ancestor classifier, cycle-commit rewrite, and pure backfill computation). Make both the validate_artifact guard and the `agentera check backfill` CLI thin consumers of that module, align the validator's YAML loading on load_yaml_mapping, route the hook→scripts import through the single sanctioned hooks/common bridge, consolidate and expand the shared module's regression tests, and document the intentional unknown-hash/shallow-clone skip behavior. Resolves all eight open 2.7.6 progress-commit TODO items.
  why: "The validator guard and the backfill CLI were designed as a pair and carry drift risk: regex, token parsing, git wrappers, and ancestry checks are near-copies in two oversized files (scripts/agentera ~8.7k lines, validate_artifact.py ~1,182 lines). A single shared implementation removes the drift risk, shrinks both monoliths, and unifies the YAML-loading failure mode. These are the remaining degraded/annoying follow-ups from the completed hooks session-compaction and progress-commit-guard work."
  constraints: "Full pytest suite must stay green. Preserve every observable backfill/guard behavior: statuses (clean/action-needed/fixed/error/noop), exit codes (0/1/2), messages, and accepted/rejected commit classifications. The shared module must import under the hook layer's stdlib + pyyaml only rule — no new third-party dependency, so the regex-based cycle-commit rewrite stays (no ruamel). Do not modify vision.yaml or objective state; no remote push; never amend to backfill a progress commit field. Version bump follows DOCS semver policy: the YAML-loader alignment is a `fix` (patch bump to 2.7.6); extraction, tests, and docs are chore/test/docs (no additional bump)."
  scope:
    included:
      - scripts/progress_commit.py (new shared module; stdlib + pyyaml only)
      - scripts/agentera (cmd_backfill and _backfill_*/_rewrite_cycle_commits become thin wrappers importing the module)
      - hooks/validate_artifact.py (_validate_progress_commits/_progress_commit_token/_git_result/_COMMIT_HASH_RE delegate to the module; load via load_yaml_mapping)
      - hooks/common.py (single sanctioned scripts→hooks bridge + re-export point and doc comment)
      - tests/test_progress_commit_guard.py (retarget to the shared module; expand rewrite + token coverage)
      - skills/agentera/schemas/artifacts/progress.yaml and/or UPGRADE.md (unknown-hash/shallow-clone docs)
      - TODO.md, CHANGELOG.md, .agentera/progress.yaml (closeout/sync)
    excluded:
      - v1 legacy removal and Decision 58 single-name protocol sweep (3.0.0)
      - Bun/npm packaging and TypeScript CLI rewrite initiatives (3.0.0)
      - A sweeping multi-hook sys.path refactor or a new neutral shared package
      - Replacing the regex cycle-commit rewrite with a YAML round-trip library
      - Any change to compaction/retention-cap logic (just-completed plan)
    deferred:
      - A fully neutral shared-package home for cross-layer modules (revisit under 3.0 packaging)
  design: "Create scripts/progress_commit.py following the agentera_upgrade.py sibling-import precedent (scripts/agentera imports it via `from progress_commit import ...`). The module exposes pure, stdlib+pyyaml primitives: COMMIT_HASH_RE, a git subprocess wrapper, commit_token(value), ancestor_state(token, cwd) returning ancestor/stale/unknown/unavailable, rewrite_cycle_commits(text, changes), validate_progress_commits(content, cwd) for the guard, and a pure compute_backfill(...) returning operations/changes used by the CLI runner. scripts/agentera keeps only argparse wiring, payload emission, and file I/O in cmd_backfill. hooks/validate_artifact.py imports the guard symbols through hooks/common (which already inserts scripts/ on sys.path), so no new per-file sys.path insert is added — common becomes the single documented bridge (item 5), with a neutral package deferred to 3.0. The guard switches from raw yaml.safe_load to load_yaml_mapping and catches load errors to return no commit violation, leaving structural reporting to _validate_yaml (item 4). The regex rewrite is retained and hardened with expanded folded/flow-scalar and comment-preservation tests; token tests collapse to one parametrized table on the shared module."
  overall_acceptance: GIVEN the progress-commit and git-ancestry logic WHEN the plan completes THEN exactly one shared scripts/progress_commit.py implementation exists, consumed by both the `agentera check backfill` CLI and the validate_artifact.py guard with no near-duplicate logic. GIVEN the validator WHEN it loads progress YAML THEN it uses load_yaml_mapping with a pinned consistent failure mode. GIVEN cross-layer imports THEN they flow through the single documented hooks/common bridge. GIVEN the shared module THEN commit_token and rewrite_cycle_commits behavior is covered by one consolidated, expanded suite and the unknown-hash/shallow-clone skip is documented. GIVEN closeout THEN all eight TODO items are resolved, the full suite and capability-contract validation pass, CHANGELOG records the fix, and the version is bumped to 2.7.6.
