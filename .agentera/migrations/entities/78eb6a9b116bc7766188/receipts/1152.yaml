  what: Repair the blocked local-migration authority so one canonical contract drives every runtime, schema, help, and result surface; then complete local migration, optional Git enrichment, contract and documentation alignment, health evaluation, development-release preparation, and final state synchronization.
  why: Consumer migration is complete, but two independent evaluations found that local-migration behavior still duplicates authority semantics and lacks deterministic omission evidence. Dependent migration and release work must not proceed until runtime behavior is mechanically derived from the confirmed contract and its verification record is accurate.
  constraints: Preserve the exact blocked predecessor bytes and its writer-owned attempt count, failure count, latest verdict, latest failure evidence, and provenance through forced lineage. Keep `agentera state migrate`, bounded project-local custom-name discovery, archive immutability, archive-before-projection ordering, non-Git completion, no remote access, Decision 53 no-inference semantics, and `uniform_10_40_50`. Do not refresh profile, edit vision, publish, tag, push, promote stable, or advance suite metadata beyond `3.0.0`.
  overall_acceptance: GIVEN legacy project state and optional local Git history WHEN users inspect, preview, apply, retry, enrich, and verify migration THEN one authority governs every observable contract, unsafe records never synthesize archives, local completion never depends on Git, provenance remains truthful, and every governed development-release gate passes.
