      - "T2: Port artifact-validation CLI surface to TS — the 7 validate subcommands (capability, capability-contract, cross-capability, lifecycle-adapters, app-home-contract, vocabularyAuthority, selfAudit); behavior must match the Python oracle byte-for-byte (or intentionally version-break with an envelope-version bump); update or add `packages/cli/src/cli/commands/validate.ts` to host the 7 surfaces; add a `validateParity.test.ts` per surface; cross-capability validate is already partially ported; verify all 7 are parity-green"
