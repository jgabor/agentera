artifact: decisions
record:
  date: 2026-07-06
  question: How should the vision capability instructions be audited and rewritten to align with D80's six-section spine, retire v2-era residue, and adopt the D79 direct-contract philosophy while preserving vision's Socratic-conversation character?
  context: "D80 (firm) sets the six-section spine; D79 (firm) set status as the reference implementation with direct-contract delegation, D71 modal vocab, D72 bundle-to-app terminology, and v2-era residue retired. TODO.md line 16 lists the vision capability audit as a v3.0.0 docs task. A pre-flight survey of vision's existing 17,076-char instructions found 25 drift findings: v2-era command references (agentera describe, agentera lint, agentera decisions, agentera query), v2-era env var resolver flow ($AGENTERA_PROFILE_DIR / $XDG_DATA_HOME), v2-era canonical filenames (CLAUDE.md, PROGRESS.md as direct reads when prime already serves them via vision_startup_context), hand-enumerated protocol token ID block duplicates protocol.yaml, host-bootstrap Artifact path resolution subsection duplicates SKILL.md lines 143-156, ghost contract Section 24 reference (contract.md ends at Section 23 in v3), triple-stated exit-marker obligations, duplicated Step 4 pre-write self-audit block between Create and Refine modes, six-arc Socratic conversation (effective) wrapped in narration-voice riffs (drift), Getting started section placed outside D80 §6 Cross-capability integration, validation V6 principle_brevity rule declared but linter does not enforce and live vision.yaml intentionally violates. Ground-up workflow review surfaced six substantive decision points: Step 0 handshake with prime --context vision, CLI-driven mode detection via source.exists, Replace mode reads archived vision as corrective context, profile-stale handling, principle brevity rule fate, and whether to add a 7th Socratic arc for anti-vision. Personality/SOUL.md TODO entry (line 48) flagged a conflict: Step 3's hardcoded 'sharp colleague' personality duplicating the vision artifact's identity.voice field."
  alternatives:
    - name: D79-pure direct-contract adoption with personality-neutral Step 3, mode-split shape preserved
      status: chosen
      tradeoffs: "Adopts the D79 direct-contract clause as the opening paragraph (vision MUST source state from agentera prime --context vision; trust source_contract.capability_startup_complete; cli_fallback only as last resort). Step 1 sources bundled state from vision_startup_context (progress, health, todo, profile path) and runs cli_fallback only for fallback_only families (decisions, vision self, design). Filesystem reads preserved for items prime does not surface: directory structure, dependency manifests, README.md, AGENTS.md, source files, DESIGN.md at project root, git log. Step 3 adopts vision artifact identity.voice when available; before a vision exists (Create greenfield), runs with neutral operational stance (Socratic, push past safe answers) and lets personality emerge from arc 5 (identity) captured into the new artifact — this prevents the capability from pre-empting the user's articulation and preserves the per-project identity principle. Step 0 handshake made explicit; mode detection CLI-driven via agentera state query vision source.exists; Replace mode reads archived vision-{date}.yaml as corrective context; Pre-write self-audit hoisted (DRY) and referenced from both Create and Refine Step 4; Visual identity stub folded into Purpose (no §1 sub-sections per D80); Getting started folded into §6 as Invocation guidance per D80 §6. v2 residue retired: 5 command forms corrected, env-var resolver flow removed, contract Section 24 ghost cut, triple-stated exit-marker decoration collapsed to Exit-signals section only, narration-voice riffs cut to one Step 3 operational-stance line, host-bootstrap Artifact path resolution subsection delegated to SKILL.md, Contract-values token enumeration block removed (protocol.yaml is the authority). Principle brevity rule cut from prose Output constraint and validation V6 with ID gap preserved (linter never enforced; abstraction and filler checks cover principle quality holistically). Validation V7 (exit_marker_required) unchanged. Anti-vision question folded into Step 3 arc 4 (The Direction) as a sub-prompt rather than expanded into a 7th arc. Profile-stale handling added: carry caveat forward; never invoke profile to refresh during a vision cycle (added as MUST NOT safety rail). Result: 17,076 → 16,667 chars (-2.4% after subagent-driven prose-tightening pass; below original). Modal vocab 3 MUST + 9 MUST NOT + 4 SHOULD, higher than status because vision writes artifacts and has more protocol-force rules). Prose-tightening pass (subagent-driven) trimmed redundant restatements, speculative commentary, and duplicate mode-header boilerplate while preserving all substantive audit decisions: 17,678 → 16,667 (-5.7% from initial rewrite; below original 17,076 — vision's Socratic 6-arc narrative and vision.yaml shape block justify a longer floor than status's 10,389; modal vocab 3 MUST + 9 MUST NOT + 4 SHOULD, higher than status because vision writes artifacts and has more protocol-force rules). New D80-rule: capability instructions MUST NOT hardcode personality when an owning artifact (vision.yaml identity) defines it; reference the artifact, do not re-assert its content."
    - name: Aggressive cut to match status length (~10,000 chars)
      status: rejected
      tradeoffs: Match status's 10,389-char floor by cutting the Socratic 6-arc conversation or the cross-capability integration surface.
      reason_rejected: "Vision's effectiveness depends on the Socratic conversation: the 6 arcs map 1:1 to the vision.yaml sections (north_star, personas, principles, direction, identity, tension). Cutting arcs would break the artifact-shape contract. Cross-capability integration has 7 named relationships (feeds build, profile, research, audit, design, document, plan) plus 4 invocation-guidance bullets per D80 §6 — all load-bearing. A 10K target would shred vision's substance; 17,678 is the honest floor for this capability."
    - name: Keep ≤20-words-per-principle rule, rewrite live artifact to comply
      status: rejected
      tradeoffs: Preserves the stated rule and enforces via linter; rewrites .agentera/vision.yaml principles to ≤20 words each.
      reason_rejected: Live vision artifact's principles deliberately carry 30–60-word rationales (e.g., 'One agent, not a team' explains the multiplicity-under-the-hood model, 'The CLI is the runtime' grounds package boundaries). Truncating to ≤20 words would strip the rationale that makes principles actionable for autonomous development. The MUST-state-tradeoff / SHOULD-name-prevention / MUST-NOT-name-implementations rules already cover principle shape; the holistic verbosity/abstraction/filler linter checks enforce brevity without an artificial word ceiling. Rule was YAGNI from inception (declared but unenforced since v2); cut rather than retrofit.
  choice: "D79-pure direct-contract adoption with personality-neutral Step 3, mode-split shape preserved. New D80-rule: capability instructions MUST NOT hardcode personality when an owning artifact defines it; the instructions reference the artifact (vision.yaml identity.voice) without re-asserting its content. Applies to all 10 remaining audits."
  reasoning: "The direct-contract delegation mirrors status (D79) and stops vision from re-encoding state rules that source_contract.capability_startup already mechanizes. The personality-neutral Step 3 follows the per-project identity principle (vision.yaml line 3): if vision hardcodes 'sharp colleague' before the user articulates their identity, the capability pre-empts Step 3 arc 5 (identity) — the very question designed to surface the user's voice. The 7th Socratic arc (anti-vision) was rejected because The Tension arc already surfaces scope boundaries; folding anti-vision into The Direction as a sub-prompt captures the intent without expanding surface. The principle brevity cut aligns prose↔validation↔linter↔artifact, removing drift rather than papering over it. CLI-driven mode detection via source.exists removes one user prompt; Replace reads archived vision because the corrective context is valuable and otherwise lost. Profile-stale handling prevents state mutation outside vision's contract."
  confidence: firm
  feeds_into: packages/cli/src/capabilities/vision/instructions.ts, skills/agentera/capabilities/vision/schemas/validation.yaml, references/cli/capability-instruction-structure.md, TODO.md, .agentera/decisions.yaml
  outcome: "Decision captured. Vision instructions rewritten: 17,076 → 16,667 chars (-2.4% from original — subagent-driven prose-tightening pass landed vision below its starting length despite structural additions); D71 modal vocab compliant (3 MUST / 9 MUST NOT / 4 SHOULD); D72 app terminology; D79 direct-contract delegation in opening paragraph; D80 six-section spine (Purpose glyph-inline, State artifacts with vision.yaml shape subsection, Workflow phases mode-split with shared pre-write self-audit hoist, Safety rails with profile-refresh MUST NOT added, Exit signals, Cross-capability integration with Invocation guidance folded). Validation V6 (principle_brevity) removed with ID gap preserved; V7 unchanged. references/cli/capability-instruction-structure.md deviation table vision row updated to Complete (D81) with notes on vision.yaml shape subsection and shared pre-write self-audit hoist. TODO.md line 16 vision audit marked resolved. New D80-rule (capability instructions MUST NOT hardcode personality when an owning artifact defines it) propagates to all 10 remaining audits. The 10 remaining capability audits (discuss, research, plan, build, optimize, audit, document, profile, design, orchestrate) now run against D80, D81, and the reference doc."
