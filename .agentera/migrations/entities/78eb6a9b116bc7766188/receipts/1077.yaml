    title: YAML safe_load None-return consolidation
  what: Standardize YAML parsing across hooks and production scripts so mapping-shaped artifacts never propagate None from empty or whitespace-only parses. Introduce a shared load contract, align validate_artifact and agentera state paths, and add regression coverage for silent parsing failures.
  why: compaction.py already guards with `or {}`; validate_artifact.py and scripts/agentera do not consistently. Empty YAML can yield None and cause silent misreads, skipped validation, or downstream errors instead of predictable empty-mapping behavior or explicit violations.
  constraints: Full pytest suite must stay green. Preserve validator exit codes (0 pass, 2 violation). Chore-only work (no version bump). Do not modify vision.yaml or objective state.
  scope:
    included:
      - hooks/common.py (shared helper)
      - hooks/validate_artifact.py
      - hooks/session_start.py
      - hooks/session_stop.py
      - hooks/compaction.py
      - scripts/agentera
      - scripts/artifact_registry.py
      - scripts/validate_capability.py
      - scripts/package_registry.py
      - scripts/runtime_adapter_registry.py
      - scripts/startup_analysis_contract.py
      - TODO.md, CHANGELOG.md, progress.yaml (final sync only)
    excluded:
      - Vision and objective state (protected)
      - Mechanical rewrite of every test-file safe_load call
      - compact_entries and resolve_session_path consolidation TODOs
      - v1 removal and TypeScript rewrite initiatives
    deferred:
      - Repo-wide test-only safe_load normalization unless needed for contract docs
  design: "Add one canonical mapping loader in hooks/common.py imported by hooks and scripts. Policy: mapping artifacts default to {} when parse is None where empty content is valid; validator paths that require a mapping keep explicit root-must-be-mapping violations for empty input. Task 1 defines the helper; tasks 2 and 3 harden hooks and scripts in parallel; task 4 adds regression tests; task 5 syncs TODO, changelog, and progress."
  overall_acceptance: GIVEN empty or whitespace-only YAML artifact WHEN validator runs THEN exit 2 with mapping-root violation not silent pass. GIVEN empty YAML artifact WHEN agentera state loads it THEN structured output treats content as empty mapping without crash. GIVEN full pytest suite WHEN run THEN no regressions versus current baseline.
