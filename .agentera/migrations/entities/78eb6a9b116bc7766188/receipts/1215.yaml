    revised: Split oversized family cutovers; ordered apply after target semantics; moved bundle parity before packaging; clarified active-contract vocabulary; added checkout approval, guarded rollback, whole-state validation, real Git merge fixtures, and a no-Git-side-effects rule.
    title: "Plan: Explicitly migrate Agentera state to merge-safe entities"
  what: Replace numbered aggregate state with writer-owned entity files, then explicitly migrate this repository to the new state graph without implicit or incremental conversion.
  why: Decision 94 established that worktree-local locks, max-plus-one numbering, and aggregate projections create avoidable branch conflicts and drift. The migration must make unrelated writes merge normally while retaining explicit conflicts for genuine same-entity overlap.
  constraints: Decision 94 is firm. IDs are project-wide ten-letter lowercase Nano IDs. Public persisted and structured state uses only id and artifact; stable_id, artifact_id, entry_number, numeric aliases, type prefixes, and writable aggregate projections are removed from active public contracts. Migration is explicit, dry-runnable, resumable, parity-checked, and recovery-backed; ordinary reads and writes never migrate. Missing detail is never fabricated or silently dropped, historical prose is not rewritten, singleton editorial artifacts remain whole, and vision is untouched. Each testable unit receives at least one passing and one failing case; durability phases also test interruption and replay. Suite metadata stays at 3.0.0; only the permitted development package increment may change. No release, publication, remote push, or migration-created Git commit occurs.
  overall_acceptance: GIVEN legacy state and parallel branches WHEN the explicit migration and post-cutover writers are exercised THEN every recoverable entity and structured relationship is preserved under id plus artifact, unrelated writes merge through ordinary Git, same-entity overlap remains explicit, interrupted apply resumes without duplicate or divergent state, degraded inputs are never fabricated, retired public identity vocabulary is absent from active state contracts, and this repository passes migration parity, merge-safety, performance, and release-relevant verification.
  scope:
    included:
      - Canonical contracts, schemas, entity identity, storage, validation, retrieval, cursors, and writer behavior.
      - Progress, decisions with satisfaction and revisions, health, plans and tasks, objectives and experiments, TODO items, and documentation inventory entries.
      - Explicit whole-project inventory, mapping, snapshot, apply, resume, rollback, cutover, parity, merge simulation, performance evidence, CLI/help/skill/docs/bundle synchronization, and migration of this repository.
    excluded:
      - Vision, design, changelog, profile, runtime-local session state, and other genuinely singleton editorial artifacts.
      - Automatic migration during reads or writes, permanent compatibility aliases, semantic merge drivers, writer shards, event sourcing, free-text historical-label rewriting, release publication, and remote operations.
    deferred:
      - Optimization beyond measured startup and retrieval budgets after the new storage model is proven.
  design: Establish the final state and migration contract first. Introduce one shared entity identity, storage, relationship, and validation model. Prove a read-only graph inventory and parity model before mutation. Move each state family to the shared model before enabling whole-project apply. Add a durable mapping, recovery snapshot, phased publication, cutover marker, resume, and guarded rollback. Cut public readers and generated views to entity authority, apply the migration once to an explicitly approved integration checkout, retire old authority, and finish with contract, merge, performance, package, and project-state verification.
