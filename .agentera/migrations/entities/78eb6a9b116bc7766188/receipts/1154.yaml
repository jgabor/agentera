    revised: Adversarial review tightened the decision-context contract by making downstream consequences non-inferential, defining top-level and per-decision JSON completeness fields, adding the 2.3.6 archive transition, replacing vague archive wording with compacted-decision wording, requiring version policy reconciliation before metadata edits, and narrowing schema/prose changes to the decision artifact and Resonera guidance.
    title: 2.3.7 Decision Context Source Contract
  what: Add a decision-context source contract to the `agentera decisions --format json` surface so Resonera and downstream capabilities can deliberate from CLI state instead of reading `.agentera/decisions.yaml` or falling back to git history. The contract makes full-detail decision context explicit, reports compacted historical decision limitations honestly, and exposes structured fields for decision outcome, reasoning, alternatives, confidence, feeds-into, and downstream consequence references where the data exists.
  why: "Decision 51 showed that capability startup and state gathering still over-read raw artifacts after CLI state access. Decisions are especially sensitive: compaction can turn older decisions into summaries, and agents currently compensate by reading raw YAML or considering git history. A source contract makes the CLI the first trusted state seam, including completeness and caveats, so agents know when the CLI output is sufficient and when compacted historical data is inherently incomplete."
  constraints: Preserve Decision 45 structured CLI boundaries and Decision 44 plain vocabulary. Keep `agentera decisions` a routine state command, not a slash-route alias or direct capability invocation. Preserve docs.yaml artifact path resolution and compaction gate behavior. Derive downstream consequence references only from existing structured references such as `feeds_into`, TODO identifiers, plan or progress references, or explicit artifact mentions; otherwise emit null or missing with a caveat. Do not fabricate missing historical reasoning or alternatives from compacted decisions, do not require git-history fallback, and do not require raw `.agentera/decisions.yaml` reads for normal deliberation. Limit schema/prose changes to the decision artifact, decision compaction, CLI decision output, and Resonera guidance. Do not implement the separate Orkestrera, Dokumentera, Inspektera, Optimera, or Realisera source-contract TODOs. Do not tag, push, publish, refresh installed apps, edit vision, or edit objective state without explicit approval.
  scope:
    included:
      - Source-contract metadata for `agentera decisions --format json` and existing filtered decisions output.
      - "Structured decision context fields for full-detail decisions: outcome or choice, reasoning, alternatives, confidence, feeds-into, and non-inferential downstream consequence references."
      - Honest compacted-decision completeness reporting so older compacted entries do not trigger raw artifact or git-history fallback expectations.
      - Minimal decision schema, compaction, Resonera guidance, and test updates needed for future decision compaction to preserve the context promised by the CLI.
      - Focused startup-state evidence showing Resonera-style deliberation can use CLI decision context without defensive raw artifact reads.
      - TODO, docs, changelog, progress, and 2.3.7 version metadata sync.
    excluded:
      - A full dependency graph of every downstream artifact affected by every decision.
      - Broad source-contract work for Orkestrera, Dokumentera, Inspektera, Optimera, or Realisera.
      - Reconstructing historical compacted decision details from git history.
      - Publication, tag, push, installed app refresh, vision edit, or objective-state edit.
    deferred:
      - Deeper decision outcome lifecycle tracking across TODO, progress, and plan state unless needed to expose the current CLI contract honestly.
      - Cross-artifact impact graph or provenance indexing beyond existing `feeds_into` and explicit artifact references.
  design: Treat decision context as a CLI-owned state envelope. The command emits one top-level `source_contract` for the result set and per-decision completeness fields such as `context_complete`, `missing_fields`, `compacted`, and `caveats`. Full-detail decision entries are projected into stable JSON with explicit included fields and raw-read policy. Compacted decision entries, and any existing decision archive entries if discovered, remain available as bounded summaries with `context_complete=false` and explicit missing fields rather than pretending raw reads or git history can restore data. If the existing decision archive or compaction contract cannot preserve required future context, update it minimally and test both current historical limitations and future compaction behavior.
  overall_acceptance:
    - GIVEN `agentera decisions --format json` is used during deliberation WHEN full-detail decisions are available THEN agents receive outcome, reasoning, alternatives, confidence, feeds-into, downstream consequence references, and a source contract without raw artifact reads.
    - GIVEN compacted historical decision entries are encountered WHEN their full context is no longer retained THEN the CLI reports honest completeness caveats and does not imply raw YAML or git history must be read.
    - GIVEN 2.3.7 closes WHEN validation and state sync finish THEN deferred 2.3.8+ source-contract TODOs remain visible and no prohibited release or protected-state action occurred.
