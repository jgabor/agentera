    title: D47 App-Home Vocabulary Cleanup
  what: Audit repository surfaces for obsolete `bundle` terminology and legacy artifact-label wording after the D47 app-home migration, then update only places where old wording describes current live behavior. The cleanup target includes `scripts/`, `hooks/`, `skills/agentera/`, tests, README/UPGRADE/docs, registry/package/runtime surfaces, and Agentera-facing guidance.
  why: D47 changed Agentera's install model to a durable app home with managed app files under `AGENTERA_HOME/app`. Stale bundle-root vocabulary in current CLI, runtime, docs, tests, and guidance surfaces makes installation state harder for agents and users to reason about and increases future migration risk.
  constraints: "Preserve D47 semantics: `AGENTERA_HOME` is the durable app home, managed app files live under `AGENTERA_HOME/app`, user data remains under the app home, `agentera doctor` stays read-only, and `agentera upgrade` owns idempotent migration writes. Do not rewrite historical decision records or changelog text solely to remove old wording. Do not rename canonical artifact IDs, filenames, schema names, CLI selectors, JSON fields, persisted metadata keys, or stable API fields unless a compatibility review explicitly permits it. Preserve D43, D45, and D46 route/CLI/handoff boundaries. Do not publish, push, tag, refresh installed apps/profile, edit vision state, or edit objective state."
  scope:
    included:
      - Search current repository text for `bundle`, `bundled`, `bundle-root`, `bundle_root`, `bundle root`, `install root`, and legacy labels such as `DECISIONS.md`, `DOCS.md`, `PLAN.md`, and `PROGRESS.md` where used as canonical current labels.
      - Classify each relevant occurrence as `replace`, `preserve`, or `defer` with path, term, rationale, and action.
      - Replace current-behavior wording with app-home vocabulary such as `app home`, `managed app`, `app refresh`, and `user data root`.
      - Update focused tests, fixtures, docs, or contract checks only where stale wording can regress current D47 behavior.
      - Sync local closeout metadata after verification without claiming D47 user-confirmed satisfaction.
    excluded:
      - D48 CLI namespace work such as `agentera validate`, `agentera smoke`, or `agentera usage`.
      - Redesigning or renaming canonical artifact names, filenames, schema IDs, or CLI selectors.
      - User-confirming D47 satisfaction without explicit user confirmation.
      - Publication, tagging, pushing, installed-app refresh, or profile refresh.
    deferred:
      - Deeper collector validation or metadata alignment work unless a changed D47 surface or focused test directly requires it.
      - Broad cleanup of unrelated historical wording in archived decisions, changelog entries, or legacy migration examples.
  design: Treat this as a bounded vocabulary and contract cleanup, not a repository-wide rewrite. Start with a concrete inventory table so every replacement and every preserved old term has an auditable reason. Default to changing labels, descriptions, help text, docs, tests, and fixtures that describe current live behavior. Default to preserving compatibility-facing keys and historical text. Verification should combine focused app-home behavior tests with a targeted terminology audit proving that remaining old terms are intentional.
  overall_acceptance:
    - GIVEN a user or agent reads current CLI, docs, runtime, or guidance surfaces WHEN they describe Agentera installation state THEN they see app-home vocabulary rather than obsolete bundle-root wording except in explicit legacy or historical contexts.
    - GIVEN D47 migration behavior is exercised or documented WHEN reviewed THEN managed app files, user data roots, `agentera doctor`, and `agentera upgrade` responsibilities remain truthful.
    - GIVEN preserved old terminology remains WHEN the cleanup is complete THEN each relevant occurrence has a documented compatibility, legacy, historical, or deferred-work rationale.
    - GIVEN verification runs WHEN the plan closes THEN focused tests, affected validators, targeted terminology audit, and `git diff --check` pass.
  surprises:
    - "[post-audit-flagged] `agentera lint --artifact PLAN.md --file .agentera/plan.yaml --format json` passed abstraction/filler checks but flagged the required full-plan artifact for exceeding the 100-word advisory budget."
