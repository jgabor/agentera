    title: "Plan: D70 Swedish Verb Remnant Cleanup"
  what: |
    Complete the Decision 70 capability rename by eliminating all Swedish -era verb remnants from source, config, data, and runtime state files. Commit bbe98135 renamed directories, files, and barrel imports to English IDs but left ~400+ identifier bodies, env vars, plugin templates, agent defs, and active runtime state in Swedish. Four parallel audit agents mapped the full remnant surface across src, bundle/data, docs/config, and tests.
  why: |
    Decision 70 (firm, user-confirmed satisfied 2026-06-09) chose English capability IDs as canonical. Decision 58 requires zero post-3.0 surfaces may retain legacy aliases. Commit bbe98135 claimed completion with "1007 tests pass, typecheck clean" but the rename was structural-only. The TODO entry marking D70 implementation as Resolved (line 38) is premature.
  constraints: |
    D70 firm: English IDs canonical. D58 firm: zero post-3.0 legacy aliases. Schema version strings (agentera.inspekteraEvaluationReport.v1, agentera.coexistenceProbe.v1, agentera.capabilityContext.v1, agentera.planeraStartup.v1) remain as compat identifiers. CHANGELOG.md, UPGRADE.md, .agentera/archive/ are historical — do not rewrite. Backward-compat route alias maps exempt. PROFILERA_PROFILE_DIR retains a deprecated alias fallback until v3 stable (Task 16 TODO).
