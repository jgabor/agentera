id: kbtimwkhdc
artifact: decisions
record:
  date: 2026-06-30
  question: How should Agentera route requests to capabilities, and what role should the deterministic `prime --route` trigger engine play?
  context: "Decision 75 (firm, review_needed) built a pure request-derived Layer 3-4 engine: substring/regex weighted-average scoring (W_REGEX=1.0, W_SUBSTRING=0.6), per-entry confidence_threshold (default 50), borderline-band disambiguation (default 15), and mutual exclusivity between request-derived `prime --route` and state-derived `next_action`. A TODO item flagged that common natural-language inputs (\"help me decide\") score below threshold (medium-priority substring-only = 42 < 50) and proposed regex patterns or threshold tuning. Resonera deliberation re-derived the routing model from the ground up and confronted a class ceiling Decision 75's alternatives did not: a closed set of hand-authored patterns can never cover open-ended natural language, and the LLM host that receives the user's message already routes NL better than any weighted-substring engine ever will. The audit confirmed no non-LLM consumer needs request-derived routing today (mobile is Cursor-SDK/LLM-driven, web is static, CLI state commands are deterministic)."
  alternatives:
    - name: Tune the existing engine (regex patterns, lower thresholds)
      status: rejected
      description: "Apply the TODO fix: add patterns_regex entries for common NL phrasings (e.g. \\bhelp\\s+me\\s+(decide|think|figure)\\b for discuss T2) so regex weighting clears the threshold, or lower confidence_threshold for medium-priority substring-only triggers. Apply across all twelve capabilities."
      reason_rejected: Permanent whack-a-mole. Closed-world pattern matching has a class ceiling on open-ended NL — every phrasing the author did not anticipate fails. The LLM host already understands "help me decide" natively; tuning a weaker router to approximate what the host already does is maintenance for a non-load-bearing surface.
    - name: Keep `prime --route` as a low-stakes request-intent hint input
      status: rejected
      description: "Reposition (not retire) the engine: `--route` becomes one of several advisory signals the LLM consults alongside a state-readiness hint. Preserves a programmatic non-LLM routing surface for future consumers."
      reason_rejected: No non-LLM consumer exists today (mobile, web, and CLI state are all LLM-driven or already deterministic). Maintaining a scoring engine whose NL failures are expected, to feed a hint the LLM does not need, buys advisory value near zero. YAGNI for a consumer that does not exist; defer reintroducing a programmatic router until a real non-LLM consumer appears.
    - name: Retire `--route`; evolve next_action into a ranked state-readiness hint; LLM owns routing
      status: chosen
      description: "The LLM host owns the final route natively. The load-bearing deterministic surface becomes an evolved `next_action`: a ranked state-readiness hint hung on the protocol phases (envision/deliberate/plan/build/audit), where position 1 is always a clear recommendation and the rest are visible alternatives — plugging into hej's existing recommended+alternatives dashboard pattern. `prime --route` is retired as a router. The trigger schema (description, disambiguates_against, priority, phase context) is repositioned as LLM-readable intent documentation the host consults, not a match substrate. Decision 75's request-vs-state mutual exclusivity (choice 4) is dissolved — both feed the LLM as advisory context."
      reason_chosen: "Separates the two concerns correctly: the LLM is the only component that can route open-ended NL, and the deterministic value lives in state-readiness (evolved next_action), not request-pattern matching. Evolving next_action leverages the existing cascade (orientation.ts selectStatusNextAction: plan-pending, degrading health, active objective, TODO, stale health, decision follow-up, vision refresh) and protocol.yaml phase model rather than greenfield — delivering \"much simpler than aila\" because both halves already exist unstitched. Retire is clean because no non-LLM consumer needs request-derived routing today. The TODO's \"trigger tuning\" symptom evaporates: \"help me decide\" routes to discuss because the LLM reads the discuss intent description, not because a regex cleared 50."
  choice: LLM-primary routing. Retire `prime --route` as a router and reposition the trigger schema as LLM-readable intent documentation (descriptions, disambiguation guidance, phase/precedence context). Evolve `next_action` into a ranked state-readiness hint hung on protocol phases, where position 1 is always a clear recommendation and the rest are visible alternatives, plugging into hej's recommended+alternatives pattern. Dissolve Decision 75's request-vs-state mutual exclusivity; both become advisory context the LLM consults. Supersedes Decision 75 design choices 2 (request-derived scoring as router), 4 (mutual exclusivity), and 5 (pure request-derived).
  reasoning: "Re-derived from the ground up: the trigger engine has a class ceiling on natural language that no threshold tuning or regex patch can lift (closed patterns cannot cover open-ended phrasing), yet the LLM host already routes NL natively. Therefore the load-bearing deterministic surface is state-readiness — the evolved next_action — not request-pattern matching, and the load-bearing authoring investment is decision-tree clarity the LLM reads (descriptions and disambiguation, not patterns). Evolving next_action rides the existing cascade and the protocol.yaml phase model plus hej's recommended+alternatives render, so the work is stitching and re-exposure, not greenfield; that is what makes it simpler than aila's FSM-plus-policy split. Retire is defensible because the audit found no non-LLM consumer (mobile, web, and CLI are all LLM-driven or deterministic) and reintroducing a programmatic router is deferred until a real non-LLM consumer appears. The reversal of a firm decision made yesterday is justified because D75 carried review_needed and its alternatives never confronted the class ceiling that the LLM host already routes NL better than any weighted-substring engine ever will."
  confidence: firm
  feeds_into: references/cli/routing-model.md, references/cli/trigger-schema-enrichment.md, skills/agentera/capability_schema_contract.yaml, packages/cli/src/cli/orientation.ts, packages/cli/src/routing/routeEngine.ts, .agentera/decisions.yaml, TODO.md
