    critic_issues: 4 found, 4 addressed
    title: v2→v3 migration and dual update channels (backport-safe)
  what: Restore upgrade/migration capability removed with the Python migrate_*.py scripts during the TypeScript rewrite. Introduce an explicit v2→v3 compatibility boundary (Python managed app-home → npm self-contained 3.x), dual update channels (stable for 2.x support, development for 3.x alphas/RCs), and guard rails so stable updates and main-line backports never accidentally cross the major boundary. Port migration orchestration into packages/cli/src/upgrade/ with contract-first parity against main's scripts/agentera_upgrade.py behavior oracle where applicable.
  why: The TS branch currently stubs upgrade as "run npx -y agentera@latest" and drops phased migration entirely. Decision 56 commits to a contract-first 3.0 rewrite, but users on 2.x must keep a supported stable line while 3.x matures. Without explicit channels and major-boundary gates, publishing 3.x to @latest or merging migration code into main would risk silent cross-major upgrades. The removed migrate_artifacts_v1_to_v2 and agentera_upgrade.py are the proven model for preview/apply phases, dry-run safety, and testability.
  constraints: "Contract-first parity (Decision 56): Python on main remains behavior oracle until TS fixtures pass. Default channel is stable; cross-major migration requires explicit opt-in (--target-major 3 or equivalent), never implied by @latest. Extend references/cli/app-lifecycle-vocabulary.yaml rather than inventing parallel status vocabulary. Cherry-pick/backport order: vocabulary + guards + tests first (safe on main), migration orchestration active only when distribution major is 3. No remote push; do not modify vision.yaml or objective state. Preserve idempotent dry-run before --yes apply. Stable channel must continue resolving to 2.x until an explicit release decision retires it."
  scope:
    included:
      - references/cli/app-lifecycle-vocabulary.yaml (channel + major-boundary vocabulary)
      - references/cli/update-channels.yaml (new authority for stable/development resolution)
      - packages/cli/src/upgrade/channels.ts
      - packages/cli/src/upgrade/compatibility.ts
      - packages/cli/src/upgrade/migrateArtifactsV2ToV3.ts
      - packages/cli/src/upgrade/upgradeOrchestrator.ts
      - packages/cli/src/cli/commands/upgrade.ts (orchestrator wiring)
      - packages/cli/src/cli/commands/doctor.ts and prime.ts (channel-aware commands)
      - packages/cli/src/cli/commands/schema.ts (upgrade description)
      - packages/cli/test/upgrade/ (channels, compatibility, migration, backport-safety)
      - UPGRADE.md and README upgrade sections
    excluded:
      - Bun single-binary compilation and full npm publish pipeline (separate 3.0 packaging plan)
      - Decision 58 single-name protocol sweep and v1 legacy removal
      - Rewriting project artifact schemas beyond what v2→v3 actually requires
      - Changing default @latest npm dist-tag on main before explicit release approval
      - Runtime adapter feature parity beyond upgrade/migration wiring
    deferred:
      - Automatic runtime package refresh (--update-packages) for 3.x until channel model is stable
      - Retiring the Python CLI stable line (requires separate release/migration comms plan)
  design: "Two orthogonal axes: (1) update channel selects which published line to track — stable resolves to latest 2.x (uvx/git+main or agentera@latest pinned to 2.x semantics), development resolves to 3.x pre-releases (agentera@next or agentera@3.0.0-dev.*). Channel comes from AGENTERA_UPDATE_CHANNEL, user config, or CLI --channel; default stable. (2) compatibility major gates migration — detect v2 managed app-home (.agentera-bundle.json, scripts/agentera in managed root) vs v3 self-contained (.agentera-npx-bundle.json). upgrade --dry-run emits agentera.upgrade.v2 schema with phases detect, artifacts, runtime, cleanup; cross-major items tagged requires_explicit_major_opt_in. Apply with --yes only after preview; cross-major additionally requires --target-major 3. Port migrate_artifacts logic from main's Python scripts as TS modules with fixture tests; artifact phase may be mostly noop if YAML formats unchanged, but runtime rewire and app-home cleanup are not. Backport safety: modules channels.ts and compatibility.ts + vocabulary land on main with tests proving stable dry-run never proposes v3; orchestrator and migrateArtifactsV2ToV3 stay behind distributionMajor >= 3 compile-time or runtime guards so cherry-picks to main add vocabulary/tests only unless explicitly enabling 3.x paths."
  overall_acceptance: GIVEN the TypeScript CLI WHEN a v2 user runs upgrade on the stable channel THEN they receive 2.x-appropriate update/repair guidance and never an silent v2→v3 migration. GIVEN explicit --target-major 3 and a successful dry-run WHEN the user applies THEN v2 managed app-home installs migrate to the npm self-contained model with preserved user/project state. GIVEN development channel WHEN selected THEN 3.x alphas/RCs are reachable without changing stable defaults. GIVEN maintainer backports WHEN vocabulary/guards land on main THEN tests prove stable dry-run cannot propose v3 migration. GIVEN documentation WHEN read THEN channels, opt-in migration, and backport order are clear to non-maintainers.
