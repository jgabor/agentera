    critic_issues: 3 found, 2 addressed, 1 dismissed
    title: Compaction check/gate robustness and retention-cap dedup
  what: Make compaction status computation resilient to non-mapping or malformed compactable YAML roots so `agentera compact --mode check` and `agentera gate` report a degraded error row with a clear reason instead of raising an uncaught yaml.YAMLError traceback. Then finish the retention-cap deduplication by routing the final 10/40/50 cap in compaction.compact_entries (and the YAML archive truncation) through the shared hooks/common.apply_retention_caps helper, with a contract test pinning the intentional ordering divergence.
  why: These are the two remaining degraded follow-ups from the completed "Hooks session compaction deduplication" plan. load_yaml_mapping raises on list/scalar roots, so a single corrupt compactable artifact makes the check/gate command traceback instead of degrading gracefully. apply_retention_caps is only half-adopted, leaving drift risk between session-bookmark and artifact caps.
  constraints: "Full pytest suite must stay green. Preserve observable 10/40/50 outputs, caps, and decision-protection semantics for healthy artifacts (no changed expectations). Hook layer stays stdlib + pyyaml only. Do not modify vision.yaml or objective state; no remote push. Version bump follows DOCS semver policy: the check/gate traceback fix is a `fix` (patch); the retention-cap dedup and contract test are refactor/test (no bump)."
  scope:
    included:
      - hooks/compaction.py (_yaml_counts, _yaml_lists, compute_compaction_status, compact_entries, compact_yaml_file archive cap)
      - hooks/common.py (reuse apply_retention_caps / MAX_* constants)
      - scripts/agentera (only if surfacing the error row needs payload/exit adjustment)
      - tests/test_compaction_status.py and a compaction retention contract test
      - TODO.md, CHANGELOG.md, progress.yaml (final sync only)
    excluded:
      - Progress-commit consolidation, module extraction, and validator relocation TODO items
      - v1 legacy removal and Decision 58 single-name protocol sweep
      - Bun/npm packaging and TypeScript CLI rewrite initiatives
      - Any compaction algorithm or ordering change for healthy artifacts
    deferred:
      - Reduce hooks->scripts sys.path coupling for yaml_mapping import (adjacent annoying item)
  design: "Item 1: the raise originates in load_yaml_mapping, so guarding only _yaml_counts/_yaml_lists by returning 0,0 would mask corruption as a false \"ok\" row. Instead, have compute_compaction_status attempt the load and, on yaml.YAMLError, emit an error-classified CompactionStatus for that artifact (counts None) while still classifying the rest; cover the YAML artifact loop and the objective-scoped experiments.yaml glob. Map that status to action=\"error\" in _operation_for_status so both check and gate reuse the existing error exit code (2) and guidance. Item 2: build the converted full/oneline lists in compact_entries as today (numeric-ID ordering plus ascending/descending handling), then delegate the final cap to apply_retention_caps; route compact_yaml_file's non-decision archive cap the same way, leaving decision protected-overflow selection untouched. Pin the intentional ordering divergence (numeric-ID vs timestamp) in a contract test."
  overall_acceptance: GIVEN a corrupt compactable YAML root WHEN check/gate run THEN they report a degraded error row and non-zero exit with no traceback. GIVEN healthy artifacts WHEN check/gate/compaction run THEN all existing outputs, caps, and decision-protection behavior are unchanged. GIVEN retention caps WHEN applied across artifact and session-bookmark compaction THEN they flow through the shared apply_retention_caps helper with a contract test pinning the intentional ordering divergence. GIVEN closeout WHEN the full suite and capability-contract validation run THEN both pass and both degraded TODO items are resolved.
