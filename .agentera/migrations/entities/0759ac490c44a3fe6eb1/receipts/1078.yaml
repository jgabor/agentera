record:
  header:
    level: light
    created: 2026-05-17
    status: complete
    title: Codex Hook Packaging and Trust Flow
  what: Implement the related 2.5.x Codex hook tasks by adding optional plugin-bundled hook metadata, generating copied user-hook configs that do not rely on hook-time AGENTERA_HOME expansion, documenting the plugin hook enablement and trust flow, and adding regression coverage for both plugin and copied-hook install surfaces.
  why: "Codex 0.130+ can discover plugin-bundled hooks, but Agentera still needs the copied `~/.codex/hooks.json` path as the reliable default. Both paths need explicit trust semantics: plugin hooks should be safe relative to PLUGIN_ROOT, while copied user hooks should trust the exact resolved validator command that will run even if Codex hook subprocesses do not inherit shell_environment_policy."
  constraints: Preserve copied user-hook installation as the default reliable path. Do not assume Codex hook subprocesses inherit `[shell_environment_policy].set`. Do not refresh installed apps/profiles, publish, push, tag, change package-manager state, edit `.agentera/vision.yaml`, mutate objective state, or change decision satisfaction state. Keep direct helper compatibility.
  overall_acceptance:
    - Codex package metadata exposes optional plugin hook discovery with a PLUGIN_ROOT-safe hook config.
    - Copied Codex user hooks generated by upgrade use a resolved validator path and matching trust hashes instead of hook-time AGENTERA_HOME expansion.
    - Documentation and tests clearly preserve copied hooks as the reliable default and describe plugin hook enablement through `[features].plugin_hooks = true` plus `/hooks` review.
