id: aqhiktjijv
artifact: decisions
record:
  date: 2026-07-06
  question: How should capability instruction structure be standardized across all 12 capabilities, using status (D79) as the reference implementation while retaining each capability's unique workflow shape?
  context: "D79 (firm) rewrote the status capability prose using direct-contract philosophy, three-phase structure, and D71/D72 modal vocabulary and terminology cleanup. The 11 remaining capability audits (TODO.md lines 17-27) need a shared design principle to audit against. D71 (firm) RFC 2119 modal vocabulary is applicable to all 12. D57/D65 (firm) make instructions.ts the canonical module served via agentera prime --context. A survey of all 12 capability instructions.ts files found five universal sections already present across all 12 (Purpose/Visual identity, State artifacts, Safety rails, Exit signals, Cross-capability integration) plus a sixth (Workflow phases) with four-plus genuinely different shapes: linear (status, research, audit), conversational loop (discuss), cycle-based (build, optimize), mode-split (vision, document, profile, design, plan), and multi-surface orchestration (orchestrate). Three capabilities also have domain-specific content sections that do not fit the spine (design: Colors/Typography; profile: PROFILE.md template; research: deliverable template). Discuss ran a deliberation over abstraction level, spine sections, mandatory vs per-capability scope, shape-constraint risk, output artifacts, and audit cadence."
  alternatives:
    - name: Six-section spine, five constrained plus Workflow free-form
      status: chosen
      tradeoffs: "A common skeleton (Purpose, State artifacts, Workflow phases, Safety rails, Exit signals, Cross-capability integration) that all 12 share. Five low-risk sections are shape-constrained. Workflow phases is mandatory-as-section but free-form in content. Domain content sections (design: Colors/Typography; profile: PROFILE.md template; research: deliverable template) are per-capability optional flex sections. Getting started use-case examples fold into Cross-capability integration as the inverse of feeds-into/triggers/informed-by. Personality sections relocate to vision artifact or SOUL.md (tracked as TODO). Status (D79) is the reference implementation. references/cli/capability-instruction-structure.md captures the spine spec, five workflow shapes as named taxonomy, and a per-capability deviation table filled incrementally as each audit completes."
    - name: Single template, all 12 conform
      status: rejected
      tradeoffs: One structure all capabilities inherit. Maximally consistent.
      reason_rejected: "Forces capabilities into a shape that does not fit — discuss scratchpad loop into a linear phase model, build/optimize cycles into step-numbered phases, orchestrate three surface templates into a single workflow. Proven risk: the four-plus genuinely different workflow shapes resist a single template without flattening the distinctions that make each capability effective."
    - name: Minimal shared rules, per-capability self-determination
      status: rejected
      tradeoffs: Only cross-cutting rules (D71 modal vocab, direct contract, mandatory exit marker, output budget). Each capability owns its own phase structure, section ordering, and procedural depth. No spine.
      reason_rejected: Too loose — no spine to audit against. The 11 remaining audits would each discover the same structural principles independently or miss them entirely. D79 direct-contract philosophy would not propagate without a capturing decision.
  choice: "Six-section spine (Purpose, State artifacts, Workflow phases, Safety rails, Exit signals, Cross-capability integration). Five low-risk sections shape-constrained (Purpose: glyph plus one-paragraph purpose; State artifacts: reads/writes/consumes plus path resolution with per-capability artifact-schema subsections allowed; Safety rails: critical block with MUST NOT rules; Exit signals: EX1-EX4 with glyph marker; Cross-capability integration: feeds-into, triggers, informed-by, plus getting-started use-case examples folded in as the inverse of feeds-into/triggers). Workflow phases is mandatory-as-section but free-form in content. Domain content sections are per-capability optional flex sections. Five workflow shapes named as taxonomy: linear (status, research, audit), loop (discuss), cycle (build, optimize), mode-split (vision, document, profile, design, plan), multi-surface (orchestrate). Status (D79) is the reference implementation. D80 plus references/cli/capability-instruction-structure.md are the output artifacts. Each future capability audit runs as a discuss session against D80 plus the reference doc; the reference doc deviation table is filled incrementally."
  reasoning: The five low-risk sections are already universal across all 12 capabilities and are either protocol-bound (Safety rails, Exit signals) or structurally consistent (Purpose, State artifacts, Cross-capability integration). Shape-constraining them is safe and eliminates drift. Workflow phases has four-plus genuinely different shapes that resist a single template — constraining them would flatten discuss conversational loop into fake linear steps, force cycle-based capabilities into step-numbered phases that do not capture the iterative nature, or squeeze orchestrate multi-surface model into a single workflow. The five-shape taxonomy names the variation without constraining it. The reference doc deviation table captures where each capability diverges from the spine, filled incrementally during each audit. Getting started folds into Cross-capability integration because invocation guidance is the inverse of feeds-into/triggers — same relationship, consumer perspective. Personality sections relocate to vision artifact or SOUL.md because conversational voice rules belong in identity, not per- capability prose. Status serves as the concrete reference implementation because it is the only capability already rewritten under direct-contract philosophy with D71/D72 applied.
  confidence: firm
  feeds_into: packages/cli/src/capabilities/<name>/instructions.ts, references/cli/capability-instruction-structure.md, capability_schema_contract.yaml, TODO.md
  outcome: Decision captured. references/cli/capability-instruction-structure.md carries the spine spec, five workflow shapes taxonomy, per-capability deviation table skeleton (11 rows marked not-yet-audited, status marked complete via D79), and domain content flex section guidance. TODO.md receives Personality-relocation entry. The 11 remaining capability TODOs (lines 17-27) now run against D80 plus the reference doc.
