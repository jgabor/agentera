  description: "[feat:3.0.0] Add a glossary synthesis pass to profilera (Full mode, after Step 4) that persists a `## Glossary` section to the user-level `PROFILE.md`. **Prerequisite: tiered extraction (see Degraded).** Source: the bounded signal stream (tier 2) — not the raw `corpus.json` dump. Glossary-worthy terms are surfaced from two signals: (1) correction/clarification events in `conversation_turn` records where the agent named a term and the user corrected or disambiguated it (e.g., \"you said 'account' — Customer or User?\"); these records are already classified `signal_type: \"correction\"` by the extractor. (2) Stable recurring terms appearing across `instruction_document` and `project_config_signal` source families in the signal stream. Each entry records the term, the user's definition/usage, one evidence anchor (record id + date), and a confidence along the existing CS1–CS5 scale. Skip the pass entirely when the project being profiled has `.agentera/glossary.yaml` registered in `.agentera/docs.yaml` — that signals an established convention and the user-level glossary should defer to it. The glossary section is independent of the decision-pattern entries and does not affect confidence metadata elsewhere in `PROFILE.md`; it is consumed read-only by downstream capabilities the same way the decision profile is. Schema change to profilera's output contract — add a regression test that a signal-stream fixture with a known correction event produces the expected glossary entry."
