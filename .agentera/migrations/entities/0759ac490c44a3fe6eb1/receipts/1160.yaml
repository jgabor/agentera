id: nuemlmtpvq
artifact: plan
record:
  header:
    level: light
    created: 2026-05-18
    status: open
    title: App Lifecycle Status Regression Coverage
  what: Add focused regression coverage for the app lifecycle vocabulary boundary so `fresh`, `stale`, `refresh`, `fixed`, `ready`, and `noop` cannot return as canonical app lifecycle status values, while allowed plain-language prose and non-app uses such as `agentera stats refresh` remain valid.
  why: "Recent vocabulary cleanup replaced internal app lifecycle language with the Decision 54 status contract. The remaining risk is regression: tests must reject the old lifecycle words at canonical status surfaces without creating a crude global word ban that breaks user-facing prose, historical context, or unrelated commands."
  constraints: Scope this to regression coverage and any minimal contract/test fixture adjustment required to make that coverage authoritative. Do not perform broad wording cleanup, package refresh, installed-app repair, publication, push, tag, `.agentera/vision.yaml` edits, objective-state mutation, or decision satisfaction updates. Preserve legitimate plain-language prose and non-app command vocabulary, especially `agentera stats refresh`.
  overall_acceptance:
    - Focused regression coverage prevents the old words `fresh`, `stale`, `refresh`, `fixed`, `ready`, and `noop` from being accepted as canonical app lifecycle status values.
    - The same coverage preserves allowed prose and unrelated command vocabulary, including `agentera stats refresh`.
    - The tests stay tied to the lifecycle vocabulary authority and do not become a broad, brittle repository-wide word ban.
  surprises:
    - "`uv run scripts/agentera validate artifact PLAN.md` is not accepted by the current CLI; the supported `--artifact PLAN.md` form passed and no CLI compatibility change was made in this test-scoped cycle."
  scope:
    included:
      []
    excluded:
      []
