    title: Capability Route and Planera Boundary Fix
  what: Fix the remaining 2.5.0 routing and Planera confirmation-boundary TODOs by making canonical capability-name requests with trailing topic text route directly to the named capability, and by clarifying how Planera handles an already-complete existing plan when writing a replacement plan.
  why: Direct user requests such as `resonera decide whether to keep this API` are explicit capability invocations and must not fall through to generic analysis. Planera also needed a concrete completed-plan archive boundary so agents know whether replacing a completed plan requires separate pre-write confirmation.
  constraints: Do not add unsupported capability-name CLI commands, refresh installed apps or profiles, publish, push, tag, change package-manager state, edit `.agentera/vision.yaml`, mutate objective state, or change decision satisfaction state. Keep the change focused on dispatcher guidance, routing tests, Planera prose, compact Planera startup context, and artifact closeout.
  overall_acceptance:
    - Canonical capability-name requests with trailing topic text route directly to the capability, including `resonera <topic>`.
    - Planera prose and compact startup context state that archiving an already complete prior plan is implicit in direct Planera invocation, while active or incomplete plan replacement still requires explicit confirmation.
    - Focused routing, Planera, query, skill-dispatch tests, Planera capability validation, artifact validation, and `git diff --check` pass before commit.
