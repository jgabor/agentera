  alternatives:
    - name: Full D79 delegation with Wayfinder-inspired deliberation-craft additions
      description: "One lean delegation to `deliberation_context` and `raw_artifact_read_policy`; cut re-encoded truth tables and manual schema lookups. Keep discuss-specific judgment (satisfaction authority, do-not-reconstruct). Adopt four compressed Wayfinder adaptations: destination-fixes-scope startup, Ruled-out scratchpad field, fog-aware readiness check at Done (name remaining fog; flag firm-while-foggy as tension without blocking exit), and reframing the skip-to-implementation rail as an edge signal. Add steering rules (breadth-before-depth, ask-user-to-sketch not produce)."
