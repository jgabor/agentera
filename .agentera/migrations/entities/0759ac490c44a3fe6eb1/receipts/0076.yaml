  choice: Full D79 delegation with Wayfinder-inspired additions. Content and process challenged, not just reformatted.
  reasoning: "The fog-aware readiness check fills discuss's only real gap: termination had no quality signal, so confidence was whatever the user declared with no remaining-fog warning. Wayfinder's fog-vs-sharp test (\"can you phrase the question now\") gives exactly the missing signal, compressed to one Done-step sentence. The other adaptations are one-line-each and replace weaker or missing content rather than piling on. Reify-as-produce was rejected to avoid design and plan role overlap; ask-user-to-sketch keeps discuss verbal-first."
