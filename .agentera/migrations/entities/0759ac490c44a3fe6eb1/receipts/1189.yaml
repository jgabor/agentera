  design: |
    Task 1 is the foundational structural rename: 24 directory renames plus all internal code that must compile against the new names. Tasks 2-7 depend on task 1 and edit disjoint file sets, so they could run in parallel after task 1 lands green. Task 8 is the verification gate that depends on all prior tasks. The plan lands as one behavior-preserving refactor commit per the AGENTS.md commit sequencing convention: the rename is behavior-preserving (no functional changes to capability behavior, only naming). The critical path is 1→2→8. The coexistence probe naming-divergence line (task 6) and mobile label change (task 7) are small auxiliary surfaces. The contract flip (task 4) is the authoritative naming declaration that all other tasks reference. Internal dispatch code in task 1 includes provenance strings that still reference the old agentera hej command name — these update to agentera prime per the v3 command surface.
  overall_acceptance: |
    GIVEN the v3 CLI surface WHEN a user invokes agentera prime --context status --format json THEN the capability context loads successfully and returns the orientation prose. GIVEN the capability barrel WHEN inspected THEN all 12 keys are English IDs. GIVEN the coexistence probe WHEN v2 and v3 are both installed THEN a naming-divergence line is emitted. GIVEN the AGENTS.md scope table WHEN inspected THEN 12 rows use English scope names. GIVEN the full test suite and content gate run WHEN verification completes THEN both pass with zero failures. GIVEN the CHANGELOG WHEN inspected THEN the D70 entry is past tense. Historical artifacts, schema version strings, and the v2 stable distribution are unchanged.
