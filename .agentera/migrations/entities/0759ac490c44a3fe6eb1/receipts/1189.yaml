    revised: Found v2-era straggler provenance strings in capabilityContext/evidence.ts (lines 355, 360, 364) and closeout.ts (line 145) still referencing agentera hej --format json instead of the v3 agentera prime command. The capability name change (hej to status) and the command name fix (hej to prime) are orthogonal — conflating them would introduce an unsupported agentera status CLI command. Addressed by adding explicit task 1 acceptance criteria that provenance strings use English capability IDs AND agentera prime (not agentera hej) for the command reference.
    title: "Plan: D70 Capability Rename (English IDs on v3 surface)"
  what: |
    Promote the Decision 43 English alias set to canonical capability IDs on the v3 surface. Rename 24 capability directories (12 in packages/cli/src/capabilities/ plus 12 in skills/agentera/capabilities/), update the capability barrel and internal dispatch code, update ~50 prose and schema content references inside the renamed dirs, rename and update 36 runtime descriptor files, flip the capability_schema_contract.yaml so English is canonical and Swedish is legacy, update SKILL.md dispatch and AGENTS.md scope table, add a coexistence probe naming-divergence line, retire the mobile brief UI label for status, and promote the CHANGELOG D70 entry from future to past tense.
  why: |
    Decision 70 (firm, satisfied 2026-06-09) decided that the D43 English aliases become the binding canonical name set for v3 and onward. One name per capability in v3 satisfies D58. English verbs compose with LLM priors on common CLI patterns (git status, kubectl plan). CLI is ground zero per D68/D69 and its naming propagates to all v3 surfaces. The decision was satisfied as policy but the mechanical rename was deferred to this implementation. v2 stable on main keeps Swedish IDs; historical artifacts are not rewritten.
  constraints: |
    Must not rename schema version strings (agentera.inspekteraEvaluationReport.v1, agentera.coexistenceProbe.v1, agentera.capabilityContext.v1, etc.) — they are compatibility identifiers, not capability IDs. Must not rewrite historical artifacts (archived plans, prior decisions, prior changelog entries). Must not affect the v2 stable distribution on main. Must preserve the cli_boundary in capability_schema_contract.yaml: /agentera plan routes to the capability, agentera state plan reads plan state — the rename must not surface agentera status, agentera plan, agentera document, etc. as CLI commands. Must not add new npm dependencies. Behavior-preserving mechanical rename: no functional changes to capability behavior, only naming. The orientation command stays agentera prime (not agentera status). Bare hej is dropped; bare /agentera is the only bare form.
