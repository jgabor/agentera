    title: Semver and channel upgrade gate (replace target-major)
  what: Replace the bespoke --target-major 3 opt-in with a version-and-channel resolution gate in the v3 upgrade path. The CLI compares the running install version to the latest version on the selected update channel, classifies the outcome (same-major update, forward major upgrade, channel-line mismatch, or blocked downgrade), and requires dry-run review before --yes apply. v2 managed app-home upgrades to v3+ always target the latest release on the chosen channel (stable or development) and run the existing v2→v3 migration orchestration behind that gate. Downgrade to v2 is permanently unsupported regardless of channel; only a future v4→v3 downgrade may be added later and must remain explicitly scoped—never generalized to v2.
  why: "The current --target-major flag duplicates information already implied by running the npm v3 CLI against a v2 app-home and adds friction without a distinct alternate upgrade mode. A semver-plus-channel gate matches conventional package-manager UX, scales to future majors without new flags, and still preserves preview-before-apply safety. User policy clarifies irreversibility: crossing into v3+ closes the v2 Python line permanently; downgrade prompts apply only to supported lines (future v4→v3), not to v2 recovery fantasies."
  constraints: "Contract-first: extend references/cli/app-lifecycle-vocabulary.yaml and references/cli/update-channels.yaml rather than parallel vocab. Preserve dry-run before --yes apply and idempotent migration phases. Stable channel must not silently cross into v3 migration while stable resolution still tracks 2.x (until an explicit release retires the 2.x support line). v3→v2 downgrade attempts must always fail with a clear irreversibility message. Do not implement v4→v3 downgrade apply in this plan—only leave extension points and blocking rules. Remove --target-major from CLI surface, docs, sandbox harness, and tests once the gate ships. No remote push; do not modify vision.yaml or objective state."
  scope:
    included:
      - references/cli/update-channels.yaml (version resolution rules per channel)
      - references/cli/app-lifecycle-vocabulary.yaml (major_boundary_crossing opt-in model)
      - references/cli/vocabulary.md and UPGRADE.md
      - packages/cli/src/upgrade/ (version resolution, compatibility, orchestrator, commands)
      - packages/cli/src/cli/commands/ (upgrade, doctor, prime, schema, dispatch)
      - packages/cli/test/upgrade/ and sandbox harness scripts referencing target-major
      - gapRegistry and CI upgrade gate expectations
    excluded:
      - Implementing v4→v3 downgrade apply (future plan only)
      - Publishing real 2.x builds to npm @latest or retiring stable 2.x line
      - Python main-line orchestrator changes beyond vocabulary backport if needed
      - Interactive TUI prompts (text/JSON plan messages only in this plan)
    deferred:
      - Live npm registry fetch in CI Tier 2 (keep pinned fixtures; optional live probe separate)
      - Retiring deprecated --target-major alias period if external docs still reference it
  design: "Introduce a version-resolution authority consumed by upgrade, doctor, and prime: runningVersion from bundle marker or package version; channel from existing resolveUpdateChannel(); latestOnChannel from offline-testable resolution (npm dist-tag metadata and git ref semantics with injectable resolver for tests). classifyUpgradeOutcome() returns behavioral concepts: same_major_update, forward_major_upgrade, channel_line_mismatch, migration_to_latest_on_channel, blocked_downgrade_to_v2 (always), optional future downgrade_candidate (v4→v3 stub blocked as not_implemented). Cross-major forward apply requires lifecycleStatus manual_review_needed until dry-run reviewed; --yes after a successful dry-run on the same channel and outcome class is sufficient—no --target-major. v2 layout plus channel resolving to 3.x line plus forward major triggers existing migrate phases and sets migration target to latestOnChannel for that channel. v3 layout on development with stable channel selected surfaces channel_line_mismatch (e.g. running 4.x dev, latest stable 3.x)—inform and block apply unless user switches channel; never offer v2. Doctor and prime render channel-aware commands without target-major; upgradeCommands derive flags only from channel and --only. Deprecate and remove --target-major from dispatch and schema after tests migrate."
  overall_acceptance: GIVEN a v2 managed app-home and development channel WHEN user runs upgrade dry-run then yes without --target-major THEN migration to latest 3.x on that channel is previewed and applied with no path back to v2 GIVEN any v3+ install WHEN user attempts downgrade to v2 on any channel THEN upgrade refuses with irreversibility messaging and blocked status GIVEN stable channel while stable still resolves to 2.x WHEN upgrade dry-run runs THEN v3 migration operations are absent from the plan GIVEN running and latest versions on the same major and channel WHEN upgrade dry-run runs THEN behavior remains same-major update or noop without spurious migration phases
