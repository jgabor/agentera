name: Qualification benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification-benchmark:
    name: Three-run qualification benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run on-demand qualification benchmark
        env:
          AGENTERA_PERFORMANCE_RUNNER_CLASS: github-hosted-ubuntu-24.04
          AGENTERA_PERFORMANCE_RUNNER_IDENTITY: ${{ runner.name }}
        run: |
          mkdir -p "${RUNNER_TEMP}/agentera-qualification-benchmark"
          pnpm cli:benchmark:qualification -- --adapter development --candidate-root "${RUNNER_TEMP}/agentera-qualification-benchmark" --json \
            | tee "${RUNNER_TEMP}/qualification-benchmark.json"
      - name: Upload timing report
        uses: actions/upload-artifact@v4
        with:
          name: qualification-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/qualification-benchmark.json
          if-no-files-found: error
          retention-days: 30
