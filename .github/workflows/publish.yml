name: Publish verified package

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Verification workflow run containing the package
        required: true
        type: string
      candidate_receipt_sha256:
        description: Receipt digest for the verified package
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate_source:
    name: Validate verified package
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.run.outputs.head_sha }}
      metadata_commit: ${{ steps.candidate.outputs.metadata_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Validate verification run
        id: run
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const runId = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId < 1) throw new Error("source_run_id must be a positive GitHub Actions run ID");
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const qualification = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/packages/cli/scripts/release-qualification.mjs`).href);
            const validated = qualification.validateQualificationWorkflowRun(run, runId);
            core.setOutput("head_sha", validated.headSha);
      - name: Checkout verified source
        run: git checkout --detach "${{ steps.run.outputs.head_sha }}"
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/agentera-package
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Match package receipt to workflow run
        id: candidate
        env:
          ADAPTER: stable
          EXPECTED_CANDIDATE_SHA256: ${{ inputs.candidate_receipt_sha256 }}
          SOURCE_HEAD_SHA: ${{ steps.run.outputs.head_sha }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'import fs from "node:fs"; import { validateCandidateReceipt, validateCandidateRunBinding } from "./packages/cli/scripts/release-qualification.mjs"; const loaded=validateCandidateReceipt({ candidateDirectory: process.env.RUNNER_TEMP + "/agentera-package", adapterName: process.env.ADAPTER }); const bound=validateCandidateRunBinding(loaded.receipt, process.env.EXPECTED_CANDIDATE_SHA256, process.env.SOURCE_HEAD_SHA); fs.appendFileSync(process.env.GITHUB_OUTPUT, `metadata_commit=${bound.metadataCommit}\n`);'

  publish:
    name: Publish package
    needs: validate_source
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate_source.outputs.metadata_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/agentera-package
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Restore package file mode
        run: chmod 0444 "${RUNNER_TEMP}"/agentera-package/*.tgz
      - name: Recheck package receipt
        env:
          ADAPTER: stable
          EXPECTED_CANDIDATE_SHA256: ${{ inputs.candidate_receipt_sha256 }}
          SOURCE_HEAD_SHA: ${{ needs.validate_source.outputs.head_sha }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'import { validateCandidateReceipt, validateCandidateRunBinding } from "./packages/cli/scripts/release-qualification.mjs"; const loaded=validateCandidateReceipt({ candidateDirectory: process.env.RUNNER_TEMP + "/agentera-package", adapterName: process.env.ADAPTER }); validateCandidateRunBinding(loaded.receipt, process.env.EXPECTED_CANDIDATE_SHA256, process.env.SOURCE_HEAD_SHA);'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        env:
          COREPACK_HOME: ${{ runner.temp }}/corepack
      - name: Approve verified package
        run: node packages/cli/scripts/release-qualification.mjs approval --adapter stable --candidate-dir "${RUNNER_TEMP}/agentera-package" --approved-by "${{ github.actor }}" --source-run-id "${{ inputs.source_run_id }}"
      - name: Stage, test, and promote package
        # The coordinator enforces <120s; this outer guard leaves time to emit its failure receipt.
        timeout-minutes: 3
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node packages/cli/scripts/release-benchmark.mjs publication --adapter stable --candidate-dir "${RUNNER_TEMP}/agentera-package" --source-run-id "${{ inputs.source_run_id }}" --receipt-file "${RUNNER_TEMP}/qualified-publication-receipt.json" --json
