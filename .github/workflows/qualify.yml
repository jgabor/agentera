name: Verify package

on:
  push:
    branches:
      - feat/v3

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-next-${{ github.ref }}
  queue: max

jobs:
  qualify:
    name: Verify source and development package
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.allocate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        env:
          COREPACK_HOME: ${{ runner.temp }}/corepack
      - name: Allocate rolling development version
        id: allocate
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="$(node packages/cli/scripts/release-qualification.mjs allocate --run-number "${GITHUB_RUN_NUMBER}")"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'Publishing %s from %s\n' "${version}" "${GITHUB_SHA}"
      - name: Verify committed source
        if: github.run_attempt == 1
        env:
          COREPACK_HOME: ${{ runner.temp }}/corepack
          VITEST_MAX_WORKERS: "1"
          VITEST_TEST_TIMEOUT_MS: "120000"
          AGENTERA_GENERATED_OVERLAP_SOURCE_WORKERS: "2"
          AGENTERA_PERFORMANCE_RUNNER_CLASS: github-hosted-ubuntu-24.04
          AGENTERA_PERFORMANCE_RUNNER_IDENTITY: ${{ runner.name }}
        run: pnpm cli:qualify:source -- --candidate-dir "${RUNNER_TEMP}/agentera-package"
      - name: Verify development package
        if: github.run_attempt == 1
        env:
          COREPACK_HOME: ${{ runner.temp }}/corepack
        run: pnpm cli:qualify:dev -- --candidate-dir "${RUNNER_TEMP}/agentera-package" --target-version "${{ steps.allocate.outputs.version }}" --source-commit "${GITHUB_SHA}"
      - name: Attest transferred package
        if: github.run_attempt == 1
        run: node packages/cli/scripts/release-qualification.mjs attest --adapter development --candidate-dir "${RUNNER_TEMP}/agentera-package"
      - name: Upload verified package
        if: github.run_attempt == 1
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/agentera-package
          if-no-files-found: error
          retention-days: 30
      - name: Download retained package
        if: github.run_attempt > 1
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/agentera-package
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Restore retained package file mode
        if: github.run_attempt > 1
        run: chmod 0444 "${RUNNER_TEMP}"/agentera-package/*.tgz
      - name: Validate retained package and CI attestation
        if: github.run_attempt > 1
        run: |
          node --input-type=module -e 'import { validateCandidateReceipt, validateCiAttestation, validateDevelopmentCiCandidateBinding } from "./packages/cli/scripts/release-qualification.mjs"; const candidate=validateCandidateReceipt({ candidateDirectory: process.env.RUNNER_TEMP + "/agentera-package", adapterName: "development" }); validateDevelopmentCiCandidateBinding({ adapterName: "development", targetVersion: candidate.receipt.version, sourceCommit: candidate.receipt.sourceCommit }); validateCiAttestation({ candidateDirectory: process.env.RUNNER_TEMP + "/agentera-package", adapterName: "development", candidate, sourceRunId: process.env.GITHUB_RUN_ID });'

  publish-development:
    name: Publish development package to @next
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/agentera-package
      - run: chmod 0444 "${RUNNER_TEMP}"/agentera-package/*.tgz
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Approve verified package
        run: node packages/cli/scripts/release-qualification.mjs approval --adapter development --candidate-dir "${RUNNER_TEMP}/agentera-package" --approved-by "github-actions/feat-v3" --source-run-id "${{ github.run_id }}"
      - name: Publish development package
        timeout-minutes: 3
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node packages/cli/scripts/release-benchmark.mjs publication --adapter development --candidate-dir "${RUNNER_TEMP}/agentera-package" --source-run-id "${{ github.run_id }}" --receipt-file "${RUNNER_TEMP}/qualified-publication-receipt.json" --json
