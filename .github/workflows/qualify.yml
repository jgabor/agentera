name: Publish development package

on:
  push:
    branches:
      - feat/v3

permissions:
  contents: read

concurrency:
  group: publish-next-${{ github.ref }}
  queue: max

jobs:
  publish-development:
    name: Build, smoke, and publish to @next
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        timeout-minutes: 1
        with:
          node-version-file: .node-version
      - name: Install dependencies
        timeout-minutes: 3
        env:
          COREPACK_HOME: ${{ runner.temp }}/corepack
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Allocate rolling development version
        id: version
        timeout-minutes: 1
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="$(node -p "'3.0.0-dev.' + (Number(process.env.GITHUB_RUN_NUMBER) + 72)")"
          printf 'value=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'Publishing %s from %s\n' "${version}" "${GITHUB_SHA}"
      - name: Build one isolated package tarball
        timeout-minutes: 2
        run: |
          node packages/cli/scripts/pack-package.mjs \
            --output-dir "${RUNNER_TEMP}/agentera-package" \
            --package-version "${{ steps.version.outputs.value }}" \
            --git-ref "${GITHUB_SHA}" --json
      - name: Validate and smoke the exact tarball
        timeout-minutes: 1
        run: |
          node packages/cli/scripts/publish-development.mjs validate \
            --tarball "${RUNNER_TEMP}/agentera-package/agentera-${{ steps.version.outputs.value }}.tgz" \
            --package-version "${{ steps.version.outputs.value }}" \
            --git-ref "${GITHUB_SHA}"
      - name: Publish the exact tarball to npm @next
        timeout-minutes: 2
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node packages/cli/scripts/publish-development.mjs publish \
            --tarball "${RUNNER_TEMP}/agentera-package/agentera-${{ steps.version.outputs.value }}.tgz" \
            --package-version "${{ steps.version.outputs.value }}" \
            --git-ref "${GITHUB_SHA}"
