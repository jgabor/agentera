name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/v3

jobs:
  cli:
    name: CLI (package, source, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - name: Verify clean source boundary
        env:
          AGENTERA_VITEST_RUNNER_POLICY: unmeasured
        run: pnpm -C packages/cli test
      - name: Verify package boundary
        run: pnpm -C packages/cli run verify:package
      - name: Typecheck CLI
        run: pnpm -C packages/cli run typecheck
      - name: Fetch main for py-ts parity drift gate
        run: git fetch origin main --depth=1
      - name: Py-TS parity drift gate (#34)
        run: bash packages/cli/scripts/py_ts_parity.sh --check --json
      - name: Verify generated-output overlap
        run: pnpm -C packages/cli run verify:generated-overlap
      - name: Build checkout CLI
        run: pnpm -C packages/cli build
      - name: Repository gates
        run: node packages/cli/dist/bin/agentera.js check compact

  sandbox-l1:
    name: v2→v3 sandbox L1
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/v3' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - run: pnpm -C packages/cli build
      - name: Run P0 sandbox scenarios
        env:
          REPO_ROOT: ${{ github.workspace }}
          AGENTERA_SANDBOX_TIER: L1
        run: |
          set -euo pipefail
          for scenario in happy-path-clean stable-safety v1-md-blocked noisy-app-home codex-plugin-vs-copied partial-only-runtime; do
            bash scripts/sandbox/v2v3-upgrade-harness.sh "$scenario"
          done
      - name: Upload sandbox reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-reports-l1
          path: sandbox-report-*.json

  publish-next:
    name: Publish packages/cli to npm @next (feat/v3)
    needs: [cli, sandbox-l1]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Publish or verify isolated package on npm @next
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm cli:publish:dev

  sandbox-l2:
    # TODO vptlelnadp owns the full exact-version bootstrap matrix. This L2
    # scenario consumes the version only after the publication transaction.
    name: v2→v3 sandbox L2 (pinned npm)
    needs: [publish-next]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/v3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run L2 happy-path with npm pin from package.json
        env:
          REPO_ROOT: ${{ github.workspace }}
          AGENTERA_SANDBOX_TIER: L2
        run: |
          set -euo pipefail
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          AGENTERA_NPM_PIN="agentera@${CLI_VERSION}"
          echo "L2 npm pin: ${AGENTERA_NPM_PIN}"
          if ! npm view "${AGENTERA_NPM_PIN}" version >/dev/null 2>&1; then
            echo "error: ${AGENTERA_NPM_PIN} is not published on npm after the publication transaction" >&2
            exit 1
          fi
          export AGENTERA_NPM_PIN
          bash scripts/sandbox/v2v3-upgrade-harness.sh happy-path-clean

  publish-latest:
    name: Publish stable shim to npm @latest (main)
    needs: [cli]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Publish or verify shim on npm @latest
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm cli:publish:stable
