name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/v3

jobs:
  cli:
    name: CLI verification DAG
    if: github.event_name != 'push' || github.ref != 'refs/heads/feat/v3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - name: Fetch main for source-owned py-ts parity
        run: git fetch origin main --depth=1
      - name: Verify check-only release conjunction
        env:
          AGENTERA_VITEST_RUNNER_POLICY: unmeasured
          AGENTERA_PERFORMANCE_RUNNER_CLASS: github-hosted-ubuntu-24.04
          AGENTERA_PERFORMANCE_RUNNER_IDENTITY: ${{ runner.name }}
        run: pnpm -C packages/cli run verify:release

  sandbox-l1:
    name: v2→v3 sandbox L1
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/v3' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - run: pnpm -C packages/cli build
      - name: Run P0 sandbox scenarios
        env:
          REPO_ROOT: ${{ github.workspace }}
          AGENTERA_SANDBOX_TIER: L1
        run: |
          set -euo pipefail
          for scenario in happy-path-clean stable-safety v1-md-blocked noisy-app-home codex-plugin-vs-copied partial-only-runtime; do
            bash scripts/sandbox/v2v3-upgrade-harness.sh "$scenario"
          done
      - name: Upload sandbox reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-reports-l1
          path: sandbox-report-*.json
