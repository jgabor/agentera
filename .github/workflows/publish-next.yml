name: Publish development package (@next)

on:
  push:
    branches:
      - feat/v3

permissions:
  contents: read

concurrency:
  group: publish-next-${{ github.ref }}
  queue: max

jobs:
  publish-development:
    name: Build, smoke, and publish to @next
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        timeout-minutes: 1
        with:
          node-version-file: .node-version
      - name: Install dependencies
        timeout-minutes: 3
        env:
          COREPACK_HOME: ${{ runner.temp }}/corepack
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Read committed development version
        id: version
        timeout-minutes: 1
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          printf 'value=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'Publishing %s from %s\n' "${version}" "${GITHUB_SHA}"
      - name: Build one isolated package tarball
        timeout-minutes: 2
        run: |
          node packages/cli/scripts/pack-package.mjs \
            --output-dir "${RUNNER_TEMP}/agentera-package" \
            --git-ref "${GITHUB_SHA}" --json
      - name: Validate, smoke, and classify the exact tarball
        id: classification
        timeout-minutes: 1
        run: |
          outcome="$(node packages/cli/scripts/publish-development.mjs classify \
            --tarball "${RUNNER_TEMP}/agentera-package/agentera-${{ steps.version.outputs.value }}.tgz" \
            --package-version "${{ steps.version.outputs.value }}" \
            --git-ref "${GITHUB_SHA}" \
            --classification "${RUNNER_TEMP}/agentera-package/publication-classification.json")"
          case "${outcome}" in
            exact-replay|superseded-replay|forward-publish|forward-retag) ;;
            *) printf 'Invalid publication classification\n' >&2; exit 1 ;;
          esac
          printf 'outcome=%s\n' "${outcome}" >> "${GITHUB_OUTPUT}"
      - name: Mutate npm only for a forward outcome
        if: steps.classification.outputs.outcome == 'forward-publish' || steps.classification.outputs.outcome == 'forward-retag'
        timeout-minutes: 2
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node packages/cli/scripts/publish-development.mjs mutate \
            --tarball "${RUNNER_TEMP}/agentera-package/agentera-${{ steps.version.outputs.value }}.tgz" \
            --package-version "${{ steps.version.outputs.value }}" \
            --git-ref "${GITHUB_SHA}" \
            --classification "${RUNNER_TEMP}/agentera-package/publication-classification.json"
