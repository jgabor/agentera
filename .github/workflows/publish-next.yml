name: Publish development package (@next)

on:
  push:
    branches:
      - feat/v3

permissions:
  contents: read

concurrency:
  group: publish-next-${{ github.ref }}
  queue: max

jobs:
  publish-development:
    name: Build, smoke, and publish to @next
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        timeout-minutes: 1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        timeout-minutes: 3
        env:
          COREPACK_HOME: ${{ runner.temp }}/corepack
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Allocate candidate development version
        id: version
        timeout-minutes: 1
        run: |
          version="$(node --input-type=module -e "
            import fs from 'node:fs';
            import { allocateDevelopmentVersion } from './packages/cli/scripts/development-publication-state.mjs';
            const manifest = JSON.parse(fs.readFileSync('./packages/cli/package.json', 'utf8'));
            process.stdout.write(allocateDevelopmentVersion(manifest.version, process.env.GITHUB_RUN_NUMBER));
          ")"
          printf 'value=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'Publishing %s from %s\n' "${version}" "${GITHUB_SHA}"
      - name: Build one isolated package tarball
        timeout-minutes: 2
        run: |
          node packages/cli/scripts/pack-package.mjs \
            --output-dir "${RUNNER_TEMP}/agentera-package" \
            --package-version "${{ steps.version.outputs.value }}" \
            --git-ref "${GITHUB_SHA}" --json
      - name: Validate, smoke, and classify the exact tarball
        id: classification
        timeout-minutes: 1
        run: |
          outcome="$(env -i PATH="${PATH}" node packages/cli/scripts/publish-development.mjs classify \
            --tarball "${RUNNER_TEMP}/agentera-package/agentera-${{ steps.version.outputs.value }}.tgz" \
            --package-version "${{ steps.version.outputs.value }}" \
            --git-ref "${GITHUB_SHA}" \
            --classification "${RUNNER_TEMP}/agentera-package/publication-classification.json")"
          case "${outcome}" in
            exact-replay|superseded-replay|forward-publish|forward-retag) ;;
            *) printf 'Invalid publication classification\n' >&2; exit 1 ;;
          esac
          printf 'outcome=%s\n' "${outcome}" >> "${GITHUB_OUTPUT}"
      - name: Mutate npm only for a forward outcome
        if: steps.classification.outputs.outcome == 'forward-publish' || steps.classification.outputs.outcome == 'forward-retag'
        timeout-minutes: 2
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NPM_TOKEN:-}" ]]; then
            printf 'NPM_TOKEN is required for npm mutation\n' >&2
            exit 1
          fi
          auth_config="${RUNNER_TEMP}/agentera-npm-auth.npmrc"
          trap 'rm -f "${auth_config}"' EXIT
          umask 077
          printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${auth_config}"
          unset NPM_TOKEN NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG npm_config_userconfig \
            NPM_CONFIG_GLOBALCONFIG npm_config_globalconfig NPM_CONFIG__AUTH npm_config__auth \
            NPM_CONFIG__AUTHTOKEN npm_config__authToken
          env -i PATH="${PATH}" node packages/cli/scripts/publish-development.mjs mutate \
            --tarball "${RUNNER_TEMP}/agentera-package/agentera-${{ steps.version.outputs.value }}.tgz" \
            --package-version "${{ steps.version.outputs.value }}" \
            --git-ref "${GITHUB_SHA}" \
            --classification "${RUNNER_TEMP}/agentera-package/publication-classification.json" \
            --auth-config "${auth_config}"
