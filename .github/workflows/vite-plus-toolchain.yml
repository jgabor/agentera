name: Vite+ toolchain experiment

on:
  push:
    branches: [vite-plus-1-toolchain]

permissions:
  contents: read

# Independent of publication. Keep both controls for every experimental push.
concurrency:
  group: vite-plus-toolchain-experiment
  queue: max
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AGENTERA_VITEST_RUNNER_POLICY: unmeasured
      AGENTERA_GENERATED_OVERLAP_SOURCE_WORKERS: "2"
      VITEST_TEST_TIMEOUT_MS: "120000"
      AGENTERA_PERFORMANCE_RUNNER_CLASS: github-hosted-ubuntu-24.04
      VP_GIT_HOOKS: "0"
    steps:
      # Reviewed actions/checkout v5 ref on 2026-10-02.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1b964ee320832100b8715503a8a7747b0d0fc591
          fetch-depth: 0
          persist-credentials: false
      - &host-node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0, verifier host only
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - &cold-context
        name: Bind cold Linux x64 runner context
        env:
          AGENTERA_PERFORMANCE_RUNNER_IDENTITY: ${{ runner.name }}
          AGENTERA_QUALIFICATION_DIAGNOSTICS: ${{ runner.temp }}/toolchain-diagnostics
        run: |
          set -euo pipefail
          test "$(uname -sm)" = "Linux x86_64"
          test ! -e node_modules
          test ! -e packages/cli/dist
          test ! -e packages/cli/bundle
          printf '%s\n' "AGENTERA_PERFORMANCE_RUNNER_IDENTITY=$AGENTERA_PERFORMANCE_RUNNER_IDENTITY" "AGENTERA_QUALIFICATION_DIAGNOSTICS=$AGENTERA_QUALIFICATION_DIAGNOSTICS" >> "$GITHUB_ENV"
          mkdir -p "$AGENTERA_QUALIFICATION_DIAGNOSTICS"
          git rev-parse HEAD > "$AGENTERA_QUALIFICATION_DIAGNOSTICS/revision.txt"
          node -e 'console.log(JSON.stringify({hostNode:process.version, platform:process.platform, arch:process.arch, runner:process.env.AGENTERA_PERFORMANCE_RUNNER_IDENTITY, runnerClass:process.env.AGENTERA_PERFORMANCE_RUNNER_CLASS, sourceWorkers:Number(process.env.AGENTERA_GENERATED_OVERLAP_SOURCE_WORKERS), testTimeoutMs:120000}))' > "$AGENTERA_QUALIFICATION_DIAGNOSTICS/context.json"
      - &bootstrap
        name: Revision-owned verified bootstrap and frozen install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node packages/cli/scripts/bootstrap-integrity.mjs --ignore-scripts 2>&1 | tee "$AGENTERA_QUALIFICATION_DIAGNOSTICS/bootstrap.log"
      - &runtime
        name: Confirm actual managed process and empty verdict caches
        run: |
          set -euo pipefail
          test ! -e node_modules/.vite
          test ! -e packages/cli/node_modules/.vite
          vp exec node -e 'if(process.version!=="v24.19.0")throw Error(process.version); console.log(JSON.stringify({node:process.version, executable:process.execPath}))' | tee "$AGENTERA_QUALIFICATION_DIAGNOSTICS/runtime.json"
          test "$(vp exec pnpm --version)" = "10.30.3"
      - &verify
        name: Production development verification, no receipt
        timeout-minutes: 30
        run: |
          set -euo pipefail
          vp exec vp run verify:development 2>&1 | tee "$AGENTERA_QUALIFICATION_DIAGNOSTICS/verification.log"
      - &upload
        name: Retain diagnostics even after verification failure
        if: always()
        # Reviewed actions/upload-artifact v4 ref on 2026-10-02.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vite-plus-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/toolchain-diagnostics
          if-no-files-found: warn
          retention-days: 14

  candidate:
    needs: baseline
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Keep the same hosted resource limits but reserve CPU for the four package
    # journeys. The prior two-source-worker sample exceeded the package budget.
    env:
      AGENTERA_VITEST_RUNNER_POLICY: unmeasured
      AGENTERA_GENERATED_OVERLAP_SOURCE_WORKERS: "1"
      VITEST_TEST_TIMEOUT_MS: "120000"
      AGENTERA_PERFORMANCE_RUNNER_CLASS: github-hosted-ubuntu-24.04
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - *host-node
      - *cold-context
      - *bootstrap
      - *runtime
      - *verify
      - *upload
