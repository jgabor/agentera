name: Publish qualified release candidate

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Qualification workflow run that retained the exact candidate
        required: true
        type: string
      candidate_receipt_sha256:
        description: Exact candidate receipt digest approved for mutation
        required: true
        type: string
      adapter:
        description: Package adapter
        required: true
        type: choice
        options: [development, stable]

permissions:
  actions: read
  contents: read

jobs:
  validate_source:
    name: Validate qualification provenance before approval
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.run.outputs.head_sha }}
      metadata_commit: ${{ steps.candidate.outputs.metadata_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate contracted qualification run identity
        id: run
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const runId = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId < 1) throw new Error("source_run_id must be a positive GitHub Actions run ID");
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const qualification = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/packages/cli/scripts/release-qualification.mjs`).href);
            const validated = qualification.validateQualificationWorkflowRun(run, runId);
            core.setOutput("head_sha", validated.headSha);
      - name: Checkout qualified source head
        run: git checkout --detach "${{ steps.run.outputs.head_sha }}"
      - name: Download exact qualification artifact
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/agentera-candidate
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Bind candidate receipt to API-backed run head
        id: candidate
        env:
          ADAPTER: ${{ inputs.adapter }}
          EXPECTED_CANDIDATE_SHA256: ${{ inputs.candidate_receipt_sha256 }}
          SOURCE_HEAD_SHA: ${{ steps.run.outputs.head_sha }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'import fs from "node:fs"; import { validateCandidateReceipt, validateCandidateRunBinding } from "./packages/cli/scripts/release-qualification.mjs"; const loaded=validateCandidateReceipt({ candidateDirectory: process.env.RUNNER_TEMP + "/agentera-candidate", adapterName: process.env.ADAPTER }); const bound=validateCandidateRunBinding(loaded.receipt, process.env.EXPECTED_CANDIDATE_SHA256, process.env.SOURCE_HEAD_SHA); fs.appendFileSync(process.env.GITHUB_OUTPUT, `metadata_commit=${bound.metadataCommit}\n`);'

  publish:
    name: Stage, verify, and promote approved candidate
    needs: validate_source
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate_source.outputs.metadata_commit }}
      - name: Download exact validated qualification artifact
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/agentera-candidate
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Recheck transferred candidate binding
        env:
          ADAPTER: ${{ inputs.adapter }}
          EXPECTED_CANDIDATE_SHA256: ${{ inputs.candidate_receipt_sha256 }}
          SOURCE_HEAD_SHA: ${{ needs.validate_source.outputs.head_sha }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'import { validateCandidateReceipt, validateCandidateRunBinding } from "./packages/cli/scripts/release-qualification.mjs"; const loaded=validateCandidateReceipt({ candidateDirectory: process.env.RUNNER_TEMP + "/agentera-candidate", adapterName: process.env.ADAPTER }); validateCandidateRunBinding(loaded.receipt, process.env.EXPECTED_CANDIDATE_SHA256, process.env.SOURCE_HEAD_SHA);'
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Record candidate-bound approval
        run: node packages/cli/scripts/release-qualification.mjs approval --adapter "${{ inputs.adapter }}" --candidate-dir "${RUNNER_TEMP}/agentera-candidate" --approved-by "${{ github.actor }}" --source-run-id "${{ inputs.source_run_id }}"
      - name: Run bounded qualified publication envelope
        # The coordinator enforces <120s; this outer guard leaves time to emit its failure receipt.
        timeout-minutes: 3
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node packages/cli/scripts/release-benchmark.mjs publication --adapter "${{ inputs.adapter }}" --candidate-dir "${RUNNER_TEMP}/agentera-candidate" --source-run-id "${{ inputs.source_run_id }}" --receipt-file "${RUNNER_TEMP}/qualified-publication-receipt.json" --json
