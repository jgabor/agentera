# Temporary hosted measurement of the development verification layout with
# parallel package files and a separate isolated-owner runner. It runs on its own
# branch only, never builds, publishes, or requests OIDC, and it is removed
# before the layout lands on the development ref.
name: Core job measurement

on:
  push:
    branches: [ci/core-job-measure]

concurrency:
  group: core-job-measurement
  cancel-in-progress: false

jobs:
  verify-development:
    name: Verify development source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0; trusted Node/npm prerequisite
        timeout-minutes: 1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verified bootstrap and frozen install
        timeout-minutes: 3
        run: node packages/cli/scripts/bootstrap-integrity.mjs --ignore-scripts
      - name: Check static project policy
        timeout-minutes: 1
        run: vp check
      - name: Verify development safety without receipt
        timeout-minutes: 40
        env:
          AGENTERA_VITEST_RUNNER_POLICY: unmeasured
          AGENTERA_GENERATED_OVERLAP_SOURCE_WORKERS: "2"
          VITEST_TEST_TIMEOUT_MS: "120000"
          AGENTERA_SOURCE_PARTITION: core
          AGENTERA_ISOLATED_OWNERS: delegate
          AGENTERA_SOURCE_PARTITION_DIRECTORY: ${{ runner.temp }}/agentera-verification
        run: vp run verify:development
      - name: Upload core verification evidence
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: agentera-verification-core
          path: ${{ runner.temp }}/agentera-verification
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  verify-isolated-owners:
    name: Verify development isolated owners
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0; trusted Node/npm prerequisite
        timeout-minutes: 1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verified bootstrap and frozen install
        timeout-minutes: 3
        run: node packages/cli/scripts/bootstrap-integrity.mjs --ignore-scripts
      - name: Verify development isolated owners
        timeout-minutes: 40
        env:
          AGENTERA_VITEST_RUNNER_POLICY: unmeasured
          VITEST_TEST_TIMEOUT_MS: "120000"
          AGENTERA_PERFORMANCE_RUNNER_CLASS: github-hosted-ubuntu-24.04
          AGENTERA_PERFORMANCE_RUNNER_IDENTITY: ${{ runner.name }}
          AGENTERA_SOURCE_PARTITION_DIRECTORY: ${{ runner.temp }}/agentera-verification
        run: vp run verify:development:isolated
      - name: Upload isolated owner verification evidence
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: agentera-verification-isolated
          path: ${{ runner.temp }}/agentera-verification
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  verify-source-shard:
    name: Verify development source shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0; trusted Node/npm prerequisite
        timeout-minutes: 1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verified bootstrap and frozen install
        timeout-minutes: 3
        run: node packages/cli/scripts/bootstrap-integrity.mjs --ignore-scripts
      - name: Verify development source shard
        timeout-minutes: 40
        env:
          AGENTERA_VITEST_RUNNER_POLICY: unmeasured
          VITEST_TEST_TIMEOUT_MS: "120000"
          AGENTERA_SOURCE_PARTITION: shard:${{ matrix.shard }}/3
          AGENTERA_SOURCE_PARTITION_DIRECTORY: ${{ runner.temp }}/agentera-verification
        run: vp run verify:development:shard
      - name: Build checkout CLI for migration
        if: matrix.shard == 3
        timeout-minutes: 1
        run: vp run build
      - name: Run v2→v3 migration scenarios
        if: matrix.shard == 3
        timeout-minutes: 2
        env:
          REPO_ROOT: ${{ github.workspace }}
          AGENTERA_SANDBOX_TIER: L1
        run: |
          set -euo pipefail
          for scenario in happy-path-clean stable-safety noisy-app-home codex-plugin-vs-copied partial-only-runtime; do
            bash scripts/sandbox/v2v3-upgrade-harness.sh "$scenario"
          done
      - name: Upload shard verification evidence
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: agentera-verification-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/agentera-verification
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Mirrors the first steps of build-development: assembly only, no candidate.
  assemble-development-verification:
    needs: [verify-development, verify-isolated-owners, verify-source-shard]
    name: Assemble development verification
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0; trusted Node/npm prerequisite
        timeout-minutes: 1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verified bootstrap and frozen install
        timeout-minutes: 3
        run: node packages/cli/scripts/bootstrap-integrity.mjs --ignore-scripts
      - name: Download partition verification evidence
        uses: actions/download-artifact@v4
        timeout-minutes: 1
        with:
          pattern: agentera-verification-*
          path: ${{ runner.temp }}/agentera-verification
          merge-multiple: true
      - name: Assemble development verification
        timeout-minutes: 2
        env:
          AGENTERA_SOURCE_PARTITION_DIRECTORY: ${{ runner.temp }}/agentera-verification
        run: vp run verify:development:assemble
