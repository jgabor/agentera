name: Verify changes

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  cli:
    name: CLI verification DAG
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0; trusted Node/npm prerequisite
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verified bootstrap and frozen install
        run: node packages/cli/scripts/bootstrap-integrity.mjs
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - name: Run static validation
        run: vp check
      - name: Run development safety verification
        env:
          AGENTERA_VITEST_RUNNER_POLICY: unmeasured
          VITEST_TEST_TIMEOUT_MS: "120000"
          AGENTERA_PERFORMANCE_RUNNER_CLASS: github-hosted-ubuntu-24.04
          AGENTERA_PERFORMANCE_RUNNER_IDENTITY: ${{ runner.name }}
        run: vp run verify:development

  source-migration:
    name: v2→v3 migration (source build)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/v3' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0; trusted Node/npm prerequisite
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verified bootstrap and frozen install
        run: node packages/cli/scripts/bootstrap-integrity.mjs
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - run: vp run build
      - name: Run v2→v3 migration scenarios
        env:
          REPO_ROOT: ${{ github.workspace }}
          AGENTERA_SANDBOX_TIER: L1
        run: |
          set -euo pipefail
          for scenario in happy-path-clean stable-safety noisy-app-home codex-plugin-vs-copied partial-only-runtime; do
            bash scripts/sandbox/v2v3-upgrade-harness.sh "$scenario"
          done
      - name: Upload sandbox reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-migration-reports
          path: sandbox-report-*.json
