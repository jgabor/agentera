EXIT_CONDITIONS:
  1:
    id: E1
    condition: complete
    description: >-
      One full cycle completed. Work was selected, implemented, and verified
      against acceptance criteria using applicable passing evidence and any
      required additional checks. Required artifact updates precede a single
      conventional commit only when explicitly authorized; otherwise report
      completion without committing. Progress is present for policy-required
      cases and optional for allowed durable outcomes. Stop at accepted scope.
    exit_signal: complete
  2:
    id: E2
    condition: flagged
    description: >-
      The cycle completed but with notable issues. Possible causes:
      verification passed but with warnings, the completed work is narrower
      than intended due to scope reduction, or durable discoveries recorded in
      progress state suggest the next cycle may face blockers.
    exit_signal: flagged
  3:
    id: E3
    condition: stuck
    description: >-
      Cannot complete a cycle because VISION.md does not exist and the
      vision bootstrap cannot proceed without the user, the scoped work
      is blocked, or required verification is broken and cannot be fixed
      within the cycle's scope.
    exit_signal: stuck
  4:
    id: E4
    condition: waiting
    description: >-
      The project has no VISION.md and no codebase to infer direction from,
      or the user's explicit instruction is too ambiguous to act on without
      clarification.
    exit_signal: waiting
