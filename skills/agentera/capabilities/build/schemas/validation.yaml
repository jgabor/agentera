VALIDATION:
  1:
    id: V1
    rule: verified_field_mandatory
    description: >-
      Every progress entity record MUST have a verified field. The field
      carries either observed output from the primary entrypoint, an allowlisted
      N/A tag, or a free-form rationale of at least 8 words.
    severity: critical
    checks:
      - "Every cycle entry has a verified field"
      - "verified field is not empty"
  2:
    id: V2
    rule: one_cycle_per_invocation
    description: >-
      Build executes exactly one cycle per invocation. After logging (Step 8),
      the capability MUST stop. Multiple cycles require separate invocations or
      an explicit user request.
    severity: critical
    checks:
      - "Only one progress entity is appended per invocation"
  3:
    id: V3
    rule: no_remote_push
    description: >-
      Build MUST NOT push to any remote repository. All commits are local
      only. Remote operations require explicit user instruction outside this
      capability.
    severity: critical
    checks:
      - "No git push commands issued"
  4:
    id: V4
    rule: vision_readonly_during_cycle
    description: >-
      The canonical vision artifact MUST NOT be modified during a cycle. It may only be written
      during a vision bootstrap.
    severity: critical
    checks:
      - "Vision artifact not modified outside brainstorm"
  5:
    id: V5
    rule: consecutive_failure_guard
    description: >-
      If the last 3 bounded progress records all report failed cycles, build
      MUST stop and surface the pattern to the user. Do not attempt a 4th
      consecutive cycle on the same failing problem.
    severity: critical
    checks:
      - "Failure pattern checked before cycle start"
  6:
    id: V6
    rule: artifact_path_resolution
    description: >-
      Entity state MUST use exact/list CLI reads and typed writers discovered by
      `agentera state <artifact> explain`. Check .agentera/docs.yaml only for
      intentional singleton path overrides.
    severity: warning
    checks:
      - "Entity files are not read or edited directly"
      - "docs.yaml checked before singleton artifact access"
  7:
    id: V7
    rule: execution_context_first
    description: >-
      Build startup SHOULD begin from `agentera prime --context build
      --format json` and consume complete execution_context
      state before direct reads of plan, progress, TODO, docs, health,
      decisions, changelog, vision, profile, or design artifacts.
    severity: warning
    checks:
      - "execution_context requested through supported prime --context seam"
      - "complete execution_context used before direct startup artifact reads"
  8:
    id: V8
    rule: fallback_before_raw
    description: >-
      When execution_context is incomplete or caveated, Build MUST run listed
      CLI fallback commands before any last-resort raw artifact diagnostic and
      MUST preserve caveats in cycle reporting.
    severity: critical
    checks:
      - "CLI fallback commands run before raw artifact diagnostics"
      - "execution_context caveats preserved in progress or cycle report"
  9:
    id: V9
    rule: context_generation_readonly
    description: >-
      Generating execution_context is read-only. It MUST NOT refresh profile or
      installed app state, edit vision or objective state, spawn workers, commit,
      push, tag, publish, or introduce unsupported capability-name CLI commands.
    severity: critical
    checks:
      - "No protected state mutation during context generation"
      - "No unsupported `agentera build` command introduced"
  10:
    id: V10
    rule: satisfaction_authority_boundary
    description: >-
      When Build touches decision satisfaction, it may mark provisional
      satisfaction with evidence but MUST NOT user-confirm satisfaction. Missing,
      compacted, open, provisional, or review-needed satisfaction state remains a
      caveat and review pressure; automation must not reconstruct hidden outcomes
      or claim it proved user intent.
    severity: critical
    checks:
      - "Provisional satisfaction requires evidence"
      - "Only the user confirms final satisfaction"
      - "Missing or compacted satisfaction caveats are preserved"
  11:
    id: V11
    rule: sanitized_profile_grounding
    description: >-
      Build MUST ground only from the `content` returned by `agentera report
      profile-grounding --format json`; it MUST NOT direct-read PROFILE.md.
    severity: critical
    checks:
      - "Sanitized grounding command used after prime startup"
      - "Raw profile path not read"
  12:
    id: V12
    rule: governed_glossary_advice
    description: >-
      At initial meaning-sensitive cycle intent and later user-authored changes
      or clarification answers that can alter intent, Build MUST request bounded
      advice through `agentera report glossary-advice --input REQUEST --format
      json`. Unchanged replay, unrelated turns, rendering, and tool output MUST
      NOT refresh advice.
    severity: critical
    checks:
      - "Exact project authority or proven-gap personal fallback grounds intent"
      - "Governed changes refresh only the affected meaning"
      - "Incidental turns and unchanged replay do not refresh"
  13:
    id: V13
    rule: glossary_review_and_autonomy
    description: >-
      Interactive Build MUST ask one focused clarification before disputed
      meaning-sensitive reliance whenever review is required. If autonomous Build
      cannot pause, it MUST avoid the disputed meaning, proceed conservatively
      only where safe, and append one idempotent privacy-safe glossary_caveat
      lifecycle envelope through the typed progress writer.
    severity: critical
    checks:
      - "Clarification precedes meaning-sensitive execution and re-evaluates only the affected meaning"
      - "Autonomous work does not assume disputed meaning"
      - "Current, resolved, and superseded caveat events obey opaque identity lifecycle"
  14:
    id: V14
    rule: glossary_publication_isolation
    description: >-
      Advice, tension, clarification, and progress caveat lifecycle MUST NOT call
      `agentera state glossary publish`, create or reuse approval, substitute for
      digest-bound user confirmation, satisfy decisions or plan state, or grant
      Discuss or Audit publication authority.
    severity: critical
    checks:
      - "Advice and caveat paths perform zero glossary publication writes"
      - "Only separately supplied digest-confirmed publication retains Build authority"
