ARTIFACTS:
  1:
    id: A1
    artifact: vision
    local_role: consumes
    description: >-
      Status reads this for the briefing's project context.
  2:
    id: A2
    artifact: decisions
    local_role: consumes
    description: >-
      Status reads this to identify unresolved decisions requiring follow-up.
  3:
    id: A3
    artifact: plan
    local_role: consumes
    description: >-
      Status reads this to identify the next executable task and plan progress.
  4:
    id: A4
    artifact: progress
    local_role: consumes
    description: >-
      Status reads this for the briefing's "what shipped" context.
  5:
    id: A5
    artifact: todo
    local_role: consumes
    description: >-
      Status reads this to identify high-severity open items for routing.
  6:
    id: A6
    artifact: health
    local_role: consumes
    description: >-
      Status reads this for the health status line and attention items.
  7:
    id: A7
    artifact: objective
    local_role: consumes
    description: >-
      Status reads this to check for active optimization objectives.
  8:
    id: A8
    artifact: experiments
    local_role: consumes
    description: >-
      Status reads this alongside the active optimization target to determine
      optimization status.
  9:
    id: A9
    artifact: docs
    local_role: consumes
    description: >-
      Status reads this first to resolve project-local artifact mappings before
      reading other artifacts.
  10:
    id: A10
    artifact: design
    local_role: consumes
    description: >-
      Status reads this for project design status metadata (exists, stale, missing).
      Suite chrome styling uses protocol.yaml, prime --context capability prose,
      and v2 app-home DESIGN.md when present — not the host project's design
      artifact.
  11:
    id: A11
    artifact: profile
    local_role: consumes
    description: >-
      Status reports profile validity as valid, absent, or repair_needed and
      keeps freshness separate without exposing profile paths or content.
  12:
    id: A12
    artifact: glossary
    local_role: consumes
    description: >-
      Prime consumes only the bounded glossary caveat projection produced by
      the active runtime integration. It does not read glossary entries,
      resolve advice, publish terminology, or expose personal definitions.
