EXIT_CONDITIONS:
  1:
    id: E1
    condition: complete
    description: >-
      Startup is neither blocked nor degraded and no suggestion awaits the
      user: nothing is suggested, or the user accepted and the capability
      started.
    exit_signal: complete
  2:
    id: E2
    condition: flagged
    description: >-
      The startup outcome is degraded. The dashboard is delivered and each
      degraded condition is named.
    exit_signal: flagged
  3:
    id: E3
    condition: stuck
    description: >-
      The startup outcome is blocked. Status skips the dashboard and reports
      the startup reason with its recovery command.
    exit_signal: stuck
  4:
    id: E4
    condition: waiting
    description: >-
      Startup is neither blocked nor degraded and a suggestion awaits the
      user's answer. The waiting bullet asks whether to start it.
    exit_signal: waiting
