ARTIFACTS:
  1:
    id: A1
    artifact: objective
    local_role: produces_and_consumes
    description: >-
      Optimization target definition: metric, current value, target, constraints,
      scope, and measurement approach. Activate only after approval of the
      concrete setup, baseline and named experiment package. Typed objective
      writers own setup, approved refinement and canonical closure.
  2:
    id: A2
    artifact: optimize_harness
    local_role: produces
    description: >-
      Prefer existing qualified measurement tooling. Create a structured JSON
      eval script only when needed and included in the approved package. Its
      declared file owner remains unchanged; the judge is fixed during experiments.
  3:
    id: A3
    artifact: experiments
    local_role: produces_and_consumes
    description: >-
      Typed, bounded actionable records: named hypothesis, actual method/change,
      before/after evidence, regression and constraint results, status and conclusion.
      No invented experiment when baseline already meets target. Reuse exact
      identities and writer replay after interruption, without duplicate records.
  4:
    id: A4
    artifact: progress
    local_role: consumes
    description: >-
      Relevant prior work context only. Repeated experiment failures are assessed
      from objective-scoped experiment history, not unrelated progress entries.
  5:
    id: A5
    artifact: todo
    local_role: produces
    description: >-
      Any justified failure-pattern follow-up requires an approved write through
      the TODO owner; experiment approval does not imply additional TODO writes.
  6:
    id: A6
    artifact: decisions
    local_role: consumes
    description: >-
      Optimize reads this during Orient for context on prior deliberations
      about the optimization objective.
  7:
    id: A7
    artifact: profile
    local_role: consumes
    description: >-
      Available preferences inform a proposal but never relax approved constraints.
      Missing profile means no persona grounding, not permission to refresh or
      acquire profile/history data.
  8:
    id: A8
    artifact: docs
    local_role: consumes
    description: >-
      Optimize reads this first to resolve project-local artifact mappings
      before accessing other artifacts.
  9:
    id: A9
    artifact: benchmark_context
    local_role: consumes
    description: >-
      CLI-provided startup benchmark summary from `npx -y agentera@next prime --context
      optimize`. Optimize consumes this before any direct
      latest-report.json, latest-report.md, or runs.jsonl diagnostic read.
