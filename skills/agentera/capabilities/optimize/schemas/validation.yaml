VALIDATION:
  1:
    id: V1
    rule: harness_locked_during_cycle
    description: >-
      The eval harness MUST NOT be modified during an optimization cycle.
      Setup or material refinement requires approval of a concrete package.
      The approved measurement method remains fixed during the experiment.
    severity: critical
    checks:
      - "Approved judge and comparable measurement conditions remain fixed"
  2:
    id: V2
    rule: regression_first
    description: >-
      The regression check MUST pass before the eval harness runs. If the
      project's test/build/lint suite fails, the experiment is automatically
      discarded. Metric improvement does not override regression failure.
    severity: critical
    checks:
      - "Regression check runs before metric measurement"
      - "Regression failure results in experiment discard"
  3:
    id: V3
    rule: objective_readonly_during_cycle
    description: >-
      Objective target, method, scope and limits MUST remain fixed during the
      experiment. Material changes need a revised proposal and fresh approval.
      Canonical closure uses the typed objective owner after verified success.
    severity: critical
    checks:
      - "Typed objective owner performs closure; no direct entity edits"
  4:
    id: V4
    rule: one_experiment_per_invocation
    description: >-
      Each approved package permits at most the one named experiment. Stop
      even if blocked. Verified already-met baseline needs no code changes
      or invented experiment. A next hypothesis requires fresh authorization.
    severity: critical
    checks:
      - "At most one named non-baseline experiment; the verified baseline record may precede it"
  5:
    id: V5
    rule: decision_gate_both_conditions
    description: >-
      An experiment is kept only when ALL conditions are true:
      (1) regression check passed, and (2) metric improved in the declared
      direction, and (3) all approved constraints pass. Otherwise discard only
      owned unsuccessful experimental changes, preserving unrelated user work.
    severity: critical
    checks:
      - "Kept experiments have regression pass, strict improvement and constraint pass"
      - "Discard preserves unrelated work; unsafe cleanup pauses"
  6:
    id: V6
    rule: exit_marker_required
    description: >-
      Every optimize invocation MUST emit an exit marker. The marker uses
      the canonical glyph ⎘ (SG7) in the format ⎘ optimize · <status>
      where status is one of EX1-EX4.
    severity: critical
    checks:
      - "Exit marker present after experiment"
      - "Exit marker uses glyph ⎘ (SG7)"
      - "Exit marker status is one of complete, flagged, stuck, waiting"
  7:
    id: V7
    rule: benchmark_context_first
    description: >-
      For benchmark-oriented startup, Optimize MUST start from `npx -y agentera@next prime
      --context optimize` and consume complete
      benchmark_context before direct retained benchmark file reads. Direct
      latest-report.json, latest-report.md, or runs.jsonl reads are last-resort
      diagnostics only when the CLI context is incomplete.
    severity: critical
    checks:
      - "Optimize startup uses benchmark_context before direct retained benchmark files"
      - "Incomplete benchmark_context follows listed CLI fallback and manual refresh guidance"
      - "Direct benchmark file reads are treated as last-resort diagnostics"
  8:
    id: V8
    rule: benchmark_caveat_preservation
    description: >-
      Benchmark caveats from benchmark_context MUST be preserved when Optimize
      reports measurement evidence. Agents must not hide, upgrade, reconstruct,
      or infer away caveats for manual-only execution, missing local history,
      runtime coverage degradation, missing token estimates, non-comparable
      previous rows, or privacy boundaries.
    severity: critical
    checks:
      - "Manual-only benchmark execution caveats are reported"
      - "Missing or malformed retained evidence remains incomplete"
      - "Runtime coverage, token-impact, comparison, and privacy caveats are preserved"
  9:
    id: V9
    rule: setup_package_approval
    description: >-
      Before active setup, baseline or code effects, show objective, target,
      exact measurement method, ONE NAMED hypothesis, scope, resource limits
      and keep/discard rule. One explicit host approval covers that package.
      Decline or silence activates nothing. This is host guidance, not CLI
      enforcement against a malicious or noncompliant host.
    severity: critical
    checks:
      - "Proposal and explicit approval precede active setup and code changes"
      - "Refusal or silence leaves active setup and code unchanged"
      - "Material changes require fresh approval; no Git, install or profile/history permission implied"
  10:
    id: V10
    rule: useful_retention_and_verified_resume
    description: >-
      Retain relevant objectives, usable tooling and bounded actionable records,
      not failed code, duplicate harnesses, abandoned branches or incidental logs.
      Resume unchanged known approval using valid matching evidence and exact
      saved identities without duplicate writes or mechanical reapproval.
      Missing approval, invalid evidence or drift stops dependent work. Unclear
      relevance or unsafe cleanup is surfaced; obsolete setup retires through
      its owner without silently deleting history.
    severity: critical
    checks:
      - "Resume reports completed/remaining work and reuses only matching evidence"
      - "Missing approval or material drift stops for bounded recovery"
      - "Replay uses existing per-operation writer semantics, not a global batch"
