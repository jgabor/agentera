EXIT_CONDITIONS:
  1:
    id: E1
    condition: complete
    description: >-
      The one approved named experiment completed and its truthful record was
      published through the typed owner, or verified baseline already met the
      target and typed objective closure completed without invented experiments.
    exit_signal: complete
  2:
    id: E2
    condition: flagged
    description: >-
      Discard, regression/constraint failure, plateau, unsafe cleanup or incomplete
      saves. List each concern and remaining work; no replacement experiment.
    exit_signal: flagged
  3:
    id: E3
    condition: stuck
    description: >-
      Required measurement or regression tooling is unavailable, evidence is
      invalid or the named hypothesis is blocked. Stop for bounded recovery;
      changed measurement or hypothesis requires a revised approved package.
    exit_signal: stuck
  4:
    id: E4
    condition: waiting
    description: >-
      Proposal awaits explicit approval, user declines, scope is ambiguous or
      approval cannot be established. No active setup or code changes.
    exit_signal: waiting
