ARTIFACTS:
  1:
    id: A1
    artifact: decisions
    local_role: produces_and_consumes
    description: >-
      Reasoning trail with confidence labels. Discuss reads existing decisions
      through bounded `npx -y agentera@next state decisions list --limit 20`
       discovery plus exact `npx -y agentera@next state decisions get --id ID`
      retrieval and its source_contract to avoid re-deliberation, and writes new decision entries with confidence
      (DL1 firm, DL2 provisional, DL3 exploratory). Compact older entries by
      applying schema COMPACTION rules; incomplete compacted entries are
      caveated context, not a reason for historical reconstruction during
      normal deliberation.
  2:
    id: A2
    artifact: vision
    local_role: produces_and_consumes
    description: >-
      Discuss may update project direction only with explicit user
      approval of the exact named vision patch as an explicit vision task when
      a decision feeds into project direction. Discuss invocation alone does not
      grant permission. Resolve mapping/ownership and read policy before reliance.
  3:
    id: A3
    artifact: todo
    local_role: produces_and_consumes
    description: >-
      Discuss may add tech debt items surfaced during deliberation only with
      explicit user confirmation. Severity per protocol SI1-SI4.
  4:
    id: A4
    artifact: objective
    local_role: produces_and_consumes
    description: >-
      Discuss may write optimization decisions only with explicit user
      confirmation when a decision feeds into what to optimize.
  5:
    id: A5
    artifact: profile
    local_role: consumes
    description: >-
      Discuss reads only sanitized non-glossary content from `npx -y agentera@next report
      profile-grounding` at session start. It never direct-reads
      the profile path. It uses content only when the shared validity object is
      valid; absent or repair-needed results fail closed with exact recovery.
  6:
    id: A6
    artifact: docs
    local_role: consumes
    description: >-
      Discuss reads this first to resolve project-local artifact mappings.
  7:
    id: A7
    artifact: glossary
    local_role: consumes
    description: >-
      Discuss consumes bounded read-only terminology advice at governed
      meaning-sensitive events. It never reads the glossary path directly,
      publishes project terminology, or mutates personal profile state.
  8:
    id: A8
    artifact: plan
    local_role: produces_and_consumes
    description: >-
      Read relevant affected commitments through discovered bounded CLI readers.
      Only directly justified exact displayed approved patches use the existing
      plan writer and flags. Saving does not authorize execution or task completion.
  9:
    id: A9
    artifact: design
    local_role: produces_and_consumes
    description: >-
      Relevant design constraints participate in protocol OPERATING_RULES coherence.
      Resolve mapped ownership and read policy; surface missing authority rather
      than inventing a reader or generic singleton writer. Only exact displayed
      approved owner-scoped patches may change design; preserve unrelated content.
