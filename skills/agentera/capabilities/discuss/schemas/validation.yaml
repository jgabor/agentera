VALIDATION:
  1:
    id: V1
    rule: one_question_per_turn
    description: >-
      Discuss MUST ask exactly one question per turn. Compound questions
      are not allowed. Every question MUST include a Done option.
    severity: critical
    checks:
      - "At most one question per response"
      - "Done option present"
  2:
    id: V2
    rule: user_approval_for_artifact_writes
    description: >-
      Discuss MUST NOT modify vision, objective, or todo artifacts (the
      protected_write_boundaries) without explicit user confirmation. Present
      drafts and get approval.
    severity: critical
    checks:
      - "User confirmation obtained before writing to vision, objective, or todo artifacts"
  3:
    id: V3
    rule: decision_confidence_required
    description: >-
      Every decision entry MUST have a Confidence field with one of the
      protocol-defined labels: firm (DL1), provisional (DL2), or
      exploratory (DL3).
    severity: critical
    checks:
      - "Decision entry has Confidence field"
      - "Confidence value is one of firm, provisional, exploratory"
  4:
    id: V4
    rule: preserved_decision_fields
    description: >-
      Decision entries MUST preserve the canonical top-level fields:
      Question, Context, Alternatives, Choice, Reasoning, Confidence,
      Feeds into. Win conditions stay inside Alternatives bullets.
    severity: critical
    checks:
      - "Decision entry has all canonical fields"
  5:
    id: V5
    rule: no_implementation
    description: >-
      Discuss MUST NOT skip to implementation. It deliberates; other
      capabilities build. If the user wants to build, route to the
      appropriate capability.
    severity: critical
    checks:
      - "No code changes made during deliberation"
  6:
    id: V6
    rule: red_flag_phrasing_banned
    description: >-
      Red-flag phrasing that weakens the challenge is banned: "That sounds
      reasonable", "Either way is fine", "It depends" without naming the
      variable, "There is no wrong answer here", "Both options are valid"
      when one conflicts with constraints.
    severity: warning
    checks:
      - "No red-flag phrases in output"
  7:
    id: V7
    rule: satisfaction_authority_boundary
    description: >-
      When Discuss touches decision satisfaction, it may capture provisional
      satisfaction with evidence but MUST NOT user-confirm satisfaction unless the
      user explicitly confirms it. Missing, compacted, open, provisional, or
      review-needed satisfaction state remains a caveat and review pressure;
      automation must not reconstruct hidden outcomes or claim it proved user
      intent.
    severity: critical
    checks:
      - "Provisional satisfaction requires evidence"
      - "Only the user confirms final satisfaction"
      - "Missing or compacted satisfaction caveats are preserved"
  8:
    id: V8
    rule: sanitized_profile_grounding
    description: >-
      Discuss MUST ground only from the `content` returned by `npx -y agentera@next report
      profile-grounding --format json` when shared validity is valid; it MUST
      preserve absent/repair-needed recovery and MUST NOT direct-read PROFILE.md.
    severity: critical
    checks:
      - "Sanitized grounding command used at session start"
      - "Prime and report validity objects agree before content use"
      - "Raw profile path not read"
  9:
    id: V9
    rule: governed_glossary_advice_events
    description: >-
      Discuss MUST consume `capability_context.glossary_advice` from `npx -y
      agentera@next prime --context discuss --term-input <file|-> --format json`
      for initial meaning-sensitive input without a second report. Later
      user-authored premise changes use compact `report glossary-advice
      --term-input`, while structured host-review clarification uses `--input`.
      It MUST NOT invoke advice for unchanged replay, rendering,
      unrelated turns, tool output, background rereads, or Done-only control,
      and MUST NOT use an unbounded or persistent transcript scan.
    severity: critical
    checks:
      - "Initial advice comes from prime with no second initial report"
      - "Changed meaning uses term-input and host review uses structured input"
      - "Incidental, unchanged, and Done-only events do not refresh advice"
      - "Only current user-authored meaning-sensitive input is inspected"
  10:
    id: V10
    rule: glossary_review_before_reliance
    description: >-
      When advice requires inferred-equivalence review, Discuss MUST ask one
      focused clarification with Done before meaning-sensitive reasoning or
      decision framing relies on either meaning. It MUST NOT silently infer
      equivalence, and the clarification MUST NOT count as decision confirmation.
    severity: critical
    checks:
      - "Focused review question precedes reliance"
      - "One-question-per-turn and Done behavior are preserved"
      - "Clarification is not decision confirmation"
  11:
    id: V11
    rule: glossary_authority_and_disclosure
    description: >-
      Discuss MUST use only the transient applicable meaning and owner. Project
      meaning governs a divergent exact collision and the divergence appears as
      a concise scratchpad tension or Crux; Discuss MUST NOT ask the user to
      choose project versus personal authority or quote unrelated entries.
    severity: critical
    checks:
      - "Applicable project or proven personal fallback meaning is used"
      - "Divergence appears as tension or Crux without an authority-choice question"
      - "Unrelated glossary content is not disclosed"
  12:
    id: V12
    rule: glossary_consumer_mutation_isolation
    description: >-
      Advice, divergence, and consumer clarification are transient. Discuss MUST
      NOT write glossary, approval, publication consent, progress caveat, plan
      conflict, or decision conflict state, and MUST NOT call glossary publish.
      Unavailable or no-applicable advice adds no glossary facts.
    severity: critical
    checks:
      - "No glossary or consumer-caveat mutation occurs"
      - "No approval, consent, or conflict bookkeeping occurs"
      - "Unavailable advice does not fabricate glossary grounding"
