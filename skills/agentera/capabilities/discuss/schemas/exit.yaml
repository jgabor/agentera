EXIT_CONDITIONS:
  1:
    id: E1
    condition: complete
    description: >-
      Deliberation reached a conclusion the user chose to act on; any
      required exact approved changes were verified through their owners, and
      decision confidence was captured. Refusal saves nothing. Failed or
      unverified required saves are INCOMPLETE, never complete.
    exit_signal: complete
  2:
    id: E2
    condition: flagged
    description: >-
      Deliberation concluded but the decision remains unresolved or
      provisional: the user wrapped up without a clear choice, significant
      tensions could not be resolved, or the conclusion contradicts prior
      affected commitments without explicit acknowledgment. Missing authority
      stays an explicit gap; intentional pivots or exceptions record their scope.
    exit_signal: flagged
  3:
    id: E3
    condition: stuck
    description: >-
      Cannot proceed because the user's topic requires external research
      the capability cannot access, or writing to an artifact was attempted
      but failed. Retain verified saves, stop dependent writes, report saved and
      remaining work as INCOMPLETE, and follow native recovery before continuation.
    exit_signal: stuck
  4:
    id: E4
    condition: waiting
    description: >-
      No topic was provided and the user has not responded to "what's on
      your mind?", or the deliberation surfaced that a different capability
      is needed first and the user has not confirmed how to proceed.
    exit_signal: waiting
