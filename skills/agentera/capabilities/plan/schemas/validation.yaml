VALIDATION:
  1:
    id: V1
    rule: behavioral_acceptance_criteria
    description: >-
      All acceptance criteria MUST be behavioral (Given/When/Then format)
      and MUST NOT reference implementation details (class names, API
      endpoints, database tables, function names, line numbers).
    severity: critical
    checks:
      - "Acceptance criteria use Given/When/Then format"
      - "No implementation details in acceptance criteria"
  2:
    id: V2
    rule: coherent_lifecycle_scope
    description: >-
      Full plans MUST keep all tasks within a coherent lifecycle boundary.
      Split plans only when work crosses a real lifecycle or coherence boundary.
    severity: critical
    checks:
      - "Tasks stay within one coherent lifecycle boundary"
      - "Splits follow real lifecycle or coherence boundaries"
  3:
    id: V3
    rule: adversarial_review_required
    description: >-
      Full plans MUST undergo adversarial review. The critic MUST find at
      least one issue. "Looks good" is not acceptable. Skip level and
      light plans are exempt.
    severity: critical
    checks:
      - "Adversarial review ran for full plans"
  4:
    id: V4
    rule: plan_final_state_sync
    description: >-
      Every full plan MUST end with a "final state sync" task that depends
      on all prior tasks. This ensures aggregate plan-level CHANGELOG.md,
      PROGRESS.md, and TODO.md updates.
    severity: critical
    checks:
      - "Full plan has final state sync task as last task"
  5:
    id: V5
    rule: test_proportionality_target
    description: >-
      Tasks that include writing tests MUST have a proportionality target
      in their acceptance criteria. Default: one pass + one fail per
      testable unit. Override only with explicit rationale.
    severity: warning
    checks:
      - "Test tasks state proportionality target"
  6:
    id: V6
    rule: skip_level_for_trivial_work
    description: >-
      Plan MUST detect skip level for trivial work (single-file change,
      localized defect fix, or config tweak that touches no shared
      abstraction) and route directly to /build without producing a
      PLAN.md. LOC count is not a skip signal because small changes to
      shared exports can ripple across many consumers.
    severity: critical
    checks:
      - "Trivial work routed to /build without plan"
  7:
    id: V7
    rule: full_plan_unknowns_required
    description: >-
      Every full plan MUST surface at least one planning-time known-unknown
      in the `unknowns:` field. Each entry MUST include question,
      affects_task, and resolve_by. Skip level and light plans are exempt
      because they do not decompose work into interdependent tasks.
    severity: warning
    checks:
      - "Full plans have a non-empty `unknowns:` list"
      - "Each unknown entry has question, affects_task, resolve_by fields"
  8:
    id: V8
    rule: adversarial_review_dismissals_persisted
    description: >-
      Full plans MUST persist dismissed adversarial-review findings in the
      artifact's `rejected:` field, each with issue text and rationale, so
      downstream consumers (build, orchestrate, audit) inherit the
      adjudication rather than relitigating. V3 enforces the review ran;
      V8 enforces the dismissal provenance persists.
    severity: warning
    checks:
      - "Full plans with dismissed critic findings have `rejected:` entries"
      - "Each rejection has issue and rationale fields"
