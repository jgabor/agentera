ARTIFACTS:
  1:
    id: A1
    artifact: plan
    local_role: produces_and_consumes
    description: >-
      Current plan with tasks, dependencies, and behavioral acceptance criteria.
      Its active position is derived from the docs-mapped current-plan path,
      not persisted lifecycle status. Plan writes this during the planning
      session and may read existing plan context before replacing or refining it.
  2:
    id: A2
    artifact: plan_archive
    local_role: produces
    description: >-
      Immutable, non-executable history created when a plan is complete or
      explicitly force-archived. Forced archival preserves an unfinished
      plan's open status rather than claiming completion.
  3:
    id: A3
    artifact: vision
    local_role: consumes
    description: >-
      Plan reads this during Orient to understand project direction and
      align the plan with the vision.
  4:
    id: A4
    artifact: decisions
    local_role: consumes
    description: >-
      Plan reads firm (DL1) entries only as hard constraints for planning.
  5:
    id: A5
    artifact: todo
    local_role: consumes
    description: >-
      Plan reads this to identify related known
      issues that the plan should address.
  6:
    id: A6
    artifact: health
    local_role: consumes
    description: >-
      Plan reads this to factor structural issues into the plan.
  7:
    id: A7
    artifact: progress
    local_role: consumes
    description: >-
      Plan reads this to understand what was built recently.
  8:
    id: A8
    artifact: profile
    local_role: consumes
    description: >-
      Plan reads only sanitized non-glossary content from `npx -y agentera@next report
      profile-grounding --format json` to calibrate planning depth and pattern
      preferences. It never direct-reads the profile path and uses content only
      for shared validity `valid`; absent and repair-needed results fail closed.
  9:
    id: A9
    artifact: docs
    local_role: consumes
    description: >-
      Plan reads this first to resolve project-local artifact mappings and
      reads the versioning block for version bump task generation.
