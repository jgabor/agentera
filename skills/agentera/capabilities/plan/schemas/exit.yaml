EXIT_CONDITIONS:
  1:
    id: E1
    condition: complete
    description: >-
      A plan was saved after a separate worker reviewed it, or a TODO was
      saved, or the work was routed to build. Each write was reported with
      its undo, and the user started execution or chose to stop.
    exit_signal: complete
  2:
    id: E2
    condition: flagged
    description: >-
      Saved with caveats: a self-review instead of a separate worker,
      dismissed critic findings, unknowns still open at handoff, or a scope
      larger than ideal.
    exit_signal: flagged
  3:
    id: E3
    condition: stuck
    description: >-
      The work is too ambiguous to decompose, required context contradicts
      itself, or a write failed.
    exit_signal: stuck
  4:
    id: E4
    condition: waiting
    description: >-
      No topic and no answer yet, acceptance criteria need the user's input,
      or the user must decide whether to replace an open plan.
    exit_signal: waiting
