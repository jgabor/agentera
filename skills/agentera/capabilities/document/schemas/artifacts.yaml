ARTIFACTS:
  1:
    id: A1
    artifact: docs
    local_role: produces_and_consumes
    description: >-
      Documentation contract with conventions, artifact mapping, and
      documentation inventory. Conventions and project-local mappings remain
      separately approved singleton policy. Inventory entries use typed docs
      list/get/create/update interfaces; update replaces a complete record by
      bare ID, not a partial patch. Track current/stale/missing/intent/generated
      from observed results, without directly editing entity files or adding
      inventory to the mapping singleton. During
      closeout, Document consumes docs state through CLI `closeout_context`;
      raw reads are diagnostic-only for corruption or CLI-defect investigation.
  2:
    id: A2
    artifact: vision
    local_role: consumes
    description: >-
      Document reads this to understand who the documentation is for
      and what tone to use.
  3:
    id: A3
    artifact: progress
    local_role: consumes
    description: >-
      Document reads this during explore-and-generate mode to understand
      recent project context. During closeout, latest progress evidence and
      verification pointers are consumed through CLI `closeout_context`, then
      bounded `npx -y agentera@next state progress list --limit 20` discovery
       or exact `state progress get --id ID` retrieval. Raw reads are
      diagnostic-only for corruption or CLI-defect investigation.
  4:
    id: A4
    artifact: decisions
    local_role: consumes
    description: >-
      Document reads this during explore-and-generate mode for project
      context and decision awareness through bounded `npx -y agentera@next state decisions
      list --limit 20` discovery or exact `state decisions get
       --id ID` retrieval. Raw reads are diagnostic-only for corruption or
      CLI-defect investigation.
  5:
    id: A5
    artifact: health
    local_role: consumes
    description: >-
      Document reads this to discover documentation gaps surfaced during health
      audits through bounded `npx -y agentera@next state health list --limit 20`
      discovery or exact `state health get --id ID` retrieval. Raw reads
      are diagnostic-only for corruption or CLI-defect investigation.
  6:
    id: A6
    artifact: todo
    local_role: produces_and_consumes
    description: >-
      Document may write only when separately authorized to file work; a
      documentation discrepancy does not itself authorize TODO creation.
      Surface intent or unrelated findings separately instead. Reads for context;
      closeout blocker state is consumed through CLI `closeout_context` before
      any diagnostic-only raw TODO read.
  7:
    id: A7
    artifact: design
    local_role: consumes
    description: >-
      Document reads this to respect the declared aesthetic and voice
      when generating user-facing documentation.
  8:
    id: A8
    artifact: profile
    local_role: consumes
    description: >-
      Document reads this to calibrate documentation style preferences:
      detail level, tone, format.
  9:
    id: A9
    artifact: changelog
    local_role: consumes
    description: >-
      Document reads this during closeout synchronization through CLI
      `closeout_context` to preserve the changelog boundary and avoid inventing
      release, tag, publication, or remote state.
