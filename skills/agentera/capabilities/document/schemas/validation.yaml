VALIDATION:
  1:
    id: V1
    rule: user_approval_required
    description: >-
      Documentation MUST NOT be written or modified without explicit user
      approval. Apply protocol OPERATING_RULES: existing authorization for
      routine factual work covers one bounded in-scope patch set without
      per-finding questions or another draft confirmation. If approval is
      absent, disclose the factual changes, sources, paths, inventory updates
      and exclusions and obtain one explicit approval for that set. No, silence,
      planning-only requests or a changed disclosed set do not permit writes.
      New intent, policy and conventions still require their own approval.
    severity: critical
    checks:
      - "Existing factual-work approval carries through its bounded patch set"
      - "One disclosed set is approved when permission is still needed"
      - "No, silence, planning-only and changed-set cases do not infer consent"
  2:
    id: V2
    rule: dtc_code_wrong
    description: >-
      Documentation MUST NOT rewrite intended behavior or product policy
      merely to match broken code. Distinguish verified factual drift from
      uncertain intent. Surface policy, product-intent and unrelated findings
      separately; do not silently change them or create TODOs or other work
      without separate authorization.
    severity: critical
    checks:
      - "Docs not updated to match broken code"
      - "Intent and unrelated findings surfaced without automatic work creation"
  3:
    id: V3
    rule: evergreen_prose
    description: >-
      Documentation MUST be written as the intended steady state:
      evergreen and non-temporal. No changelogs, no "we recently added",
      no temporal language. Write as if the feature has always existed.
    severity: warning
    checks:
      - "No temporal language in documentation"
  4:
    id: V4
    rule: dry_across_docs
    description: >-
      Information MUST NOT be duplicated across doc files. Keep it DRY:
      reference, don't repeat. Each fact lives in one authoritative
      location and other docs link to it.
    severity: warning
    checks:
      - "No duplicated content across doc files"
  5:
    id: V5
    rule: verification_required
    description: >-
      In update-and-verify mode, every doc claim MUST be checked against
      current authoritative evidence without guessing public product promises.
      Check the applied patch set and report exact results and gaps. Use existing
      typed docs writers and read back affected inventory records; do not mark
      unverified claims current or invent project-wide audit/coverage metadata.
      Inventory writers do not themselves edit or verify referenced documents.
    severity: critical
    checks:
      - "All doc claims verified against code in update mode"
      - "Applied results and inventory status agree with observed verification"
      - "Inventory uses complete records through typed create/update, not singleton edits"
  6:
    id: V6
    rule: read_before_generate
    description: >-
      Documentation MUST NOT be auto-generated without reading the code
      it describes. Understanding precedes documentation.
    severity: critical
    checks:
      - "Source code read before generating documentation"
  7:
    id: V7
    rule: index_entry_brevity
    description: >-
      Each DOCS.md index entry description MUST be ≤15 words.
      Index entries are summaries, not documentation.
    severity: warning
    checks:
      - "Each index entry description ≤ 15 words"
  8:
    id: V8
    rule: exit_marker_required
    description: >-
      Every document invocation MUST emit an exit marker using the
      canonical glyph ▤ (SG8) in the format ▤ document · <status>
      where status is one of EX1-EX4.
    severity: critical
    checks:
      - "Exit marker present"
      - "Exit marker uses glyph ▤ (SG8)"
      - "Exit marker status is one of complete, flagged, stuck, waiting"
  9:
    id: V9
    rule: closeout_context_first
    description: >-
       During final synchronization, Document MUST use `npx -y agentera@next prime
       --context document` and its `closeout_context`
       before using bounded state list/get contracts for TODO, docs, changelog,
       or progress. Raw artifact access is diagnostic-only or a write target.
        Complete closeout context is the normal source for mappings, version
        policy, blockers, boundaries, progress evidence, benchmark evidence,
        caveats, fallback commands, raw-read policy, and completeness.
    severity: critical
    checks:
      - "Closeout starts from status capability context"
      - "Complete closeout_context is used before raw artifact reads"
      - "Completeness and non-empty evidence flags are preserved"
  10:
    id: V10
    rule: closeout_fallback_before_raw
    description: >-
       If closeout context is incomplete or caveated, Document MUST run the
       listed bounded CLI fallback commands before any diagnostic-only raw
       artifact read. No unsupported capability-name command or new closeout command may
        be introduced.
    severity: critical
    checks:
       - "Listed bounded CLI fallback commands run before diagnostic-only raw reads"
       - "Raw reads are diagnostic-only or write targets"
  11:
    id: V11
    rule: closeout_caveat_preservation
    description: >-
      Document MUST preserve closeout caveats about stale app/profile state,
      compacted or missing state, missing benchmark evidence, absent local
      metadata or tags, and unrecorded publication or remote state. Caveats must
      not be hidden, reconstructed, or converted into approval to refresh apps,
      profiles, vision, objective state, publication, push, or tags.
    severity: critical
    checks:
      - "State caveats are carried into closeout notes"
      - "Missing benchmark evidence remains caveated"
      - "Publication, remote, tag, app refresh, and profile refresh are not invented"
  12:
    id: V12
    rule: satisfaction_authority_boundary
    description: >-
      When Document touches decision satisfaction, it may record provisional
      satisfaction with evidence but MUST NOT user-confirm satisfaction. Missing,
      compacted, open, provisional, or review-needed satisfaction state remains a
      caveat and review pressure; automation must not reconstruct hidden outcomes
      or claim it proved user intent.
    severity: critical
    checks:
      - "Provisional satisfaction requires evidence"
      - "Only the user confirms final satisfaction"
      - "Missing or compacted satisfaction caveats are preserved"
