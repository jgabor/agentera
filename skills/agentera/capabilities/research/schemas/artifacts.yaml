ARTIFACTS:
  1:
    id: A1
    artifact: todo
    local_role: produces
    description: >-
      Open problems by severity. Research offers one approval for exact selected,
      deduplicated typed TODO records with severities mapped through the protocol.
      The existing batch writer binds preview/apply and supports unchanged replay.
      Filing starts no Build cycle and grants no code or vision approval.
  2:
    id: A2
    artifact: vision
    local_role: produces
    description: >-
      Research may refine project direction with user confirmation when the
      analysis shifts thinking about the project's direction.
  3:
    id: A3
    artifact: profile
    local_role: consumes
    description: >-
      Research reads the profile via research_context.profile from the prime
      context to weight applicability judgments. If missing, research proceeds
      without persona grounding.
