# Progress Artifact Schema
#
# Durable project-outcome log for build. A Build invocation can produce zero or
# one entry. The typed writer's progress_write_policy decides whether future
# work needs the outcome or a governed glossary caveat. Attempt-only evidence
# stays outside progress.
#
# The optional glossary_caveat envelope, Build writer, and bounded prime reader
# are active. Build remains the sole progress producer; Plan may only emit the
# bounded current writer intent for Build and never delivers or persists it in
# plan state. Prime projects generic review attention without lifecycle details.
#
# The active authority is one progress_cycle entity per writer-owned file.
# Protocol references:
#   phase: PH1-PH5 (protocol.yaml PHASES)
#   type: conventional commit prefix (feat/fix/docs/refactor/chore/test)

meta:
  name: progress
  version: "1.0.0"
  description: >-
    Durable project-outcome log. Produced by build. Consumed by capabilities
    that need recent project truth and verification evidence.
  artifact_type: agent_facing
  path: ".agentera/progress.yaml"
  authority: legacy_migration_input_only
  producer: build
  consumers: [document, status, audit, optimize, orchestrate, plan, build, vision, design]
  format: yaml

ENTITY_AUTHORITY:
  identity_fields: [id, artifact]
  artifact: progress
  boundary: progress_cycle
  retrieval:
    list: npx -y agentera@next state progress list
    get: npx -y agentera@next state progress get --id ID
  mutation: npx -y agentera@next state progress explain --verb append
  write_policy: input_schema.semantics.progress_write_policy
  direct_file_edits: forbidden
  legacy_schema_below: migration_input_only
  semantic_recency:
    primary: timestamp_desc
    same_minute: publication_order_desc
    final_fallback: opaque_id_asc_for_missing_or_duplicate_publication_order
    latest: first_full_progress_cycle_in_canonical_list_order
  publication_order:
    type: positive_safe_integer
    presence: optional_for_legacy_required_for_new_publications
    visibility: public_record_metadata
    owner: progress_writer
    assignment: max_valid_existing_plus_one_under_publication_lock
    caller_input: forbidden
    dry_run: omitted
    copy_and_restart: persisted_with_entity

GROUP_PREFIXES:
  BUDGET: PB
  COMPACTION: PX
  CYCLE: PR
  CONTEXT: PT
  GLOSSARY_CAVEAT: GC
  ARCHIVE: PA
  VALIDATION: PV

BUDGET:
  1:
    id: PB1
    scope: per_cycle_entry
    max_words: 500
    description: >-
      Maximum words per cycle entry. Budgets are guidelines, not hard
      blockers; a 510-word entry is fine, a 1200-word entry signals
      missing output constraints.
  2:
    id: PB2
    scope: full_file
    max_words: 3000
    description: >-
      Maximum words for the full file. If a write would exceed this
      budget, compact first (see COMPACTION group).

COMPACTION:
  1:
    id: PX1
    rule: lossless_projection
    description: >-
      The 10/40/50 values are current projection defaults, not deletion limits.
      Numbered archive records remain complete and unlimited.
  2:
    id: PX2
    full_detail:
      max_entries: 10
      selection: "10 most recent cycles"
      format: "Standard cycle entry format (all fields)"
    description: >-
      The 10 most recent cycles are kept in full detail with all fields.
  3:
    id: PX3
    one_line_archive:
      max_entries: 40
      selection: "Cycles 11 through 50"
      format: "Cycle N (YYYY-MM-DD): <=15-word summary"
      fields: [number, timestamp, summary]
    description: >-
      Cycles 11 through 50 are collapsed to one-line format under the
      archive section. One-line summaries preserve cycle number, date,
      and work-type, enough for trend analysis by consuming skills. Entries
      beyond the summary default are represented by omission metadata while
      their numbered archive records remain available.
  4:
    id: PX4
    omission:
      fields: [omitted, omitted_count, omission_reason, retrieval]
      reason: projection_capacity_or_byte_budget
    description: >-
      Omitted projection detail is never silently deleted or truncated. The
      numbered archive is the complete historical source and retrieval points
      use the direct state get contract.
  5:
    id: PX5
    trigger: "When build writes a new durable outcome entry"
    description: >-
      Compaction runs when the producing skill writes a new entry.
      If >10 full-detail entries exist and their numbered archives verify,
      collapse the oldest to one-line. If >40 summary entries exist, omit the
      oldest from this bounded projection with metadata; never delete its
      numbered archive record. Unverified entries remain full for recovery.
  6:
    id: PX6
    archive_section:
      heading: "Archived Cycles"
      placement: "Below recent cycles"
    description: >-
      Archive entries sit below the recent cycles section.

CYCLE:
  1:
    id: PR1
    field: number
    type: integer
    required: true
    description: >-
      Monotonically increasing cycle number. One greater than the
      highest cycle number in active and archived entries. Do not
      reuse or renumber except when repairing artifact corruption.
    validation:
      - "Must be a positive integer"
      - "Must be unique across active and archived entries"
      - "Must be one greater than the previous highest"
  2:
    id: PR2
    field: timestamp
    type: string
    format: "YYYY-MM-DD HH:MM"
    required: true
    description: "When the cycle was recorded."
    validation:
      - "Must match YYYY-MM-DD HH:MM format"
  3:
    id: PR3
    field: type
    type: string
    required: true
    description: >-
      Conventional commit prefix extracted from the work done.
      One of: feat, fix, docs, refactor, chore, test.
    validation:
      - "Must be one of: feat, fix, docs, refactor, chore, test"
  4:
    id: PR4
    field: phase
    type: string
    required: true
    description: >-
      Which ISS-19 phase the cycle belongs to. References protocol.yaml
      PHASES (PH1-PH5).
    protocol_ref: PHASES
    validation:
      - "Must be one of: envision, deliberate, plan, build, audit"
  5:
    id: PR5
    field: what
    type: string
    required: true
    description: "What was done in this cycle. Prose summary of work performed."
    validation:
      - "Non-empty string"
  6:
    id: PR6
    field: inspiration
    type: string
    required: false
    description: >-
      What prompted this cycle. References to active plan tasks,
      decisions, or conventions that drove the work.
  7:
    id: PR7
    field: discovered
    type: string
    required: false
    description: >-
      Unexpected findings during the cycle. Things learned that were
      not known before starting.
  8:
    id: PR8
    field: verified
    type: string
    required: false
    description: >-
      Evidence that the work was verified. Test commands run, validation
      passed, manual checks performed.
  9:
    id: PR9
    field: next
    type: string
    required: false
    description: >-
      What should happen next. Guidance for subsequent cycles.
      Explicit about scope boundaries to prevent scope creep.
  10:
    id: PR10
    field: context
    type: map
    required: true
    description: >-
      Context envelope capturing intent, constraints, unknowns, and
      scope for this cycle. Contains sub-fields defined in CONTEXT group.
  11:
    id: PR11
    field: glossary_caveat
    type: mapping
    required: false
    implementation_status: active_build
    authority: references/artifacts/glossary-entry-contract.yaml#consumer_boundary.autonomous_caveat
    description: >-
      Privacy-safe autonomous glossary-review lifecycle evidence. Build alone
      appends it through the typed progress writer. It is never glossary
      publication, decision approval, plan state, or a container for meanings,
      definitions, anchors, paths, raw sections, unrelated entries, or provenance.
  12:
    id: PR12
    field: publication_order
    type: integer
    required: false
    cli_owned: true
    description: >-
      Positive safe integer assigned by the progress writer under the publication
      lock. New full records use it to resolve equal-minute semantic recency.
      Legacy records may omit it; callers cannot supply or override it.
    validation:
      - "When present, must be a positive safe integer"
      - "Must be omitted from caller input and assigned by the CLI writer"

GLOSSARY_CAVEAT:
  schema_version: agentera.glossaryConsumerCaveat.v1
  implementation_status: active_build
  reader_status:
    prime: active
  envelope_validator: packages/cli/src/state/progressGlossaryCaveat.ts#validateProgressGlossaryCaveat
  lifecycle_validator: packages/cli/src/state/progressGlossaryCaveat.ts#glossaryCaveatLifecycleInvalidEntities
  allowed_current_pairs: references/artifacts/glossary-entry-contract.yaml#consumer_boundary.autonomous_caveat.allowed_current_pairs
  current_append:
    caller_fields: [event, reason, ownership_state]
    caller_fixed_values:
      event: current
    writer_fields: [caveat_id, capability, transition_id]
    writer_fixed_values:
      capability: build
      transition_id: null
    rule: >-
      The caller must submit event=current, reason, and ownership_state. The
      writer creates caveat_id, capability=build, and transition_id=null; it does
      not default the caller-owned event.
  fields:
    caveat_id:
      type: opaque_non_content_id
      required: true
    event:
      type: enum
      values: [current, resolved, superseded]
      required: true
    capability:
      type: enum
      values: [build]
      required: true
    reason:
      type: enum
      values: [inferred_equivalence, authority_unavailable, personal_input_unavailable]
      required: true
    ownership_state:
      type: enum
      values: [project_governs_exact, review_required, authority_unavailable]
      required: true
    transition_id:
      type: [opaque_non_content_id, "null"]
      required: true
  lifecycle: references/artifacts/glossary-entry-contract.yaml#consumer_boundary.autonomous_caveat.lifecycle
  prime_projection: references/artifacts/glossary-entry-contract.yaml#consumer_boundary.autonomous_caveat.prime_projection
  privacy: references/artifacts/glossary-entry-contract.yaml#consumer_boundary.disclosure.durable_surfaces

CONTEXT:
  1:
    id: PT1
    field: intent
    parent: CYCLE.context
    type: string
    required: true
    description: "What this cycle set out to accomplish."
  2:
    id: PT2
    field: constraints
    parent: CYCLE.context
    type: string
    required: false
    description: "Boundaries: what was explicitly out of scope or constrained."
  3:
    id: PT3
    field: unknowns
    parent: CYCLE.context
    type: string
    required: false
    description: "Things not known at cycle start. May be 'none'."
  4:
    id: PT4
    field: scope
    parent: CYCLE.context
    type: string
    required: false
    description: "Files and surfaces modified or affected."

ARCHIVE:
  1:
    id: PA1
    field: summary
    type: string
    required: true
    description: >-
      One-line archive entry for a compacted cycle. Format:
      'Cycle N (YYYY-MM-DD): <=15-word summary'.
      Preserves cycle number, date, and work-type for trend analysis.
    validation:
      - "Must include cycle number"
      - "Must include date in YYYY-MM-DD format"
      - "Summary portion must be <=15 words"

VALIDATION:
  1:
    id: PV1
    rule: unique_cycle_numbers
    severity: error
    description: >-
      Active cycle entries must have unique numbers and remain descending
      by cycle number, newest first. Do not reuse or renumber except when
      repairing artifact corruption.
    checks:
      - "All cycle numbers are unique across active and archived entries"
      - "Active entries are in descending order by cycle number"
  2:
    id: PV2
    rule: required_fields
    severity: error
    description: >-
      Each full-detail cycle entry must have: number, timestamp, type,
      phase, what, and context (with intent).
    checks:
      - "number is present and is a positive integer"
      - "timestamp is present and matches YYYY-MM-DD HH:MM"
      - "type is present and is a valid commit prefix"
      - "phase is present and is a valid phase name"
      - "what is present and non-empty"
      - "context is present with intent sub-field"
  3:
    id: PV3
    rule: compaction_thresholds
    severity: warning
    description: >-
      Warn if the file exceeds compaction thresholds: >10 full-detail
      entries or >40 one-line archive entries.
    checks:
      - "Full-detail entries <= 10"
      - "One-line archive entries <= 40"
      - "Total entries <= 50"
  4:
    id: PV4
    rule: word_budget
    severity: advisory
    description: >-
      Advisory check. Per-cycle entry should be <=500 words; full file
      should be <=3000 words. Budgets are guidelines, not hard blockers.
    checks:
      - "Per-cycle word count <= 500"
      - "Total file word count <= 3000"
