# Experiments Artifact Schema
#
# Experiment log maintained by optimize. Each experiment records hypothesis,
# method, metric results, kept/discarded status, and conclusions. Lives
# alongside OBJECTIVE.md in .agentera/optimize/<name>/.
#
# Structural pattern: UPPER_CASE groups with numbered entries and stable IDs,
# following capability_schema_contract.yaml and protocol.yaml conventions.
#
# Protocol references:
#   status visual tokens: VT1-VT3 (protocol.yaml VISUAL_TOKENS)
#   trend tokens: VT12-VT13 (protocol.yaml VISUAL_TOKENS)

meta:
  name: experiments
  version: "1.0.0"
  description: >-
    Experiment log for optimize objectives. Produced and consumed by optimize.
    Lives in .agentera/optimize/<name>/ alongside the objective.
  artifact_type: agent_facing
  path: ".agentera/optimize/<name>/experiments.yaml"
  producer: optimize
  consumers: [status, optimize]
  format: yaml

GROUP_PREFIXES:
  BUDGET: EB
  COMPACTION: EX_CMP
  EXPERIMENT: EX
  CLOSURE: EC
  ARCHIVE: EA
  PUBLICATION: EP
  RETRIEVAL: ER
  VALIDATION: EV

BUDGET:
  1:
    id: EB1
    scope: per_experiment_entry
    max_words: 300
    description: >-
      Maximum words per experiment entry. Budgets are guidelines, not
      hard blockers.
  2:
    id: EB2
    scope: full_file
    max_words: 2500
    description: >-
      Maximum words for the full file. If a write would exceed this
      budget, compact first (see COMPACTION group).

COMPACTION:
  1:
    id: EX_CMP1
    rule: uniform_10_40_50
    description: >-
      Growing artifacts follow a uniform 10/40/50 rule: 10 full-detail
      entries, 40 one-line archive entries, drop beyond 50 total.
  2:
    id: EX_CMP2
    full_detail:
      max_entries: 10
      selection: "10 most recent experiments"
      format: "Standard experiment entry format (all fields)"
    description: >-
      The 10 most recent experiments are kept in full detail with
      all fields.
  3:
    id: EX_CMP3
    one_line_archive:
      max_entries: 40
      selection: "Experiments 11 through 50"
      format: "EXP-N: <=15-word result summary"
      fields: [number, summary]
    description: >-
      Experiments 11 through 50 are collapsed to one-line format under
      the archive section. One-line summaries preserve experiment number
      and result.
  4:
    id: EX_CMP4
    dropped:
      threshold: 50
      action: "Removed entirely"
    description: >-
      Experiments older than 50 are dropped entirely.
  5:
    id: EX_CMP5
    trigger: "When optimize writes a new experiment"
    description: >-
      Compaction runs when the producing skill writes a new entry.
      If >10 full-detail entries exist, collapse the oldest to one-line.
      If >40 one-line entries exist, drop the oldest.
  6:
    id: EX_CMP6
    archive_section:
      heading: "Archived Experiments"
      placement: "Below recent experiments"
    description: >-
      Archive entries sit below the recent experiments section.

EXPERIMENT:
  1:
    id: EX1
    field: number
    type: integer
    required: true
    description: >-
      Sequential experiment number starting from 0. Experiment 0 is
      the baseline measurement. Monotonically increasing.
    validation:
      - "Must be a non-negative integer"
      - "Must be unique across active and archived entries"
      - "Identity is <objective-id>/experiment:<number>"
  2:
    id: EX2
    field: date
    type: string
    format: "YYYY-MM-DD HH:MM"
    required: true
    description: "When the experiment was run."
    validation:
      - "Must match YYYY-MM-DD HH:MM format"
  3:
    id: EX3
    field: label
    type: string
    required: true
    description: >-
      Short descriptive label for the experiment's variable or
      approach (e.g., 'contract.md lazy-reference', 'baseline').
    validation:
      - "Non-empty string"
  4:
    id: EX4
    field: hypothesis
    type: string
    required: true
    description: >-
      What the experiment tests. The pre-registered hypothesis that
      the metric result will confirm or refute.
    validation:
      - "Non-empty string"
  5:
    id: EX5
    field: method
    type: string
    required: true
    description: >-
      How the experiment was conducted. Harness configuration, model,
      flags, substrate setup, and implementation approach.
    validation:
      - "Non-empty string"
  6:
    id: EX6
    field: change
    type: string
    required: true
    description: >-
      What was changed. File paths, line ranges, and description of
      the modification tested.
    validation:
      - "Non-empty string"
  7:
    id: EX7
    field: metric
    type: map
    required: true
    description: >-
      Metric results. Includes primary value, comparison table
      (baseline vs experiment), delta, and breakdown fields
      (peak_context, output_total, turns, tool_uses, etc.).
    sub_fields:
      - field: primary_value
        type: string
        required: true
      - field: delta_vs_baseline
        type: string
        required: true
      - field: breakdown
        type: map
        required: false
    validation:
      - "primary_value is present"
      - "delta_vs_baseline is present"
  8:
    id: EX8
    field: regression
    type: string
    required: false
    description: >-
      Regression check results. Whether linter, tests, and eval
      passed after the change.
  9:
    id: EX9
    field: status
    type: string
    required: true
    description: >-
      Experiment outcome. 'kept' if the experiment improved the metric
      and passed gates; 'discarded' if it did not; 'baseline' for
      Experiment 0 reference measurements.
    validation:
      - "Must be one of: kept, discarded, baseline"
  10:
    id: EX10
    field: conclusion
    type: string
    required: true
    description: >-
      What was learned. Interprets the metric result relative to the
      hypothesis, explains variance, and draws actionable insight.
    validation:
      - "Non-empty string"
  11:
    id: EX11
    field: next
    type: string
    required: false
    description: >-
      What the next experiment should target. Suggests follow-up
      based on findings.
  12:
    id: EX12
    field: escalation
    type: string
    required: false
    description: >-
      Escalation text when N consecutive experiments are discarded.
      Explains why the optimization is stuck and recommends
      deliberation or harness redesign.
  13:
    id: EX13
    field: target_progress
    type: string
    required: false
    description: >-
      Cumulative progress toward the objective target. Shows current
      value, baseline, percentage change, and remaining gap.
  14:
    id: EX14
    field: iteration_log
    type: list[map]
    required: false
    description: >-
      Harness refinement log for baseline experiments. Each entry
      records a run number, issue encountered, and fix applied.

PUBLICATION:
  1:
    id: EP1
    operation: publish
    command: >-
      npx -y agentera@next state experiments publish --objective ID [--id ID]
      --input EXPERIMENT.yaml --format json
    description: >-
      The typed state writer is the mutation authority. It validates the
      objective, identity, caller entry, and canonical entity state before
      atomically publishing one experiment entity.
  2:
    id: EP2
    identity: bare_ten_letter_id
    classification: experiments
    cli_owned_fields: [id, artifact, objective]
    retry: byte_equivalent_identity_is_idempotent
    collision: same_identity_with_different_content_fails
    description: >-
      Retry never duplicates an experiment. Invalid identity, collisions, and
      pre-publication failures preserve active and archive projection bytes.
  3:
    id: EP3
    projection: bounded_entity_list
    durable_archive: not_applicable
    description: >-
      Publication validates and durably publishes one immutable canonical
      experiment entity. Bounded list output never compacts entity records.
  4:
    id: EP4
    classification: legacy_migration_source_provenance
    archive_path: '.agentera/<objective-root>/<objective>/archive/experiments/<experiment-number>.yaml'
    canonical_objective_root: optimize
    readable_legacy_objective_roots: [optimera]
    envelope_schema: agentera.experimentArchive.v1
    required_fields:
      - schemaVersion
      - stable_id
      - objective_id
      - experiment_number
      - record
      - record_sha256
      - provenance
    provenance_fields: [authority, objective_id, experiment_id, storage_scope, publication_order]
    retry: byte_equivalent_envelope_is_idempotent
    collision: same_identity_with_different_bytes_fails
    description: >-
      Archive identity binds stable objective and experiment identity to the
      immutable full record. Legacy projection entries remain readable without
      fabricating archive history that predates this publication contract.
  5:
    id: EP5
    directory_durability: fsync_each_new_child_parent_before_advancing
    exact_full_replay: reconstruct_missing_archive_before_success
    summary_only_replay: never_reconstruct_without_full_detail
    description: >-
      First publication durably records every new archive directory entry.
      Replay may recover only the exact full record still present in the
      projection; compacted summaries and dropped rows are not fabricated.

RETRIEVAL:
  1:
    id: ER1
    list: >-
      npx -y agentera@next state experiments list --objective ID [--limit N]
      [--cursor TOKEN] --format json
    get: >-
      npx -y agentera@next state experiments get --id ID --format json
    description: >-
      List returns newest-first objective-scoped canonical entities. Get returns
      one exact entity by bare ID.
  2:
    id: ER2
    cursor: opaque_snapshot_cursor
    cursor_binding: [collection, objective, order, snapshot]
    detail_availability: [full, summary, unavailable]
    description: >-
      Cursor tokens are copied, never parsed or constructed. List and get retain
      compatibility and provenance when legacy detail is summary-only or absent.
  3:
    id: ER3
    maximum_limit: 100
    max_serialized_utf8_bytes: 32768
    omission_fields: [omitted, omitted_count, omission_reason, retrieval]
    description: >-
      Structured pages omit whole entries rather than truncating scalar values;
      every addressable omission has continuation or exact-get recovery.

CLOSURE:
  1:
    id: EC1
    field: date
    type: string
    format: "ISO-8601 UTC"
    required: false
    description: >-
      Timestamp when the objective was closed. Per the objective
      closure contract. One closure entry per experiments file.
  2:
    id: EC2
    field: final_value
    type: string
    required: false
    description: >-
      Final metric value at closure. Matches the objective's
      closure final_value.
  3:
    id: EC3
    field: target
    type: string
    required: false
    description: >-
      Target that was met or abandoned at closure.
  4:
    id: EC4
    field: reason
    type: string
    required: false
    description: >-
      Why the objective was closed. Per the objective closure contract.

ARCHIVE:
  1:
    id: EA1
    field: summary
    type: string
    required: true
    description: >-
      One-line archive entry for a compacted experiment. Format:
      'EXP-N: <=15-word result summary'.
      Preserves experiment number and outcome.
    validation:
      - "Must include experiment number"
      - "Summary portion must be <=15 words"

VALIDATION:
  1:
    id: EV1
    rule: unique_entity_ids
    severity: error
    description: >-
      Experiment IDs must be unique project-wide and match the canonical pattern.
    checks:
      - "All experiment IDs are unique across canonical entities"
      - "Every ID is ten lowercase letters"
  2:
    id: EV2
    rule: required_fields
    severity: error
    description: >-
      Each full-detail experiment entity record must have: date, label,
      hypothesis, method, change, metric, status, and conclusion.
    checks:
      - "the envelope has id and artifact fields"
      - "date is present and matches YYYY-MM-DD HH:MM"
      - "label is present and non-empty"
      - "hypothesis is present and non-empty"
      - "method is present and non-empty"
      - "change is present and non-empty"
      - "metric is present with primary_value and delta_vs_baseline"
      - "status is present and is 'kept', 'discarded', or 'baseline'"
      - "conclusion is present and non-empty"
  3:
    id: EV3
    rule: compaction_thresholds
    severity: warning
    description: >-
      Warn if the file exceeds compaction thresholds: >10 full-detail
      entries or >40 one-line archive entries.
    checks:
      - "Full-detail entries <= 10"
      - "One-line archive entries <= 40"
      - "Total entries <= 50"
  4:
    id: EV4
    rule: word_budget
    severity: advisory
    description: >-
      Advisory check. Per-experiment entry should be <=300 words;
      full file should be <=2500 words.
    checks:
      - "Per-experiment word count <= 300"
      - "Total file word count <= 2500"
  5:
    id: EV5
    rule: baseline_first
    severity: warning
    description: >-
      The first experiment (number 0) should have status 'baseline'
      and serve as the reference measurement.
    checks:
      - "Experiment 0 has status 'baseline'"
  6:
    id: EV6
    rule: identity_compatibility
    severity: error
    description: >-
      Experiment identity is objective-scoped. Reads retain legacy entries with
      missing or duplicate numbers as unaddressable data with explicit caveats;
      a new publication must reject ambiguous objective or experiment identity
      before changing objective, experiment, or archive bytes.
    checks:
      - "Objective identity is stable across title and directory rename"
      - "Experiment 0 and later non-negative numbers are addressable"
      - "Duplicate or missing experiment numbers remain visible but unaddressable"
      - "Publication rejects ambiguity before effects"
  7:
    id: EV7
    rule: validated_publication
    severity: error
    description: >-
      New experiments are published only through the typed writer after pure
      identity and schema preflight, with atomic replacement and idempotent retry.
    checks:
      - "Caller input omits the CLI-owned number field"
      - "Objective and experiment identity validate before staging"
      - "Final experiments.yaml bytes validate before atomic replacement"
      - "A byte-equivalent retry returns the existing experiment without duplication"
  8:
    id: EV8
    rule: durable_archive_before_projection
    severity: error
    description: >-
      Newly published full detail must be validated, immutably archived, and
      directory-synced before the compacted projection is replaced.
    checks:
      - "Archive envelope identity and provenance validate before publication"
      - "Every newly created archive directory entry is parent-synced in order"
      - "Archive publication succeeds before projection replacement"
      - "Exact full replay reconstructs a missing archive before success"
      - "Conflicting immutable archive bytes preserve archive and projection"
      - "Retry after archive or projection interruption does not duplicate detail"
