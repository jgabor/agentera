# Todo Artifact Schema
#
# Open issues and tasks maintained by build and audit. Severity-ranked
# checklist of work to be done, resolved items, and deferred work. New writes
# use the typed record below; the legacy description form remains readable only
# through the explicit compatibility boundary used by entity migration.
#
# Marker-absent projects retain TODO.md as legacy authority. After durable
# entity cutover, each item is authoritative in one shared-contract entity
# file and `agentera state todo` renders the bounded human-facing view.

meta:
  name: todo
  version: "1.0.0"
  description: >-
    Open issues and tasks. Produced by capabilities that file work or findings.
    Human-facing legacy aggregate before cutover; bounded entity view after cutover.
  artifact_type: human_facing
  path: "TODO.md"
  producer:
    [document, audit, research, optimize, orchestrate, build, discuss, design]
  consumers: [status, all_skills]
  format: markdown

GROUP_PREFIXES:
  BUDGET: TB
  ITEM: TI
  VALIDATION: TV
  CONVENTION: TC

BUDGET:
  1:
    id: TB1
    scope: full_file
    token_budget: 5000
    description: >-
      Maximum tokens for TODO.md content. Exceeding triggers compaction.

ITEM:
  1:
    id: TI1
    field: severity
    type: string
    required: true
    description: >-
      Issue severity per protocol.yaml SEVERITY_ISSUE:
      critical (⇶), degraded (⇉), normal (→), annoying (⇢).
    validation:
      - "Must be one of: critical, degraded, normal, annoying"
  2:
    id: TI2
    field: kind
    type: string
    required: true
    description: >-
      Work kind rendered as the public `[kind:target]` marker. It is not
      severity; severity describes immediate impact.
  3:
    id: TI3
    field: target_version
    type: string_or_null
    required: true
    clearable: true
    description: >-
      Release target used with release_blocker; stable-cut dependencies need
      not be critical.
  4:
    id: TI4
    field: title
    type: string
    required: true
    description: Short public TODO title, owned by TODO.md.
  5:
    id: TI5
    field: requirements
    type: string_list
    required: true
    clearable: true
    description: Typed public requirements; an empty list is an explicit clear.
  6:
    id: TI6
    field: acceptance
    type: string_list
    required: true
    clearable: true
    description: Typed public acceptance criteria; an empty list is an explicit clear.
  7:
    id: TI7
    field: release_blocker
    type: boolean
    required: true
    description: Release-gate state. Do not infer it from severity.
  8:
    id: TI8
    field: description
    type: string
    required: false
    compatibility: legacy_only
    description: >-
      Legacy public prose retained for existing entities. New typed records
      use title and never store the `[kind:target]` marker in prose.
  9:
    id: TI9
    field: status
    type: string
    required: true
    description: >-
      Current status: open or resolved.
    validation:
      - "Must be one of: open, resolved"
  10:
    id: TI10
    field: readiness
    type: mapping
    required: false
    description: >-
      Reviewer-declared state readiness. Absence means needs-triage and MUST
      NOT be interpreted from description prose. When present, the complete
      nested shape is owned by READINESS below.

PUBLIC_OWNERSHIP:
  description: >-
    TODO.md owns public kind, target version, title, requirements, acceptance,
    release blocker, severity, checkbox status, and within-severity order.
    Agentera owns readiness, dependencies, gates, evidence, and lifecycle
    transition metadata. A public disagreement is a conflict, never a silent
    winner.
  render: "[kind:target] title"
  severity: >-
    Immediate impact only. Release gating is release_blocker plus target_version;
    a stable-cut dependency does not need critical severity.

LIFECYCLE:
  description: >-
    set-severity, supersede, resolve, and reopen are flag-only typed transitions.
    Each requires a reason and date; supersede additionally requires a distinct
    existing replacement ID. Lifecycle operations are never accepted as
    structured record content and never encoded as Markdown strikethrough.
  clearable_patch_fields: [target_version, requirements, acceptance, readiness]
  cli_owned_fields: [id, artifact, status, public_order, lifecycle]
  transition_fields: [reason, date, replacement]

READINESS:
  schema_version: agentera.todoReadiness.v1
  description: >-
    Single authority for a TODO item's intended destination, eligibility,
    attention, recovery, and ordering semantics. Request routing remains
    separate and open-ended language remains host-owned.
  destination:
    phase_authority: protocol.yaml#PHASES[*].capabilities
    description: >-
      The exact allowed destination set is the union of capabilities in the
      canonical PHASES entries. A capability's containing PHASES entry is its
      phase; TODO does not repeat either list or mapping.
    excluded_capabilities:
      status: >-
        Orientation consumes readiness but is not work a TODO can request.
      orchestrate: >-
        Execution mode selects plan tasks but is not a TODO's work intent.
  fields:
    capability:
      type: string
      required: true
      enum_source: protocol.yaml#PHASES[*].capabilities
      description: Reviewer-approved capability that owns the next action.
    reason:
      type: string
      required: true
      non_empty: true
      description: Durable intent explaining why the destination is correct.
    dependencies:
      type: list
      required: true
      description: >-
        Zero or more TODO prerequisites. Only canonical TODO entity IDs are
        valid; artifact-qualified references make cross-artifact mistakes
        explicit instead of guessing identity.
      entries:
        artifact:
          type: string
          required: true
          const: todo
        id:
          type: string
          required: true
          pattern: "^[a-z]{10}$"
    blocked:
      type: [mapping, "null"]
      required: true
      description: Explicit blocker, or null when no blocker is declared.
      fields:
        reason: {type: string, required: true, non_empty: true}
        recovery: {type: string, required: true, non_empty: true}
    gate:
      type: [mapping, "null"]
      required: true
      description: Explicit external or approval gate, or null when ungated.
      fields:
        state: {type: string, required: true, enum: [pending, satisfied]}
        reason: {type: string, required: true, non_empty: true}
        recovery: {type: string, required: true, non_empty: true}
    queue_rank:
      type: integer
      required: true
      minimum: 1
      description: >-
        Reviewer-assigned durable intent order among open items of the same
        severity. Lower values run first; the number is priority, not time.
    order_reason:
      type: string
      required: true
      non_empty: true
      description: Durable reason for the queue_rank assignment.
  evaluation:
    precedence:
      - todo_resolved
      - readiness_absent
      - blocked
      - gate_pending
      - dependency_cross_artifact
      - dependency_missing
      - dependency_cycle
      - dependency_open
      - ordering_conflict
      - actionable
    description: >-
      Evaluate once in this order against complete entity state. The first
      matching result is final; bounded output projection happens afterward.
  outcomes:
    todo_resolved:
      result: resolved
      eligible: false
      attention: none
      recovery: null
    readiness_absent:
      result: needs-triage
      eligible: false
      attention: item
      recovery: Review the item and declare readiness through the typed TODO writer.
    blocked:
      result: blocked
      eligible: false
      attention: item
      recovery: Emit only the declared bounded blocked.recovery action.
    gate_pending:
      result: gated
      eligible: false
      attention: none
      recovery: Emit only the declared bounded gate.recovery action; re-evaluate after the gate is satisfied.
    dependency_cross_artifact:
      result: needs-triage
      eligible: false
      attention: item
      recovery: Replace the reference with a canonical TODO dependency or remove it after review.
    dependency_missing:
      result: needs-triage
      eligible: false
      attention: item
      recovery: Restore the referenced TODO or remove the stale dependency after review.
    dependency_cycle:
      result: needs-triage
      eligible: false
      attention: item
      recovery: Break the cycle by reviewing and updating at least one TODO dependency.
    dependency_open:
      result: waiting
      eligible: false
      attention: none
      recovery: Resolve the canonical TODO dependency, then re-evaluate this item.
    dependency_resolved:
      result: satisfied
      eligible: null
      attention: none
      recovery: null
    ordering_conflict:
      result: needs-triage
      eligible: false
      attention: item
      recovery: Assign distinct queue_rank values to same-severity actionable items after review.
    actionable:
      result: actionable
      eligible: true
      attention: none
      recovery: null
  queue_outcomes:
    mixed_actionable_and_triage:
      selection: highest_ordered_actionable
      attention: bounded_triage_summary
      recovery: Review unannotated or invalid items separately; do not displace actionable work.
    all_non_actionable:
      selection: abstain
      attention: bounded_highest_severity_summary
      recovery: Emit the first matching contract-owned item recovery; never infer plan or build from prose.
  ordering:
    primary: protocol.yaml#SEVERITY_ISSUE
    within_severity: queue_rank_ascending
    duplicate_rank: ordering_conflict
    prohibited_tiebreakers:
      - entity_id
      - file_order
      - filesystem_time
      - created_or_modified_time
      - description_text
    description: >-
      Severity remains primary. Equally severe actionable work is ordered only
      by explicit queue_rank. Duplicate ranks require triage rather than an
      invented chronology or opaque identity tie-break.

CONVENTION:
  1:
    id: TC1
    field: type_tag
    level: advisory
    description: >-
      Each item should carry a type tag such as [fix], [feat], [refactor],
      [chore], [test], [perf], or [docs] for commit-scope alignment and
      scan discoverability.
  2:
    id: TC2
    field: version_suffix
    level: advisory
    description: >-
      Optional train scope in `[type:train]` form, e.g. `[fix:train]`, when
      the work targets a specific release train; most common on feat and fix
      items. Omit the train suffix when the item is not train-scoped.
  3:
    id: TC3
    field: title_format
    level: advisory
    description: >-
      Items within the same severity section should use a consistent format:
      either all plain prose or all "**BoldTitle**: description".
  4:
    id: TC4
    field: resolved_checkbox
    level: advisory
    description: >-
      Resolved items should use a checked GitHub task-list checkbox
      (`- [x]`) before the task text. Open items use `- [ ]`. The
      checkbox state is the canonical completion marker; do not wrap
      resolved text in Markdown strikethrough.
  5:
    id: TC5
    field: severity_band_policy
    level: required
    description: >-
      Severity band policy: all four severity bands (⇶ Critical, ⇉
      Degraded, → Normal, ⇢ Annoying) may be header-only when they
      have no open work. Open items use `- [ ]` only. Resolved items
      must not appear in severity bands (see TC6). Executable checks
      live in packages/cli/src/hooks/validateArtifact/markdown.ts
      `validateMdItems` and packages/cli/src/hooks/compaction/parse.ts.
  6:
    id: TC6
    field: resolved_section_placement
    level: required
    description: >-
      Resolved ledger policy: completed items live only under
      `## ✓ Resolved` as `- [x] [type:train]` checkboxes. Severity
      bands must not contain `- [x]` or legacy `~~` strikethrough
      resolved rows. The compaction gate counts every resolved row
      (including mis-placed rows until migrated) against the uniform
      10/40/50 retention cap. `compact --mode fix` migrates mis-placed
      rows into `## ✓ Resolved` before applying retention.
  7:
    id: TC7
    field: resolved_line_provenance
    level: advisory
    description: >-
      Resolved provenance uses `resolved YYYY-MM-DD` or `resolved @
      <semver>` after the item description. Do not use `resolved on
      feat/v3 @ <hash>` or dual-branch hash reconciliation; git history
      is the archaeology source. Fold the Resolved move into the
      implementation commit — no follow-up hash-backfill commit.
  8:
    id: TC8
    field: single_resolved_section
    level: required
    description: >-
      Exactly one `## ✓ Resolved` section is permitted. Two or more
      `## ✓ Resolved` sections hide the trailing entries from parsing
      (which processes only the first) and from the compaction budget
      gate. Validation (`validateTodoResolvedPlacement`) and compaction
      (status + apply) refuse with an actionable diagnostic when more
      than one is present; merge the duplicates into a single section
      before compacting. See TC6 for placement and TC9 for recovery.
  9:
    id: TC9
    field: bounded_queue_not_lossless_archive
    level: required
    description: >-
      TODO.md is a bounded human-facing queue, not a lossless numbered
      archive. It is excluded from the lossless numbered-archive model
      that governs progress, decisions, and health (those preserve
      verified numbered archives; TODO does not). Older resolved
      entries and their detail bodies may be summarized to one-line or
      removed entirely to stay within the 10/40/50 retention cap;
      removal is destructive in the working tree. The first ten
      resolved rows are the recent/full-detail tier even when they have
      no indented body; rows 11 through 50 are the summary tier; rows
      beyond 50 are dropped. Git history is the designated archaeology
      source for dropped resolved entries, and only for previously
      committed content: inspect prior versions with
      `git log -p -- :/TODO.md` (the `:/` pathspec is project-root-safe
      regardless of the current working directory). Non-Git projects
      have no historical recovery for dropped entries. Compaction
      diagnostics MUST report removed entries as `dropped` and MUST NOT
      describe TODO compaction as a lossless projection.
