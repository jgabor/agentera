        - id: registry
          path: registry.json
          selector: skills[0].version
        - id: cli-package
          path: packages/cli/package.json
          selector: version
        - id: cli-suite-marker
          path: packages/cli/package.json
          selector: agentera.suiteVersion
        - id: skill-frontmatter
          path: skills/agentera/SKILL.md
          selector: frontmatter.version
