        - id: skills
          path: skills
        - id: references
          path: references
      files:
        - id: readme
          path: README.md
        - id: upgrade-guide
          path: UPGRADE.md
        - id: changelog
          path: CHANGELOG.md
        - id: design
          path: DESIGN.md
        - id: license
          path: LICENSE
        - id: registry
          path: registry.json
        - id: routing-evaluation-corpus
