diagnostic_inventory:
  maximum_resources: 96
  maximum_file_bytes: 65536
  resources:
    - vocabulary: claude.skill-link
      id: claude.agentera-skill-link
      aliases: []
      roots: [home]
      kind: symlink
      ownership_mode: ledger_identity_fingerprint
      ownership_evidence: matching whole-resource legacy ledger identity and target fingerprint
      focused_preview: remove_if_owned_else_manual_review
      destinations:
        - "{home}/.claude/skills/agentera"
    - vocabulary: codex.agent-descriptor
      id: codex.agent-descriptor.{name}
      aliases: ["codex.agents.{name}"]
      roots: [home]
      kind: file
      ownership_mode: managed_marker_regular_file
      ownership_evidence: exact declared regular file whose first line is the Codex managed comment
      marker_kind: first_line_exact
      marker_syntax: "# agentera_managed: true"
      focused_preview: remove_if_owned_else_manual_review
      names: [status, vision, discuss, research, plan, build, optimize, audit, document, profile, design, orchestrate, dokumentera, hej, inspektera, inspirera, optimera, orkestrera, planera, profilera, realisera, resonera, visionera, visualisera]
      destinations:
        - "{home}/.codex/agents/{name}.toml"
    - vocabulary: opencode.plugin
      id: opencode.plugin.agentera
      aliases: []
      roots: [home, opencode_config]
      kind: file
      ownership_mode: bounded_fingerprint_and_ledger
      ownership_evidence: bounded official SHA-256 plus matching whole-resource installer ledger identity and fingerprint
      focused_preview: remove_if_owned_else_manual_review
      destinations:
        - "{home}/.config/opencode/plugins/agentera.js"
        - "{opencode_config}/plugins/agentera.js"
    - vocabulary: opencode.command
      id: opencode.command.{name}
      aliases: []
      roots: [home, opencode_config]
      kind: file
      ownership_mode: managed_marker_regular_file
      ownership_evidence: exact declared regular file whose YAML frontmatter has boolean agentera_managed true
      marker_kind: yaml_frontmatter_boolean
      marker_syntax: "agentera_managed: true"
      focused_preview: remove_if_owned_else_manual_review
      names: [agentera, hej]
      destinations:
        - "{opencode_config}/commands/{name}.md"
