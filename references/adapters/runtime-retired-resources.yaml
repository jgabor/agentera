    - vocabulary: legacy.capability-agent
      id: opencode.agent.{name}
      names: [audit, build, design, discuss, document, optimize, orchestrate, plan, profile, research, status, vision, dokumentera, hej, inspektera, inspirera, optimera, orkestrera, planera, profilera, realisera, resonera, visionera, visualisera]
      destinations:
