resources:
  - id: claude.agentera-skill-link
    vocabulary: claude.skill-link
    host: claude
    kind: symlink
    intent: remove
    destination: "{home}/.claude/skills/agentera"
    ledger_status: legacy
    durable_proof: matching whole-resource legacy ledger identity and fingerprint
    never_touch:
      - "{home}/.claude/projects"
      - "{home}/.claude/statsig"
      - "{home}/.claude/settings.json"
      - "{home}/.claude/settings.local.json"
      - "{home}/.claude.json"
      - "{home}/.claude/cache"
      - "{home}/.claude/caches"
      - "{home}/.claude/conversations"
      - "{home}/.claude/credentials"
    safety_note: Only the declared Agentera skill symlink may be removed, and only when a matching legacy ownership ledger still binds its identity and target fingerprint. Transcript, settings, credential, conversation, stats, cache, and ambiguous paths are never cleanup targets.
  - id: codex.agent-descriptor
    vocabulary: codex.agent-descriptor
    host: codex
    kind: file
    intent: remove
    destination: "{home}/.codex/agents/{descriptor}.toml"
    descriptors: [status, vision, discuss, research, plan, build, optimize, audit, document, profile, design, orchestrate, dokumentera, hej, inspektera, inspirera, optimera, orkestrera, planera, profilera, realisera, resonera, visionera, visualisera]
    historical_ids:
      - codex.agents.{descriptor}
    ledger_status: managed
    durable_proof: the canonical migration-only marker rule for each exact declared regular descriptor file
    safety_note: Each descriptor is independently removable only when its exact declared regular file has the canonical first-line Codex marker. Missing, misplaced, malformed, non-regular, or undeclared cases remain preserved.
