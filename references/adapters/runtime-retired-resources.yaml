    - vocabulary: agentera.registration
      id: agentera.registration.plugin.codex
      aliases: []
      roots: [home]
      kind: file
      ownership_mode: manual_review
      ownership_evidence: shared configuration lacks key-level ownership evidence
      focused_preview: manual_review_only
      destinations:
