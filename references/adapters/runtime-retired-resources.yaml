schema_version: agentera.nativeResourceCleanup.v1
status: resource_retirement_contract
decision: nksvqmnevm
authority: references/adapters/runtime-lifecycle-authority.yaml
operation_contract: references/adapters/runtime-lifecycle-operation-contract.yaml
policy:
  host_inventory_exposure: evidence_only
  selection: native_agentera_resource_only
  preview: strictly_read_only
  apply_requires: explicit_approval
  ownership: declared_per_leaf_mode
  shared_configuration: action_required_without_key_level_ownership
  forbidden_ownership_evidence:
    - value_equality
    - resource_name
    - file_equality
  migration_only_managed_marker_exception:
    scope: exact_declared_pre_ledger_regular_files
    authority: diagnostic_inventory resources whose ownership_mode is managed_marker_regular_file
    expected_structural_marker_forms:
      first_line_exact: "# agentera_managed: true"
      body_first_line_exact: "<!-- agentera: managed -->"
      yaml_frontmatter_boolean:
        key: agentera_managed
        value: true
    opt_out: Removing, moving, malforming, or setting the expected marker to false or a non-boolean value opts the exact file out of automatic cleanup.
    boundary: A valid expected marker establishes migration-only ownership only for a regular file at an exact destination declared by a managed-marker diagnostic resource. Symlinks, directories, wrong types, undeclared names, templates, hooks, plugins, shared configuration, package-internal paths, and every non-marker resource class retain their stronger declared ownership rules.
  unsupported_platform_result: action_required
automatic_retirement:
  enabled_resource_ids:
    - opencode.plugin.agentera
  qualification: bounded_sha256_and_matching_installer_ledger
  result_without_match: manual_review
  ownership_evidence:
    journal_schema: agentera.lifecycleOwnershipJournalEvent.v1
    ledger_schema: agentera.lifecycleOwnershipLedger.v1
    ledger_resource_id: opencode.plugin
    status: managed
    scope: whole
    match: exact_destination_kind_identity_and_fingerprint
  variants:
    - id: opencode.plugin.agentera.lifecycle-20260710
      resource_id: opencode.plugin.agentera
      kind: file
      size_bytes: 29253
      sha256: b75c17e44340a30624071567a461a6a7dcf1a426bc9dc2881d813ac0e802a20a
      provenance:
        source_commit: aa33870df05d53745ebad5351b8a352b7dad7780
        source_path: .opencode/plugins/agentera.js
        transformation: None; the lifecycle installer used the exact source bytes.
        verification: Git source has the declared size and SHA-256, and the historical lifecycle installer journal schema records per-install destination, file identity, and fingerprint.
  boundary: A bounded official fingerprint is diagnostic evidence, not ownership. Automatic qualification additionally requires a current clean historical installer journal whose managed whole-resource record matches the exact destination, kind, identity, and fingerprint. The recovered 2026-08-23 npx-bundle copy has no matching ownership record and remains manual review, as do every other altered, unknown, non-regular, or unreadable resource.
accepted_host_evidence:
  - host: codex
    state: supported
    proof: Codex loaded Agentera's specific canonical skill instructions and bootstrap command.
  - host: cursor
    state: supported
    proof: Cursor loaded Agentera's specific canonical skill instructions and bootstrap command.
  - host: opencode
    state: supported
    proof: OpenCode's native CLI listed ~/.agents/skills/agentera/SKILL.md.
  - host: copilot
    state: supported_disabled
    proof: Copilot's native CLI listed the canonical personal-agents skill; its disabled state is intentional.
