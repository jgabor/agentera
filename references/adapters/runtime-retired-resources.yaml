    - path: packages/cli/src/upgrade/appContentRefresh.ts
      responsibility: v2_managed_app_content_refresh
    - path: packages/cli/src/upgrade/compatibility.ts
      responsibility: v2_install_classification
    - path: packages/cli/src/upgrade/installedHooksRetirement.ts
      responsibility: installed_v2_hook_retirement
    - path: packages/cli/src/upgrade/legacyAgentCleanup.ts
      responsibility: v2_native_agent_retirement
    - path: packages/cli/src/upgrade/migrateArtifactsV2ToV3.ts
      responsibility: v2_project_artifact_migration
    - path: packages/cli/src/upgrade/runtimeMigration.ts
      responsibility: v2_native_hook_retirement
    - path: packages/cli/src/upgrade/versionResolution.ts
