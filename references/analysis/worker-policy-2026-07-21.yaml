      files_passed: 194
      tests_passed: 2366
      tests_skipped: 1
    - wall_seconds: 43.972
      vitest_duration_seconds: 43.02
      files_passed: 194
      tests_passed: 2366
      tests_skipped: 1
    - wall_seconds: 44.210
      vitest_duration_seconds: 43.27
      files_passed: 194
      tests_passed: 2366
      tests_skipped: 1
  result: >-
    These three serial source runs passed without timeout, retry, shared-output
