caveat: >-
  setup-vp 1.18.0 executes installer bytes without prior integrity verification
  and can fall back to mutable viteplus.dev or vite-plus main-branch content.
  The previous waiver is not acceptance evidence for the replacement proof.
  Replacement hosted acceptance remains pending; the checkout-free, action-free, setup-free
  OIDC publisher remains excluded.
