project_contract:
  node: 24.19.0
  package_manager: pnpm@10.30.3
  lockfile: pnpm-lock.yaml
  frozen_install_args:
    - --frozen-lockfile
  dependency_script_policy:
    allow_only:
      - esbuild
  no_task_result_cache: true
  oidc_publisher:
    workflow: .github/workflows/publish.yml
    job: publish-development
    setup_vp_allowed: false
    setup_actions_allowed: false

executable_proof:
  command: pnpm -C packages/cli run test:toolchain-baseline
  fixture: isolated temporary workspace; the checkout is not migrated
  coverage:
    - reads packageManager and executes Corepack's pinned pnpm
    - reads onlyBuiltDependencies through live pnpm config
    - installs exact root-local vite-plus 0.3.0 and defeats an earlier stale vp on PATH
    - accepts a matching frozen lockfile and rejects a changed manifest
    - executes the allowed esbuild install script and suppresses an unlisted install script
  timing: emitted as observations only; no threshold is asserted
  last_observation:
    environment: isolated Linux x64 workspace under Node 24.19.0
    result: pass
    pnpm:
      accepted: 10.30.3
      rejected: pnpm@latest
    ownership:
      fresh_bare_vp: 0.1.19
      installed_root_vp: 0.3.0
      stale_owned_project_commands: false
    frozen_lockfile:
      accepted: true
      rejected_error: ERR_PNPM_OUTDATED_LOCKFILE
    dependency_scripts:
      allowed_executed: esbuild
      rejected_suppressed: blocked-build
    elapsed_seconds:
      fresh_frozen_install: 0.340
      installed_vp_frozen_install: 0.495
    timing_interpretation: observational only; not a budget

