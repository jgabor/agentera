  - runtime_lifecycle
  - decision_attention
  - next_action
  - orchestration_context
  - closeout_context
  - evidence_context
  - benchmark_context
  - execution_context
  - source
  - source_contract
  - capability_context
  - issues
fixtures:
  pass:
    - consumer: opencode_compaction_context
      depends_on:
        - mode
        - profile
        - health
        - issues
        - plan
        - progress
        - next_action
        - attention
    - consumer: status_dashboard_renderer
      depends_on:
        - health
        - todo
        - plan
        - objective
        - profile
        - next_action
        - attention
        - state_presence
        - source_contract
    - consumer: capability_context_dispatcher
      depends_on:
        - command
        - status
        - capability_context
    - consumer: bare_agentera_route
      depends_on:
        - next_action
        - source_contract.capability_context
        - source_contract
  fail:
    - consumer: v2_bundle_consumer
      depends_on:
