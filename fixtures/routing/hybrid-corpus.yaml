receipt_cases:
  - { id: HOLDOUT-RECEIPT-SELECT-PASS, partition: holdout, valid: true, receipt: { outcome: select, capability: plan, compound: none } }
  - { id: ADV-RECEIPT-SELECT-FAIL, partition: adversarial, valid: false, receipt: { outcome: select, compound: none }, error: missing_capability }
  - { id: HOLDOUT-RECEIPT-CLARIFY-PASS, partition: holdout, valid: true, receipt: { outcome: clarify, question: "Do you want a plan or implementation?" } }
  - { id: ADV-RECEIPT-CLARIFY-FAIL, partition: adversarial, valid: false, receipt: { outcome: clarify }, error: missing_question }
  - { id: HOLDOUT-RECEIPT-NO-MATCH-PASS, partition: holdout, valid: true, receipt: { outcome: no_match } }
  - { id: ADV-RECEIPT-NO-MATCH-FAIL, partition: adversarial, valid: false, receipt: { outcome: no_match, capability: plan }, error: forbidden_capability }
  - { id: HOLDOUT-RECEIPT-COMPOUND-PASS, partition: holdout, valid: true, receipt: { outcome: select, capability: plan, compound: preserve, remainder_span: { start: 23, end: 40 } } }
  - { id: ADV-RECEIPT-COMPOUND-FAIL, partition: adversarial, valid: false, receipt: { outcome: select, capability: plan, compound: execute }, error: invalid_compound }
