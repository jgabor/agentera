schema_version: agentera.hybrid_routing_corpus.v1
status: frozen
text_provenance: All request text in this fixture is synthetic and authored for conformance testing.
retention_policy: >-
  This fixture may contain only synthetic or explicitly consented text. Evaluation
  reports retain case IDs and metrics, never these request strings by default.
freeze_policy: >-
  Development, holdout, and adversarial entries are immutable in this corpus
  version. Additions or expectation changes require a new schema_version and a
  new corpus file; holdout cases may not guide phrase selection.
partitions:
  development: { status: frozen, purpose: phrase inventory and contract development }
  holdout: { status: locked, purpose: predeclared semantic receipt evaluation }
  adversarial: { status: frozen, purpose: abstention and invalid-receipt safety }

route_cases:
