  - question: "Does the candidate meet the existing package budget on the contracted hosted runner?"
    affects_task: 8
    resolve_by: "Use candidate-only hosted verification and repair failed candidate work within the approved window; report any unresolved gate honestly."
overall_acceptance: >-
  GIVEN the candidate is complete WHEN its evidence is reviewed THEN Vite+
  provides the consolidated development path, required behavior and trust
  boundaries hold, changed coverage and concessions are explicit, paired cold
  and warm timings show the actual effect, cold hosted development verification
  passes with package wall time at or below 515 seconds, and adoption or
  publication still requires separate approval.
