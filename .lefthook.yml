output: [summary, failure]

pre-commit:
  commands:
    agentera-state:
      run: timeout --foreground 10s npx -y agentera@next check compact
      glob: [".agentera/**", "TODO.md"]
    py-ts-parity:
      run: bash packages/cli/scripts/py_ts_parity.sh --check --json
      glob:
        - "scripts/extract_corpus.py"
        - "packages/cli/scripts/py_ts_parity.sh"
        - "packages/cli/scripts/generate-extract-corpus-parity.mjs"
        - "packages/cli/src/analytics/extractCorpus/**"
        - "packages/cli/test/analytics/extractCorpus*.test.ts"
    staged:
      priority: -1
      # Explicit local path fails closed without bootstrap; recover with vp install.
      # Native staging hides partial hunks and restores them; never stage_fixed.
      run: ./node_modules/.bin/vp staged --hide-partially-staged
    related:
      run: ./node_modules/.bin/vp test related --run --project local --passWithNoTests {staged_files}
      glob: ["packages/cli/src/*.{ts,js}", "packages/cli/src/**/*.{ts,js}", "packages/cli/test/*.{ts,js,mjs}", "packages/cli/test/**/*.{ts,js,mjs}"]
    guards:
      run: ./node_modules/.bin/vp test run --project guards
      glob:
        - "*.{json,jsonc,yaml,yml}"
        - "*.config.{ts,js,mjs}"
        - "packages/cli/vitest.shared.ts"
        - "packages/cli/scripts/**"
        - "packages/cli/test/**"
        - "scripts/**"
        - "skills/**"
        - "references/**"
        - ".github/workflows/**"
    typecheck:
      run: ./node_modules/.bin/vp run typecheck
      glob: ["*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,yaml,yml}"]
