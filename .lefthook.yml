    # "skips",
  ]

pre-commit:
  commands:
    agentera:
      run: pnpm -C packages/cli build && node packages/cli/dist/bin/agentera.js check compact
    py-ts-parity:
      run: bash packages/cli/scripts/py_ts_parity.sh --check --json
    docs:
      run: bunx markdownlint --dot --fix --disable MD013 MD024 MD029 MD033 MD036 MD040 MD041 MD060 -- {staged_files}
      stage_fixed: true
      glob: "*.md"
      exclude:
        - "docs/plans/*.md"
        - "skills/*/references/contract.md"
    configs:
      run: vp fmt --write {staged_files}
      stage_fixed: true
      glob: "*.json"
    tests:
      run: bash scripts/precommit-vitest.sh {staged_files}
      glob:
        - "packages/cli/**/*.ts"
        - "packages/cli/package.json"
        - "packages/cli/vite.config.ts"
        - "packages/cli/vite.package.config.ts"
        - "packages/cli/vitest.shared.ts"
        - "packages/cli/scripts/*.mjs"
        - "packages/cli/test/packaging/**"
        - "references/analysis/verification-policy.yaml"
        - "scripts/precommit-vitest.sh"
        - "skills/**/*.{yaml,yml,md}"
        - "references/**/*.{yaml,yml}"
        - "registry.json"
        - "protocol.yaml"
        - ".lefthook.yml"
        - ".github/workflows/**"
