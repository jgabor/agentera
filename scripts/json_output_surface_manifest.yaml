- id: prime-briefing
  command: agentera prime
  selector: (default briefing)
  argv:
  - prime
  inventory_classification: change
  budget_classification: bounded_brief
  measurement_scope: primary
  fixture: bounded_state_with_disposable_bundle
  enforcement_tier: enforce
  # Bounded default decision brief (Plan Task 3). The bare default emission
  # projects the full orientation payload to routing-essential leaves plus named
  # recovery pointers for omitted rich state; pretty UTF-8 JSON + trailing
  # newline is measured and an over-budget brief is rejected in favor of a
  # bounded degraded envelope. prime-dashboard (35000) keeps full fidelity.
  byte_budget: 12000
  token_budget: 3000
