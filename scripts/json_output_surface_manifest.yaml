      token_budget: 14000
    document:
      byte_budget: 55000
      token_budget: 14000
    profile:
      byte_budget: 55000
      token_budget: 14000
    design:
      byte_budget: 55000
      token_budget: 14000
    orchestrate:
      byte_budget: 55000
      token_budget: 14000
