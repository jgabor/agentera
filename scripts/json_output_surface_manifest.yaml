  token_budget: 6500
- id: hej-capability-context-full
  command: agentera hej --format json --capability-context {capability}
  selector: --format json --capability-context <capability> (removed 3.0)
  argv:
  - hej
  - --format
  - json
  - --capability-context
  - '{capability}'
  expand_by: capability
  inventory_classification: change
  budget_classification: unbudgeted
  measurement_scope: primary
  fixture: repo_root
  enforcement_tier: removed_3_0
- id: prime-capability-context
  command: agentera prime --context {capability}
  selector: --context <capability>
  argv:
  - prime
  - --context
  - '{capability}'
  - --fields
  - capability_context
  expand_by: capability
  profile: slim
  inventory_classification: change
  budget_classification: slim_capability
  measurement_scope: primary
  fixture: repo_root
  enforcement_tier: enforce
  # Current v3 capability names are the published expansion set. Generic
  # capability capsules retain the full instructions body and use the 55000
  # byte ceiling declared by state-storage-authority; status has its dedicated
  # 25000-byte one-call capsule above. The retired v2 aliases remain listed only
  # by the removed_3_0 row above.
  budget_by_capability:
    status:
      byte_budget: 25000
      token_budget: 6500
    vision:
      byte_budget: 55000
      token_budget: 14000
    discuss:
      byte_budget: 55000
      token_budget: 14000
    research:
      byte_budget: 55000
      token_budget: 14000
    plan:
      byte_budget: 55000
      token_budget: 14000
    build:
